<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>tiderace — desk</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0B1518">
<style>
/* The reading half of the app.

   These four -- the log's own history, what other people are reporting,
   claims waiting to be believed, and the federal offshore rules -- were CLI
   only, which meant nobody ever looked at them. They do not belong on the map
   either: none is something you do with a rod in your hand, and the map screen
   was decluttered on purpose. So: a second page, reached from the map and
   reachable back, scrolling like a document because that is what it is. */
:root{
  --ground:#0B1518; --panel:#122126; --panel-2:#16292F; --hair:#274048;
  --ink:#E4ECEE; --ink-2:#C2D3D7; --muted:#8CA3A8;
  --accent:#F04FA0; --depth:#4FB3C7;
  --good:#4FBF89; --warn:#D9A521; --crit:#E0705F;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0; min-height:100%}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--display); font-size:15px; line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
}
header{
  position:sticky; top:0; z-index:10; background:var(--ground);
  border-bottom:1px solid var(--hair);
  display:flex; align-items:center; gap:10px; padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top));
}
.brand{font:700 17px/1 var(--display); letter-spacing:-.01em}
.brand span{color:var(--accent)}
a.back{
  margin-left:auto; text-decoration:none; color:var(--ink);
  border:1px solid var(--hair); border-radius:8px;
  padding:9px 13px; font:600 13px/1 var(--display); background:var(--panel);
}
nav{
  display:flex; gap:0; overflow-x:auto; border-bottom:1px solid var(--hair);
  position:sticky; top:57px; background:var(--ground); z-index:9;
}
nav button{
  flex:1 0 auto; min-height:48px; padding:0 16px;
  background:none; border:none; border-bottom:2px solid transparent;
  color:var(--muted); font:600 13px/1 var(--display); cursor:pointer;
  white-space:nowrap;
}
nav button.on{color:var(--ink); border-bottom-color:var(--accent)}
main{padding:0 0 40px}
section{display:none; padding:16px}
section.on{display:block}
h2{font:600 13px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase;
   color:var(--muted); margin:0 0 12px}
.big{font:700 30px/1 var(--display); font-variant-numeric:tabular-nums}
.card{
  background:var(--panel); border:1px solid var(--hair); border-radius:10px;
  padding:14px 15px; margin-bottom:11px;
}
.row{display:flex; align-items:baseline; gap:10px; padding:8px 0;
     border-bottom:1px solid rgba(39,64,72,.55); font:13px/1.4 var(--mono)}
.row:last-child{border-bottom:none}
.row .k{color:var(--ink-2)}
.row .v{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink)}
.dim{color:var(--muted); font:12px/1.6 var(--mono)}
/* Rules read left-to-right as sentences. `.row .v` has margin-left:auto, which
   right-aligns the value -- correct for a column of numbers, wrong for "open
   through 12/31 · slot 28-31" · 1 fish/person/day", which came out ragged and
   sometimes shoved to the far edge depending on length. */
#regs .rule{padding:9px 0; border-top:1px solid rgba(39,64,72,.55)}
#regs .rule:first-of-type{border-top:none}
#regs .md{font:10px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
          color:var(--depth)}
#regs .md .adv{color:var(--muted); letter-spacing:0; text-transform:none}
#regs .rv{font:13px/1.5 var(--mono); color:var(--ink); margin-top:5px}
#regs .rv.shut{color:var(--crit)}
#regs .names{font:13px/1.9 var(--mono); color:var(--ink-2)}
.warn{color:var(--warn)}
.crit{color:var(--crit)}
.tag{
  display:inline-block; font:10px/1 var(--mono); letter-spacing:.08em;
  text-transform:uppercase; color:var(--depth);
  border:1px solid var(--hair); border-radius:999px; padding:4px 8px;
  margin-right:6px;
}
.tag.hi{color:var(--good)} .tag.lo{color:var(--warn)}
.bar{height:7px; border-radius:4px; background:var(--hair); margin:10px 0}
.bar i{display:block; height:100%; border-radius:4px; background:var(--accent)}
a{color:var(--depth)}
.empty{color:var(--muted); font:13px/1.6 var(--mono); padding:8px 0}
@media (min-width:760px){ main{max-width:760px; margin:0 auto} }
</style>

<header>
  <div class="brand">tide<span>race</span> · desk</div>
  <a class="back" href="/">← map</a>
</header>

<nav>
  <button data-s="history" class="on">Log</button>
  <button data-s="reports">Reports</button>
  <button data-s="regs">Regs</button>
  <button data-s="hms">HMS</button>
  <button data-s="sources">Sources</button>
</nav>

<main>
  <section id="history" class="on"><div class="empty">reading…</div></section>
  <section id="reports"><div class="empty">reading…</div></section>
  <section id="regs"><div class="empty">reading…</div></section>
  <section id="hms"><div class="empty">reading…</div></section>
  <section id="sources"><div class="empty">reading…</div></section>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const LOADED = {};
async function get(url){
  const r = await fetch(url);
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
}

async function show(name){
  document.querySelectorAll('nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.s === name));
  document.querySelectorAll('section').forEach(s =>
    s.classList.toggle('on', s.id === name));
  if (LOADED[name]) return;
  LOADED[name] = true;
  try { await RENDER[name](); }
  catch (e) {
    LOADED[name] = false;
    $('#' + name).innerHTML =
      `<div class="empty">Could not load: ${esc(e.message)}</div>`;
  }
}

const RENDER = {
  async history(){
    const d = await get('/api/history');
    const need = Math.max(0, 60 - d.trips);
    const rows = Object.entries(d.by_species || {}).sort()
      .map(([sp, b]) =>
        `<div class="row"><span class="k">${esc(sp.replace(/_/g,' '))}</span>` +
        `<span class="v">${b.trips} trips · ${b.fish} fish · ${b.blanks} blank</span></div>`)
      .join('') || '<div class="empty">Nothing logged yet.</div>';
    $('#history').innerHTML =
      `<h2>What is on file</h2>
       <div class="card">
         <div class="big">${d.trips}</div>
         <div class="dim">trips · ${d.fish} fish · ${d.blanks} blank</div>
         <div class="bar"><i style="width:${Math.min(100, d.trips / 60 * 100)}%"></i></div>
         <div class="dim">${d.ready_to_fit
           ? 'Enough to fit weights against.'
           : esc(need + ' more trips before fitting the weights is worth doing.')}</div>
       </div>
       <h2>By species</h2>
       <div class="card">${rows}</div>
       <div class="dim">Blanks count as much as fish. A model trained only on
         good days learns that every day is good.</div>`;
  },

  async reports(){
    const d = await get('/api/reports');
    // What other people are seeing that the model has no opinion about. This
    // is the list that says what the forecast is blind to, which is worth more
    // than another number about what it already knows.
    const un = Object.entries(d.unmodelled || {})
      .sort((a, b) => b[1] - a[1])
      .map(([sp, n]) => `<span class="tag lo">${esc(sp)} ×${n}</span>`).join('')
      || '<span class="dim">none</span>';
    const dis = (d.disagreements || []).map(x =>
      `<div class="row"><span class="k">${esc(x.species || x.detail || '')}</span>` +
      `<span class="v">${esc(x.note || x.why || '')}</span></div>`).join('')
      || '<div class="empty">Nothing contradicting the model right now.</div>';
    const rows = (d.rows || []).slice(0, 40).map(r =>
      `<div class="row"><span class="k">${esc(r.species_raw || r.species || '?')}` +
      `${r.place ? ' · ' + esc(r.place) : ''}</span>` +
      `<span class="v">${esc(r.day || '')} · ${esc(r.outlet || '')}</span></div>`)
      .join('') || '<div class="empty">No reports scraped yet.</div>';
    $('#reports').innerHTML =
      `<h2>Species the model does not score</h2>
       <div class="card">${un}
         <div class="dim" style="margin-top:9px">Turning up in reports with no
           profile behind them. Reality contradicting the model is the useful
           kind of disagreement.</div></div>
       <h2>Disagreements</h2>
       <div class="card">${dis}</div>
       <h2>${d.count} reports</h2>
       <div class="card">${rows}</div>
       <div class="dim">Second-hand by definition: somebody else's word about
         somebody else's day, and never a substitute for your own log.</div>`;
  },

  /* The rules as they stand, with the notice attached.
   *
   * This tab used to be Review: forty-odd extractor claims, each with a
   * confidence score, and no approve button anywhere because auto-apply had
   * already made one pointless. Matt, on 3 September 2026: "I shouldn't be
   * reviewing that stuff. I just want the latest regulations posted, and then
   * a link in the app that I can click on to verify them on the actual page."
   *
   * So this shows current state per species and puts the RIDEM page one tap
   * away. Verifying one number you care about before a trip is a smaller job
   * than clearing a queue, and it is the job he actually does. */
  async regs(){
    const d = await get('/api/regs');
    const mode = r => {
      const shut = r.open === false;
      // The note stays out of the status line. Joined into it, striped bass
      // read as one long red sentence in which "the minimum is 34 in --
      // LARGER than the recreational slot" looked like part of the closure
      // rather than the thing that catches you out when it reopens.
      const bits = [];
      if (r.line) bits.push(esc(r.line));
      // Every rule the machine applied on its own, each with the sentence it
      // was read out of. A number with no notice behind it is not checkable,
      // and checkable is the whole point of this tab.
      const ap = (r.applied || []).map(a => {
        const wh = [a.change_type, a.value, a.period, a.sub_fishery,
                    a.effective_date && ('effective ' + a.effective_date),
                    a.reopens_on && ('reopens ' + a.reopens_on)]
                   .filter(Boolean).map(esc).join(' · ');
        return `<div class="dim">${wh}${a.relaxes === true
          ? ' <b class="crit">looser than before — check this one</b>' : ''}
          ${a.quote ? `<div class="dim">“${esc(a.quote)}”</div>` : ''}</div>`;
      }).join('');
      return `<div class="rule">
          <div class="md">${esc(r.mode)}${r.advisory
            ? ' <span class="adv">· advisory</span>' : ''}</div>
          <div class="rv ${shut ? 'shut' : ''}">${shut ? 'CLOSED · ' : ''}${bits.join(' · ') || '—'}</div>
          ${r.note ? `<div class="dim">${esc(r.note)}</div>` : ''}
          ${ap}
          ${r.stale ? `<div class="dim crit">last read off a notice
             ${esc(r.checked_on)} — treat as out of date</div>` : ''}
          ${r.source ? `<div class="dim"><a href="${esc(r.source)}" rel="noopener"
             target="_blank">verify at the source →</a></div>` : ''}
        </div>`;
    };
    const modelled = (d.rows || []).filter(r => r.modelled);
    const not = (d.rows || []).filter(r => !r.modelled);
    const cards = modelled.map(r => `<div class="card">
        <div><b>${esc(r.name)}</b></div>
        ${(r.modes || []).map(mode).join('')}
        ${(r.differences || []).length
          ? `<div class="dim">rec vs commercial: ${r.differences.map(esc).join('; ')}</div>`
          : ''}
      </div>`).join('') || '<div class="empty">No rules transcribed yet.</div>';
    /* Absence and refusal are different facts, so the ones with no rule are
     * named rather than left out of the list.
     *
     * Named, though -- not each given the same twenty-word caveat. The first
     * version printed "Size and season for X are not modelled in this app.
     * That means nobody verified them..." eighteen times, about 1.4KB of
     * identical sentence that took two thirds of the page and pushed the six
     * actual rules off the top. That is the same volume problem that made the
     * Review tab useless, rebuilt in the thing meant to replace it. The
     * caveat is a property of the whole list, so it is stated once. */
    const gaps = not.length
      ? `<h2>${not.length} with no rule transcribed</h2>
         <div class="card">
           <div class="names">${not.map(r => esc(r.name)).join(' · ')}</div>
           <div class="dim" style="margin-top:9px">Size and season for these
             are <b>rules not modelled</b> in this app — nobody read them off a
             notice. That means unverified, not that there are none. Check the
             RIDEM table before keeping one.</div>
         </div>`
      : '';
    $('#regs').innerHTML =
      `<h2>Rules in force ${esc(d.as_of || '')}</h2>
       ${d.applied_at ? `<div class="dim">${esc(String(d.applied_count || 0))}
          applied automatically from RIDEM notices, last run
          ${esc(d.applied_at)}.${(d.relaxed || []).length
            ? ` ${(d.relaxed || []).length} of them loosened a limit — those are
                the ones a parse error would cost money on.` : ''}</div>` : ''}
       ${cards}
       ${gaps}
       <div class="dim">Nothing here is approved by anybody. RIDEM published it,
         the app mirrored it, and the link goes to the page it came from — check
         the one you are about to act on. When it says a rule is not modelled
         that is a fact about this app, not permission to keep the fish.</div>`;
  },

  async sources(){
    const d = await get('/api/scrapes');
    const rows = (d.sources || []).map(r => {
      const age = r.age_hours == null ? 'never'
        : r.age_hours < 48 ? Math.round(r.age_hours) + ' h ago'
        : Math.round(r.age_hours / 24) + ' d ago';
      const cls = r.stale ? 'crit' : '';
      const why = !r.ever_ran ? 'no run yet'
        : !r.ok ? esc(r.detail || 'failed')
        : esc(r.detail || 'ok');
      return `<div class="row">
        <span class="k">${esc(r.source)}</span>
        <span class="v ${cls}">${age} · ${why}</span></div>`;
    }).join('') || '<div class="empty">No sources configured.</div>';
    $('#sources').innerHTML =
      `<h2>Freshness</h2>
       <div class="card">
         <div class="${(d.stale || []).length ? 'warn' : ''}">${esc(d.line)}</div>
       </div>
       <h2>Every source</h2>
       <div class="card">${rows}</div>
       <div class="dim">Regulations are read daily and go loud after 48 h;
         the report outlets publish weekly and go loud after 10 days. A source
         that has never run is shown overdue rather than left blank — a scrape
         that fails on a timer is worse than one you run by hand, because the
         manual one at least fails in front of you.</div>
       <h2>Schedule</h2>
       <div class="card">
         <div class="row"><span class="k">RIDEM</span>
           <span class="v">daily, 06:20 ±40 min</span></div>
         <div class="row"><span class="k">report outlets</span>
           <span class="v">Thursdays, 07:10 ±1 h</span></div>
       </div>
       <div class="dim">systemd user timers, Persistent=true — a run missed
         because the machine was off happens when it comes back rather than
         being skipped in silence.</div>`;
  },

  async hms(){
    const d = await get('/api/hms');
    const rows = (d.species || []).map(s =>
      `<div class="row"><span class="k">${esc(s.key.replace(/_/g,' '))}</span>` +
      `<span class="v">${esc(s.line)}</span></div>`).join('');
    $('#hms').innerHTML =
      `<h2>Federal, not state</h2>
       <div class="card">
         <div class="warn">${esc(d.permit)}</div>
         <div class="dim" style="margin-top:9px">
           <a href="${esc(d.permit_url)}" rel="noopener" target="_blank">${esc(d.permit_url)}</a>
         </div>
       </div>
       <h2>Species</h2>
       <div class="card">${rows}</div>
       <div class="dim">These are the rules for the water you run to for tuna.
         They are federal and a Rhode Island licence does not touch them.
         Nothing here is a substitute for the permit conditions you hold.</div>`;
  },
};

document.querySelectorAll('nav button').forEach(b =>
  b.onclick = () => show(b.dataset.s));
show('history');
</script>
