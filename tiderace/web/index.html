<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1518">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>Tiderace — Narragansett Bay</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0B1518; --panel:#122126; --panel-2:#16292F; --hair:#274048;
  --ink:#E4ECEE; --ink-2:#C2D3D7; --muted:#8CA3A8;
  --accent:#F04FA0; --depth:#4FB3C7;
  --good:#4FBF89; --warn:#D9A521; --crit:#E0705F;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--display); font-size:14px; overflow:hidden;
}
#app{display:grid; grid-template-columns:1fr 360px; height:100%}
#map{width:100%; height:100%; background:var(--ground)}

/* ------------------------------------------------------------ top bar */
#bar{
  position:absolute; top:12px; left:12px; z-index:5;
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  background:rgba(18,33,38,.94); border:1px solid var(--hair);
  border-radius:6px; padding:8px 10px; backdrop-filter:blur(8px);
  /* Leave the top-right corner free for the zoom, scale and attribution
     controls, which now live there. */
  max-width:calc(100% - 96px);
}
.brand{
  font-weight:700; letter-spacing:-.02em; font-size:15px; padding-right:10px;
  border-right:1px solid var(--hair); margin-right:2px; white-space:nowrap;
}
.brand span{color:var(--accent)}
select,button{
  font-family:var(--display); font-size:13px; font-weight:500;
  background:var(--panel-2); color:var(--ink); border:1px solid var(--hair);
  border-radius:4px; padding:6px 9px; cursor:pointer;
}
select:hover,button:hover{border-color:var(--depth)}
button.primary{background:var(--accent); border-color:var(--accent); color:#12060D; font-weight:600}
button.primary:hover{filter:brightness(1.1)}
label.chk{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-2); cursor:pointer}
#netstate{
  font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; padding:.3em .55em; border-radius:3px; white-space:nowrap;
}
#netstate.off{color:var(--crit); border:1px solid var(--crit); background:rgba(224,112,95,.12)}
#netstate.queued{color:var(--warn); border:1px solid var(--warn); background:rgba(217,165,33,.12)}
#netstate.ok{display:none}
#mode{
  font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; padding:.3em .55em; border-radius:3px; white-space:nowrap;
}
#mode.rec{color:var(--muted); border:1px solid var(--hair)}
#mode.com{color:#D9A521; border:1px solid #D9A521; background:rgba(217,165,33,.1)}
#regs{
  font-family:var(--mono); font-size:11px; line-height:1.5; color:var(--ink-2);
  background:var(--panel-2); border:1px solid var(--hair);
  border-left:2px solid var(--depth); border-radius:0 4px 4px 0; padding:9px 11px;
}
#regs.closed{border-left-color:var(--crit)}
#regs b{color:var(--ink)}
#regs .warn{color:#D9A521; display:block; margin-top:6px}

/* ---------- chart overlay menu ---------- */
#layers{
  display:none; position:absolute; top:calc(100% + 6px); right:0; z-index:6;
  background:rgba(18,33,38,.97); border:1px solid var(--hair); border-radius:6px;
  padding:9px 11px; min-width:220px; backdrop-filter:blur(8px);
}
#layers.open{display:block}
#layers h4{margin:0 0 7px; font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--accent); font-family:var(--mono); font-weight:600}
#layers label{display:flex; align-items:center; gap:7px; font-size:12px;
  color:var(--ink-2); cursor:pointer; padding:3px 0}
#layers .sw{width:10px; height:10px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.5)}
#layers .sw.ramp{width:26px; border-radius:2px}
#layers .cnt{margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--muted)}
#depthkey{margin:6px 0 2px}
#depthkey .bar{display:flex; height:7px; border-radius:2px; overflow:hidden}
#depthkey .bar i{flex:1}
#depthkey .ends{display:flex; justify-content:space-between; margin-top:3px;
  font-family:var(--mono); font-size:9.5px; color:var(--muted)}
#layers .hint{margin:7px 0 0; padding-top:7px; border-top:1px solid var(--hair);
  font-size:10.5px; color:var(--muted); line-height:1.45; font-family:var(--mono)}

/* ------------------------------------------------------ time scrubber */
#timebar{
  position:absolute; bottom:14px; left:12px; right:calc(360px + 12px); z-index:5;
  background:rgba(18,33,38,.94); border:1px solid var(--hair); border-radius:6px;
  padding:10px 14px 12px; backdrop-filter:blur(8px);
}
#timebar .row{display:flex; align-items:baseline; gap:12px; margin-bottom:7px}
#tlabel{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--accent)}
#tsub{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.05em}
input[type=range]{width:100%; accent-color:var(--accent); cursor:pointer}
#ticks{display:flex; justify-content:space-between; font-family:var(--mono);
  font-size:10px; color:var(--muted); margin-top:3px; letter-spacing:.04em}

/* -------------------------------------------------------------- panel */
#panel{
  background:var(--panel); border-left:1px solid var(--hair);
  overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px;
}
.ph{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent);
  display:flex; align-items:center; gap:8px;
}
.ph::after{content:""; flex:1; height:1px; background:var(--hair)}
.card{background:var(--panel-2); border:1px solid var(--hair); border-radius:5px; padding:12px}
.card h3{margin:0 0 2px; font-size:15px; letter-spacing:-.01em}
.card .sub{font-family:var(--mono); font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted)}
.big{font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1;
  font-variant-numeric:tabular-nums}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin-top:10px;
  font-family:var(--mono); font-size:11.5px}
.kv dt{color:var(--muted); letter-spacing:.05em}
.kv dd{margin:0; color:var(--ink-2); font-variant-numeric:tabular-nums}
.why{margin-top:10px; padding-top:10px; border-top:1px solid var(--hair);
  font-size:12px; color:var(--ink-2); line-height:1.5}
.rank{display:flex; flex-direction:column; gap:1px}
.rank button{
  display:grid; grid-template-columns:38px 1fr auto; gap:9px; align-items:center;
  width:100%; text-align:left; background:var(--panel-2); border:1px solid transparent;
  border-radius:4px; padding:7px 9px; font-size:12.5px;
}
.rank button:hover{border-color:var(--depth)}
.rank button.on{border-color:var(--accent)}
.rank .s{font-family:var(--mono); font-weight:600; font-variant-numeric:tabular-nums; font-size:12px}
.rank .m{font-family:var(--mono); font-size:10px; color:var(--muted)}
.empty{color:var(--muted); font-size:12.5px; line-height:1.55}
.note{font-size:11.5px; color:var(--muted); line-height:1.5}
/* The dropped mark reads as a crosshair rather than another spot dot: it is a
   question you asked, not a place anyone has recommended. */
.markpin{width:22px; height:22px; border-radius:50%; border:2px solid var(--accent);
  box-shadow:0 0 0 1px rgba(11,21,24,.9), 0 0 12px rgba(240,79,160,.55);
  background:rgba(240,79,160,.16); cursor:pointer}
.conf{font-family:var(--mono); font-size:10px; text-transform:uppercase;
  letter-spacing:.08em; padding:1px 6px; border-radius:3px; border:1px solid var(--hair)}
.conf.good{color:#5FE3C0; border-color:#2F6E60}
.conf.fair{color:#D9A521; border-color:#6E5A21}
.conf.poor{color:#E0705F; border-color:#7A3A32}
.markwarn{color:#D9A521; font-size:11px; line-height:1.5; margin-top:8px}
.markwin{display:flex; justify-content:space-between; gap:8px; font-family:var(--mono);
  font-size:11px; padding:4px 0; border-top:1px solid var(--hair)}
form{display:flex; flex-direction:column; gap:7px}
input[type=text],input[type=number],input[type=datetime-local]{
  font-family:var(--mono); font-size:12px; background:var(--ground); color:var(--ink);
  border:1px solid var(--hair); border-radius:4px; padding:6px 8px; width:100%;
}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:7px}
.ok{color:var(--good); font-family:var(--mono); font-size:11.5px}
.err{color:var(--crit); font-family:var(--mono); font-size:11.5px}
.maplibregl-popup-content{background:var(--panel); color:var(--ink);
  border:1px solid var(--hair); border-radius:5px; font-family:var(--mono); font-size:11px}
.maplibregl-popup-tip{border-top-color:var(--panel)!important}
.maplibregl-ctrl-attrib{font-size:10px!important}
.maplibregl-ctrl-top-right{display:flex; flex-direction:column; align-items:flex-end}
.maplibregl-ctrl-scale{
  background:rgba(18,33,38,.92)!important; border-color:var(--hair)!important;
  color:var(--ink-2)!important; font-family:var(--mono); font-size:10px;
}
#spark{width:100%; height:52px; display:block; margin-top:10px}
#loading{
  position:absolute; inset:0; z-index:9; display:grid; place-items:center;
  background:rgba(11,21,24,.86); font-family:var(--mono); font-size:12px;
  color:var(--depth); letter-spacing:.1em; text-transform:uppercase;
}
#loading.hide{display:none}
@media (max-width:900px){
  #app{grid-template-columns:1fr; grid-template-rows:1fr 300px}
  #panel{border-left:none; border-top:1px solid var(--hair)}
  /* The scrubber is absolutely positioned inside the map wrapper, not the
     app grid, so it needs no offset for the panel here -- the panel is a
     sibling below the map, already out of the way. Offsetting by the panel
     height pushed it 314px up from the map's own bottom edge and parked it
     in the middle of the chart. */
  /* 44px, not 14px: the attribution sits in the bottom-right corner of the
     map and occupies the last ~34px. Covering it would breach the ODbL terms
     the basemap ships under. */
  #timebar{right:12px; bottom:44px}
}
</style>
</head>
<body>
<div id="app">
  <div style="position:relative">
    <div id="map"></div>
    <div id="bar">
      <div class="brand">tide<span>race</span></div>
      <select id="species"></select>
      <label class="chk"><input type="checkbox" id="marks" checked> seamarks</label>
      <label class="chk"><input type="checkbox" id="labels" checked> labels</label>
      <span id="mode" title="Which rules apply"></span>
      <button id="layersbtn" title="Chart overlays">charts ▾</button>
      <button id="offlinebtn" title="Download the forecast for the water">save ↓</button>
      <span id="netstate"></span>
      <div id="layers"></div>
    </div>
    <div id="timebar">
      <div class="row"><span id="tlabel">—</span><span id="tsub"></span></div>
      <input type="range" id="time" min="0" max="0" value="0" step="1">
      <div id="ticks"></div>
    </div>
    <div id="loading">loading noaa data…</div>
  </div>
  <aside id="panel">
    <div id="regsbox"></div>
    <div>
      <p class="ph">Ranked now</p>
      <div class="rank" id="rank"></div>
    </div>
    <div id="markbox"></div>
    <div id="detail"></div>
    <div id="logbox"></div>
    <p class="note" style="margin-top:auto;padding-top:12px;border-top:1px solid var(--hair)">
      Charts © NOAA ENC (public domain) · basemap © OpenStreetMap · seamarks © OpenSeaMap<br>
      tiderace is <a href="https://www.gnu.org/licenses/agpl-3.0.html"
        style="color:var(--depth)">AGPL-3.0</a> —
      <a id="src" href="#" style="color:var(--depth)">get the source</a>
    </p>
  </aside>
</div>

<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script>
const $ = s => document.querySelector(s);
let GRID = null, TI = 0, SEL = null, MARKERS = {};
let MARK = null, MARK_PIN = null;

// Score -> colour. Deliberately not a rainbow: a single hue ramping from the
// water tone to the accent, so rank reads as intensity rather than category.
function colour(s){
  if (s == null) return '#5D7075';
  const t = Math.max(0, Math.min(1, s / 100));
  const stops = [[0.00,[45,70,78]],[0.45,[79,179,199]],[0.75,[214,120,170]],[1.00,[240,79,160]]];
  let a = stops[0], b = stops[stops.length-1];
  for (let i=0;i<stops.length-1;i++){ if (t>=stops[i][0] && t<=stops[i+1][0]){ a=stops[i]; b=stops[i+1]; break; } }
  const f = (t-a[0])/((b[0]-a[0])||1);
  const c = a[1].map((v,i)=>Math.round(v+(b[1][i]-v)*f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

const map = new maplibregl.Map({
  container:'map',
  style:{
    version:8,
    sources:{
      osm:{type:'raster', tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
           tileSize:256, maxzoom:19,
           attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'},
      seamark:{type:'raster', tiles:['https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png'],
           tileSize:256, maxzoom:18,
           attribution:'© <a href="https://www.openseamap.org/">OpenSeaMap</a>'}
    },
    layers:[
      {id:'osm', type:'raster', source:'osm',
       paint:{'raster-saturation':-0.55,'raster-brightness-min':0.05,'raster-brightness-max':0.72,'raster-contrast':0.12}},
      {id:'seamark', type:'raster', source:'seamark', paint:{'raster-opacity':0.95}}
    ]
  },
  center:[-71.35, 41.53], zoom:10.2, minZoom:8, maxZoom:16, attributionControl:true
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-right');
// Scale moves up top; attribution stays in its usual bottom-right corner and
// the scrubber is lifted to clear it. OpenStreetMap and OpenSeaMap are both
// ODbL, so that credit staying visible is a licence condition rather than a
// nicety -- which makes leaving MapLibre's own control alone the safer choice.
map.addControl(new maplibregl.ScaleControl({unit:'nautical'}), 'top-right');

$('#marks').onchange = e => {
  if (!MAP_READY) return;
  map.setLayoutProperty('seamark', 'visibility', e.target.checked ? 'visible' : 'none');
};
$('#labels').onchange = e =>
  Object.values(MARKERS).forEach(m => m.el.querySelector('.lbl').style.display = e.target.checked?'':'none');

// ------------------------------------------------------------------ markers
let MAP_READY = false;
map.on('load', () => { MAP_READY = true; syncMarkers(); loadCharts(); loadBait(); });
map.on('error', e => console.warn('map:', e && e.error && e.error.message));

// The map is a view onto the data, not a prerequisite for it. If WebGL is
// unavailable or the tile host is blocked, the ranked list, the spot detail
// and the log form must all still work -- so nothing below is gated on the
// map finishing.
function syncMarkers(){
  if (!MAP_READY || !GRID) return;
  Object.values(MARKERS).forEach(m => m.remove());
  MARKERS = {};
  GRID.spots.forEach(s => MARKERS[s.key] = makeMarker(s));
  paint();
}

function makeMarker(sp){
  const el = document.createElement('div');
  el.style.cssText = 'display:flex;align-items:center;gap:6px;cursor:pointer;transform:translate(-9px,-9px)';
  el.innerHTML =
    `<div class="dot" style="width:18px;height:18px;border-radius:50%;border:2px solid #0B1518;
        box-shadow:0 0 0 1px rgba(228,236,238,.35);flex:none"></div>
     <div class="lbl" style="font-family:var(--mono);font-size:10px;font-weight:600;
        color:#E4ECEE;text-shadow:0 1px 3px #0B1518,0 0 6px #0B1518;white-space:nowrap">${sp.name}</div>`;
  el.onclick = () => select(sp.key);
  const m = new maplibregl.Marker({element:el, anchor:'center'})
      .setLngLat([sp.lon, sp.lat]).addTo(map);
  m.el = el;
  return m;
}

function paint(){
  if (!GRID) return;
  const t = GRID.times[TI];
  const d = new Date(t);
  $('#tlabel').textContent = d.toLocaleString([], {weekday:'short', hour:'2-digit', minute:'2-digit'});
  const det = GRID.spots.find(s=>s.detail.length)?.detail[TI];
  $('#tsub').textContent = det
    ? `${det.light_phase} · moon ${det.moon_phase.toLowerCase()}` +
      (det.season_note ? ` · ${det.season_note}` : '')
    : '';

  GRID.spots.forEach(sp => {
    const s = sp.scores[TI];
    const m = MARKERS[sp.key];
    if (!m) return;   // map not ready yet -- panel still renders below
    const dot = m.el.querySelector('.dot');
    dot.style.background = colour(s);
    const size = s == null ? 12 : 12 + (s/100)*12;
    dot.style.width = dot.style.height = size + 'px';
    m.el.style.transform = `translate(${-size/2}px,${-size/2}px)`;
    m.el.style.zIndex = Math.round(s || 0);
  });
  renderRank(); renderDetail();
}

function renderRank(){
  const rows = GRID.spots
    .map(sp => ({sp, s: sp.scores[TI]}))
    .filter(r => r.s != null)
    .sort((a,b) => b.s - a.s).slice(0, 8);
  $('#rank').innerHTML = rows.map(r => {
    const d = r.sp.detail[TI] || {};
    return `<button data-k="${r.sp.key}" class="${SEL===r.sp.key?'on':''}">
      <span class="s" style="color:${colour(r.s)}">${r.s.toFixed(0)}</span>
      <span>${r.sp.name}<br><span class="m">${(d.current_speed??0).toFixed(2)} kt ${d.current_dir||''}</span></span>
      <span class="m">${d.wind_kt!=null?d.wind_kt.toFixed(0)+' kt':''}</span>
    </button>`;
  }).join('') || '<p class="empty">No spots scored at this time.</p>';
  $('#rank').querySelectorAll('button').forEach(b => b.onclick = () => select(b.dataset.k));
}

function sparkline(scores){
  const w = 320, h = 52, n = scores.length;
  const pts = scores.map((s,i) => [i/(n-1)*w, h - (s/100)*(h-6) - 3]);
  const d = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const x = TI/(n-1)*w;
  return `<svg id="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d} L ${w} ${h} L 0 ${h} Z" fill="rgba(240,79,160,.14)"/>
    <path d="${d}" fill="none" stroke="#F04FA0" stroke-width="1.6"/>
    <line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="#4FB3C7" stroke-width="1" stroke-dasharray="3 3"/>
  </svg>`;
}

function renderDetail(){
  if (!SEL){ $('#detail').innerHTML =
    `<p class="ph">Spot</p><p class="empty">Pick a spot on the map or in the list to see its
     conditions, its 48-hour curve, and to log a trip there.<br><br>
     Tap anywhere on the water for a report at that exact coordinate.</p>`; $('#logbox').innerHTML=''; return; }
  const sp = GRID.spots.find(s => s.key === SEL);
  if (!sp) return;
  const s = sp.scores[TI], d = sp.detail[TI] || {};
  $('#detail').innerHTML = `
    <p class="ph">Spot</p>
    <div class="card">
      <h3>${sp.name}</h3>
      <div class="sub">${sp.kind}${sp.best_stage?' · best on '+sp.best_stage:''}</div>
      <div class="big" style="color:${colour(s)};margin-top:10px">${s!=null?s.toFixed(1):'—'}</div>
      ${sp.scores.length ? sparkline(sp.scores) : ''}
      <dl class="kv">
        <dt>current</dt><dd>${(d.current_speed??0).toFixed(2)} kt ${d.current_dir||''}</dd>
        <dt>water</dt><dd>${d.water_temp_f!=null?d.water_temp_f.toFixed(1)+' °F':'—'}</dd>
        <dt>wind</dt><dd>${d.wind_kt!=null?d.wind_kt.toFixed(0)+' kt '+(d.wind_dir||''):'—'}</dd>
        <dt>light</dt><dd>${d.light_phase||'—'}</dd>
        <dt>moon</dt><dd>${d.moon_phase||'—'} ${d.moon_illum!=null?'('+Math.round(d.moon_illum*100)+'%)':''}</dd>
        <dt>tide</dt><dd>${d.next_tide||'—'}</dd>
        ${d.bait_note ? `<dt>bait</dt><dd style="color:#5FE3C0">${d.bait_note}</dd>` : ''}
        ${sp.bottom ? `<dt>bottom</dt><dd>${sp.bottom.bottom}${sp.bottom.quality?' ('+sp.bottom.quality+')':''}
           <span style="color:var(--muted)">· ${sp.bottom.distance_nm} nm</span></dd>` : ''}
      </dl>
      <div class="why">${d.why||''}</div>
    </div>
    <p class="note" style="margin-top:8px">${sp.notes}</p>`;
  renderLogForm(sp);
}

function renderLogForm(sp){
  const now = new Date(GRID.times[TI]);
  const local = new Date(now.getTime() - now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  $('#logbox').innerHTML = `
    <p class="ph">Log a trip</p>
    <form id="logform">
      <div class="two">
        <input type="number" name="count" min="0" value="0" placeholder="fish" required>
        <input type="number" name="biggest_in" min="0" step="0.5" placeholder="biggest (in)">
      </div>
      <input type="datetime-local" name="started_at" value="${local}">
      <input type="text" name="method" placeholder="method — live eel, bucktail…">
      <input type="text" name="bait_observed" placeholder="bait seen — peanut bunker…">
      <input type="text" name="notes" placeholder="notes">
      <button class="primary" type="submit">Log at ${sp.name}</button>
      <p class="note">Blanks count. A model trained only on good days learns every day is good.</p>
      <div id="logmsg"></div>
    </form>`;
  $('#logform').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const body = {spot: sp.key, species: GRID.species,
                  client_id: (crypto.randomUUID?.() ||
                              String(Date.now()) + Math.random())};
    for (const [k,v] of f.entries()) if (v !== '') body[k] = v;
    const msg = $('#logmsg');
    msg.className=''; msg.textContent = 'saving…';

    // Write to the phone before trying the network. A trip you did not record
    // is gone; a trip that has not synced yet is fine.
    try { await queueAdd(body); }
    catch (err) { msg.className='err'; msg.textContent = 'could not save: ' + err.message; return; }
    e.target.reset();

    const res = await flushQueue();
    if (res.sent) {
      msg.className='ok';
      const s = res.summary;
      msg.textContent = s
        ? `saved · ${s.trips} trips, ${s.fish} fish, ${s.blanks} blanks`
        : 'saved';
    } else {
      msg.className='';
      const n = await pendingCount();
      msg.innerHTML = `<span style="color:var(--warn)">held on this phone` +
        ` · ${n} waiting to sync</span>`;
    }
    refreshNetState();
  };
}

function select(key){
  SEL = key; paint();
  if (!MAP_READY) return;
  const sp = GRID.spots.find(s => s.key === key);
  if (sp) map.easeTo({center:[sp.lon, sp.lat], zoom: Math.max(map.getZoom(), 11.5), duration:600});
}

// ----------------------------------------------------------- chart overlays
// Styling follows what matters for fishing rather than chart convention:
// rocks are coloured by tide exposure (a rock that covers and uncovers is the
// classic striper piece), wrecks by whether a depth is charted at all, and
// seabed by substrate — tautog want boulder, fluke want sand.
// Charted depth, as a bathymetric fill. This is the one chart layer that is
// ground rather than marks: it sits under everything, it is never clickable,
// and it is what makes a drop-off visible instead of merely knowable.
//
// A sequential ramp, so it is one hue with monotone lightness — the map's own
// --depth cyan, stepped from bright shallow to dark deep. Light-means-shallow
// is both the nautical convention and the useful one here: the shallow edges
// are where the fishing is, and deep water receding toward the background is
// exactly the right emphasis. Steps were solved rather than picked, then
// validated: monotone lightness, every adjacent gap >= 0.06 OKLCH L, single
// hue (4° spread), and both ends clearing 2:1 against the surface so neither
// "dries" nor "deep" collapses into the basemap. Checked twice, because this
// layer has two surfaces: the dark panel (#0B1518) and the desaturated OSM
// raster the fill actually borders (~#909EA2). It passes on both.
const DEPTH_RAMP = ['#D2EEF4','#A2DAE7','#73C5D7','#44B0C5',
                    '#2598AD','#277F8F','#2F6671','#354C52'];
const DEPTH_LABELS = ['dries','0–2 m','2–5 m','5–10 m',
                      '10–15 m','15–20 m','20–30 m','30 m+'];

const CHART_STYLE = {
  depth_area: {
    kind: 'fill',
    // DRVAL2 is the deep limit of the band. Anything at or below zero dries.
    // Falling straight back to 0 painted the deepest area -- the one charted
    // with a shallow limit and no deep one -- in the "dries" colour, which
    // reads as the exact opposite of what it is. DRVAL1 is a lower bound on
    // the depth, so it is the honest second choice.
    colour: ['step', ['coalesce', ['get','depth_max_m'], ['get','depth_min_m'], 0],
      DEPTH_RAMP[0],
      0.5,  DEPTH_RAMP[1],
      2.5,  DEPTH_RAMP[2],
      5.5,  DEPTH_RAMP[3],
      10.5, DEPTH_RAMP[4],
      15.5, DEPTH_RAMP[5],
      20.5, DEPTH_RAMP[6],
      30.5, DEPTH_RAMP[7]],
    // Opaque on purpose: at partial alpha the colour on screen is a blend with
    // whatever basemap sits under it, and the ramp that was validated is not
    // the ramp anyone sees. Depth areas tile the water anyway, so there is
    // nothing underneath worth keeping.
    opacity: 1,
    swatch: `linear-gradient(90deg, ${DEPTH_RAMP[0]}, ${DEPTH_RAMP[3]}, ${DEPTH_RAMP[7]})`,
    minzoom: 0
  },
  rocks: {
    colour: ['match', ['get','water_level'],
      'covers and uncovers', '#D9A521',
      'awash',               '#E0705F',
      'always under water',  '#4FB3C7',
      '#8CA3A8'],
    radius: [ 'interpolate', ['linear'], ['zoom'], 10, 1.6, 13, 3.2, 16, 5.5 ],
    swatch: '#D9A521', minzoom: 10
  },
  wrecks: {
    colour: ['case', ['has','depth_ft'], '#F04FA0', '#B5197A'],
    radius: [ 'interpolate', ['linear'], ['zoom'], 9, 3.5, 13, 6, 16, 9 ],
    swatch: '#F04FA0', minzoom: 8
  },
  obstructions: {
    colour: '#C58BD8',
    radius: [ 'interpolate', ['linear'], ['zoom'], 10, 2, 13, 3.6, 16, 6 ],
    swatch: '#C58BD8', minzoom: 10
  },
  turbulence: { colour:'#5FE3C0',
    radius:['interpolate',['linear'],['zoom'],8,5,14,11], swatch:'#5FE3C0', minzoom:8 },
  kelp: { colour:'#4FBF89',
    radius:['interpolate',['linear'],['zoom'],10,2.5,15,6], swatch:'#4FBF89', minzoom:10 },
  seabed: {
    // S-57 packs compound substrates into one string ("sand,rock",
    // "mud,shells,pebbles") -- 28 distinct combinations in this bay alone, so
    // exact matching drops nearly all of them to grey. Test for the hardest
    // substrate present instead, which is also the one that holds fish.
    colour: ['case',
      ['>=', ['index-of', 'boulder', ['coalesce',['get','bottom'],'']], 0], '#E0705F',
      ['>=', ['index-of', 'rock',    ['coalesce',['get','bottom'],'']], 0], '#E08A3C',
      ['>=', ['index-of', 'stone',   ['coalesce',['get','bottom'],'']], 0], '#E08A3C',
      ['>=', ['index-of', 'gravel',  ['coalesce',['get','bottom'],'']], 0], '#D9A521',
      ['>=', ['index-of', 'pebbles', ['coalesce',['get','bottom'],'']], 0], '#D9A521',
      ['>=', ['index-of', 'sand',    ['coalesce',['get','bottom'],'']], 0], '#E8DCA8',
      ['>=', ['index-of', 'shells',  ['coalesce',['get','bottom'],'']], 0], '#C2D3D7',
      ['>=', ['index-of', 'mud',     ['coalesce',['get','bottom'],'']], 0], '#8A7355',
      ['>=', ['index-of', 'silt',    ['coalesce',['get','bottom'],'']], 0], '#8A7355',
      '#5D7075'],
    radius: [ 'interpolate', ['linear'], ['zoom'], 11, 2, 14, 4, 16, 6 ],
    swatch: '#E08A3C', minzoom: 11
  }
};
const CHART_ON = {depth_area:true, rocks:false, wrecks:true, obstructions:false,
                  turbulence:true, kelp:false, seabed:false};
const CHART_DATA = {};

fetch('/api/meta').then(r=>r.json()).then(m => {
  if (m.source_url) $('#src').href = m.source_url;
}).catch(()=>{});

// Depth shading is ground, not a mark, so it belongs at the bottom of the
// overlay stack: directly above the basemap raster and beneath everything else.
// Seamarks, charted rocks and the spot markers all read over it, which is the
// order a paper chart uses and the only one in which the buoys stay legible.
//
// Anchored to the basemap rather than to a named overlay because the layers
// above it load asynchronously and in a different order each time -- depth is
// last in the manifest, so "insert before whatever happens to exist" is not a
// position, it is a race.
function ABOVE_BASEMAP(){
  const ids = ((map.getStyle() || {}).layers || []).map(l => l.id);
  const i = ids.indexOf('osm');
  if (i === -1) return ids[0];
  // undefined when the basemap is the only layer, which appends -- and
  // appending is still directly above it.
  return ids[i + 1];
}

async function loadCharts(){
  let meta;
  try{ meta = await (await fetch('/api/charts')).json(); }
  catch(e){ return; }
  const box = $('#layers');
  if (!meta.layers || !meta.layers.length){
    box.innerHTML = `<h4>Chart overlays</h4>
      <p class="hint">Not downloaded yet.<br>Run: python3 -m tiderace charts</p>`;
    return;
  }

  box.innerHTML = '<h4>Chart overlays</h4>' + meta.layers.map(l => {
    const st = CHART_STYLE[l.name] || {};
    return `<label title="${l.label}">
      <span class="sw${st.kind==='fill'?' ramp':''}"
            style="background:${st.swatch||'#8CA3A8'}"></span>
      <input type="checkbox" data-layer="${l.name}" ${CHART_ON[l.name]?'checked':''}>
      ${l.name}<span class="cnt" id="cnt-${l.name}"></span></label>`;
  }).join('') + depthLegend()
    + `<p class="hint">NOAA ENC · public domain<br>click any feature for detail</p>`;

  for (const l of meta.layers){
    const st = CHART_STYLE[l.name];
    if (!st) continue;
    if (MAP_READY && map.getSource('c-' + l.name)) continue;

    // loadCharts() runs on boot (to populate the menu) and again when the map
    // becomes ready. Cache the GeoJSON so a slow map load does not re-pull
    // three quarters of a megabyte.
    if (!CHART_DATA[l.name]) CHART_DATA[l.name] = await (await fetch(l.url)).json();
    const gj = CHART_DATA[l.name];
    const cnt = document.querySelector('#cnt-' + l.name);
    if (cnt) cnt.textContent = gj.features.length;
    // Re-checked after the await, not just before it: loadCharts runs twice --
    // on boot and again when the map is ready -- and each layer awaits a fetch
    // in between. Both passes can clear the guard at the top of the loop and
    // then both try to add the same source; the second throws and takes the
    // rest of the chart stack with it.
    if (!MAP_READY || map.getSource('c-' + l.name)) continue;
    map.addSource('c-' + l.name, {type:'geojson', data:gj});

    if (st.kind === 'fill'){
      // The band edges are the depth contours, so a hairline of the map's own
      // ground colour separates them and reads as the contour at the same time.
      map.addLayer({
        id: 'c-' + l.name, type:'fill', source:'c-' + l.name,
        minzoom: st.minzoom || 0,
        layout:{visibility: CHART_ON[l.name] ? 'visible' : 'none'},
        paint:{
          'fill-color': st.colour,
          'fill-opacity': st.opacity ?? 0.5,
          'fill-outline-color': 'rgba(11,21,24,.45)'
        }
      }, ABOVE_BASEMAP());
      continue;         // ground is not clickable -- see the map click handler
    }

    map.addLayer({
      id: 'c-' + l.name, type:'circle', source:'c-' + l.name,
      minzoom: st.minzoom || 9,
      layout:{visibility: CHART_ON[l.name] ? 'visible' : 'none'},
      paint:{
        'circle-color': st.colour,
        'circle-radius': st.radius,
        'circle-opacity': 0.9,
        'circle-stroke-width': 0.6,
        'circle-stroke-color': 'rgba(11,21,24,.85)'
      }
    }, undefined);
    map.on('click', 'c-' + l.name, e => chartPopup(e, l.name));
    map.on('mouseenter', 'c-' + l.name, () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'c-' + l.name, () => map.getCanvas().style.cursor = '');
  }

  box.querySelectorAll('input[data-layer]').forEach(cb => cb.onchange = () => {
    const id = 'c-' + cb.dataset.layer;
    CHART_ON[cb.dataset.layer] = cb.checked;
    if (MAP_READY && map.getLayer(id))
      map.setLayoutProperty(id, 'visibility', cb.checked ? 'visible' : 'none');
  });
}

// ------------------------------------------------------- offline + queueing
//
// The bay has no signal worth relying on, so a trip is written to the phone
// first and sent second. A POST that fails is not an error the angler should
// have to think about at 2am with wet hands -- it is just a row that has not
// synced yet.

const DB_NAME = 'tiderace', STORE = 'queue';

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains(STORE))
        db.createObjectStore(STORE, {keyPath: 'client_id'});
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

async function tx(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, mode);
    const out = fn(t.objectStore(STORE));
    t.oncomplete = () => res(out?.result ?? out);
    t.onerror = () => rej(t.error);
  });
}

const queueAdd  = e  => tx('readwrite', s => s.put(e));
const queueAll  = () => tx('readonly',  s => s.getAll());
const queueDrop = id => tx('readwrite', s => s.delete(id));

async function pendingCount() {
  try { return (await queueAll()).length; } catch (_) { return 0; }
}

async function refreshNetState() {
  const el = $('#netstate');
  const n = await pendingCount();
  if (!navigator.onLine) {
    el.className = 'off';
    el.textContent = n ? `offline · ${n} queued` : 'offline';
  } else if (n) {
    el.className = 'queued';
    el.textContent = `${n} to sync`;
  } else {
    el.className = 'ok';
    el.textContent = '';
  }
}

/** Send everything queued, in one request. Anything the server rejects stays
 *  put rather than being silently dropped. */
async function flushQueue() {
  if (!navigator.onLine) return {sent: 0};
  let entries;
  try { entries = await queueAll(); } catch (_) { return {sent: 0}; }
  if (!entries.length) return {sent: 0};

  let r;
  try {
    r = await fetch('/api/log', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({entries})
    });
  } catch (_) { return {sent: 0, offline: true}; }
  if (!r.ok) return {sent: 0};

  const j = await r.json();
  for (const id of (j.saved || [])) if (id) await queueDrop(id);
  await refreshNetState();
  return {sent: (j.saved || []).length, failed: (j.failed || []).length,
          summary: j.summary};
}

/** Pull everything needed to fish a tide without the server. */
async function saveForOffline() {
  const btn = $('#offlinebtn');
  const was = btn.textContent;
  btn.textContent = 'saving…'; btn.disabled = true;
  try {
    const meta = await (await fetch('/api/meta')).json();
    const urls = ['/', '/api/meta', '/api/bait', '/api/charts'];
    for (const sp of meta.species) urls.push(`/api/grid?species=${sp.key}&hours=48`);
    for (const l of (await (await fetch('/api/charts')).json()).layers || [])
      urls.push(l.url);

    // Fetch through the page so the service worker's DATA cache fills, then
    // ask it to confirm.
    await Promise.allSettled(urls.map(u => fetch(u)));
    const reg = await navigator.serviceWorker?.ready;
    reg?.active?.postMessage({type: 'prefetch', urls});

    localStorage.setItem('tiderace:saved', new Date().toISOString());
    btn.textContent = 'saved ✓';
    setTimeout(() => { btn.textContent = was; btn.disabled = false; }, 2500);
  } catch (e) {
    btn.textContent = 'failed';
    setTimeout(() => { btn.textContent = was; btn.disabled = false; }, 2500);
  }
}

$('#offlinebtn').onclick = saveForOffline;
addEventListener('online',  () => { refreshNetState(); flushQueue(); });
addEventListener('offline', refreshNetState);

// ------------------------------------------------------- tap anywhere on the water
//
// The nineteen curated spots are landmarks. The marks that actually matter are
// the ones you found, and they are not on anybody's list -- so any point on the
// chart answers the same questions, resolved to its own current station.
//
// The station binding leads the card on purpose. At a curated spot that binding
// was checked by hand; here it was inferred, it is the part most likely to be
// wrong, and a number with an unstated provenance is worse than no number.

function fmtCoord(lat, lon){
  const dm = (v, pos, neg) => {
    const h = v >= 0 ? pos : neg, a = Math.abs(v);
    const d = Math.floor(a), m = (a - d) * 60;
    return `${d}°${m.toFixed(3)}'${h}`;
  };
  return `${dm(lat,'N','S')} ${dm(lon,'E','W')}`;
}

function markPin(lat, lon){
  if (MARK_PIN) MARK_PIN.remove();
  const el = document.createElement('div');
  el.className = 'markpin';
  el.title = 'tap the map again to move this mark';
  MARK_PIN = new maplibregl.Marker({element:el, anchor:'center'})
    .setLngLat([lon, lat]).addTo(map);
}

async function reportAt(lat, lon){
  markPin(lat, lon);
  $('#markbox').innerHTML =
    `<p class="ph">Mark</p><div class="card"><div class="sub">reading noaa…</div></div>`;
  try{
    const q = new URLSearchParams({lat: lat.toFixed(5), lon: lon.toFixed(5),
                                   species: $('#species').value, hours: 48});
    const res = await fetch('/api/at?' + q);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    MARK = d;
    renderMark();
  }catch(err){
    $('#markbox').innerHTML =
      `<p class="ph">Mark</p><div class="card"><div class="sub" style="color:#E0705F">
       ${err.message}</div></div>`;
  }
}

function renderMark(){
  const d = MARK;
  if (!d){ $('#markbox').innerHTML = ''; return; }
  const st = d.stations, pl = d.place, now = d.now;
  const cur = st.current, tide = st.tide, temp = st.temp;

  const place = [];
  if (pl.depth){
    // Either end of a charted depth area can be absent; showing the missing
    // one rendered "30–0 ft".
    const lo = pl.depth.min_ft, hi = pl.depth.max_ft;
    if (lo != null && hi != null) place.push(`${Math.round(lo)}–${Math.round(hi)} ft`);
    else if (lo != null)          place.push(`${Math.round(lo)}+ ft`);
    else if (hi != null)          place.push(`less than ${Math.round(hi)} ft`);
  }
  if (pl.bottom) place.push(pl.bottom.bottom);
  for (const [k, n] of Object.entries(pl.structure || {})) place.push(`${n} ${k}`);

  $('#markbox').innerHTML = `
    <p class="ph">Mark</p>
    <div class="card">
      <h3 style="font-family:var(--mono);font-size:12px">${fmtCoord(d.lat, d.lon)}</h3>
      <div class="sub">${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}</div>
      <div class="big" style="color:${colour(now.score)};margin-top:10px">
        ${now.score.toFixed(1)}</div>
      <div class="sub">right now · ${d.species_name}</div>

      <dl class="kv" style="margin-top:10px">
        <dt>current</dt><dd>${(now.current_speed??0).toFixed(2)} kt ${now.current_dir||''}</dd>
        <dt>water</dt><dd>${now.water_temp_f!=null?now.water_temp_f.toFixed(1)+' °F':'—'}</dd>
        <dt>wind</dt><dd>${now.wind_kt!=null?now.wind_kt.toFixed(0)+' kt '+(now.wind_dir||''):'—'}</dd>
        <dt>light</dt><dd>${now.light_phase||'—'}</dd>
        <dt>tide</dt><dd>${now.next_tide||'—'}</dd>
        ${place.length?`<dt>place</dt><dd>${place.join(' · ')}</dd>`:''}
      </dl>
      <div class="why">${now.explain||''}</div>
    </div>

    <div class="card" style="margin-top:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span class="ph" style="margin:0">Stations</span>
        <span class="conf ${st.confidence}">${st.confidence}</span>
      </div>
      <dl class="kv">
        <dt>current</dt><dd>${cur.name} <span style="color:var(--muted)">·
          ${cur.distance_nm} nm</span></dd>
        <dt>tide</dt><dd>${tide.name} <span style="color:var(--muted)">·
          ${tide.distance_nm} nm</span></dd>
        ${temp && temp.id !== tide.id ? `<dt>temp</dt><dd>${temp.name}
          <span style="color:var(--muted)">· ${temp.distance_nm} nm</span></dd>` : ''}
      </dl>
      ${(st.rejected||[]).length ? `<div class="note" style="margin-top:8px">
        skipped ${st.rejected.length} closer station${st.rejected.length>1?'s':''}
        across land: ${st.rejected.slice(0,2).map(r=>r.name).join('; ')}</div>` : ''}
      ${(st.warnings||[]).map(w=>`<div class="markwarn">! ${w}</div>`).join('')}
    </div>

    ${d.windows.length ? `<div class="card" style="margin-top:8px">
      <span class="ph" style="margin:0">Windows</span>
      ${d.windows.map(w => {
        const a = new Date(w.start), b = new Date(w.end);
        const opt = {weekday:'short', hour:'2-digit', minute:'2-digit'};
        const span = +a === +b ? a.toLocaleString([], opt)
          : a.toLocaleString([], opt) + '–' + b.toLocaleTimeString([],
              {hour:'2-digit', minute:'2-digit'});
        return `<div class="markwin"><span>${span}</span>
          <span style="color:${colour(w.score)}">${w.score.toFixed(1)}</span></div>`;
      }).join('')}
    </div>` : ''}

    ${d.prior_is_default ? `<p class="note" style="margin-top:8px">
      No history here, so this is scored with the default spot prior
      (${d.prior.toFixed(2)}) and no preferred tide stage — unlike a curated
      spot, none of this score is local knowledge.</p>` : ''}

    <div style="display:flex;gap:6px;margin-top:8px">
      <button id="markcopy" style="flex:1">copy coords</button>
      <button id="markclear" style="flex:1">clear</button>
    </div>`;

  $('#markcopy').onclick = () => {
    navigator.clipboard?.writeText(`${d.lat.toFixed(5)},${d.lon.toFixed(5)}`);
    $('#markcopy').textContent = 'copied';
    setTimeout(() => { const b = $('#markcopy'); if (b) b.textContent = 'copy coords'; }, 1400);
  };
  $('#markclear').onclick = () => {
    MARK = null;
    if (MARK_PIN){ MARK_PIN.remove(); MARK_PIN = null; }
    $('#markbox').innerHTML = '';
  };
}

// Chart features and bait sightings have their own click handlers and their own
// popups; a tap that landed on one of those was not a request for a report.
map.on('click', e => {
  if (!MAP_READY) return;
  // Fills are excluded on purpose. The depth layer covers every square metre of
  // water, so counting it as "you clicked a feature" would swallow every tap
  // and the map would silently stop answering.
  const clickable = ((map.getStyle() || {}).layers || [])
    .map(l => l.id)
    .filter(id => (id === 'bait' ||
                   (id.startsWith('c-') &&
                    (CHART_STYLE[id.slice(2)] || {}).kind !== 'fill'))
                  && map.getLayer(id));
  if (clickable.length && map.queryRenderedFeatures(e.point, {layers: clickable}).length)
    return;
  reportAt(e.lngLat.lat, e.lngLat.lng);
});

(async function boot(){
  try{
    await loadSpecies();
    await loadGrid();
    refreshNetState();
    flushQueue();
    if (!MAP_READY) await loadCharts();   // still populate the menu + counts
  }catch(err){
    $('#loading').innerHTML =
      `<div style="text-align:center;line-height:1.7">could not reach the forecast API<br>
       <span style="color:#8CA3A8;text-transform:none;letter-spacing:0">${err.message}</span></div>`;
  }
})();
</script>
</body>
