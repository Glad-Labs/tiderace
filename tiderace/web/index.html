<script>
/* The prefetched cache key and the live request must be identical to the byte
   or the Cache API misses and the boat gets nothing back. One builder, used by
   the dock bundle and by the live tap alike. */
// The slider moves the map and the ranked list, and until now the panel sat
// frozen beside them: slide 24 hours out, watch the ranking re-order, and the
// numbers in the sheet were still the moment you tapped -- with nothing saying
// so. /api/survey has accepted `when` all along; the page never passed it.
window.surveyAtTime = null;
window.surveyURL = (lat, lon) =>
  `/api/survey?lat=${(+lat).toFixed(4)}&lon=${(+lon).toFixed(4)}&fast=1`
  + (window.surveyAtTime ? '&when=' + encodeURIComponent(window.surveyAtTime) : '');

/* ---- conditions sheet -------------------------------------------------
   Renders /api/survey. Deliberately dumb: the server already decided what
   is worth asking at this zone and what each value's footprint is, and
   duplicating either of those judgements in the client is how the two
   drift apart. */
(function(){
  const sheet = document.getElementById('sheet');
  const body  = document.getElementById('sheetbody');
  const title = document.getElementById('sheettitle');
  const when  = document.getElementById('sheetwhen');
  const zoneE = document.getElementById('sheetzone');
  let SURVEY_AT = null;

  function resChip(m){
    if (m == null) return '<span class="res">zone</span>';
    if (m < 1000)  return `<span class="res fine">${m}m</span>`;
    // 2500 m is the NWS grid. Rounding it to "3km" overstates the
    // coarseness of one and understates the difference from the next.
    const km = m / 1000;
    return `<span class="res coarse">${km < 10 ? km.toFixed(1) : Math.round(km)}km</span>`;
  }
  const esc = t => String(t == null ? '' : t)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function row(k, v, res, sub, fixed){
    // `fixed` marks a value that does not move with the slider -- an
    // observation, or something that simply is what it is. Without it a
    // reading taken now sits in a panel headed tomorrow and looks forecast.
    return `<div class="srow${fixed && window.surveyAtTime ? ' fixed' : ''}">` +
           `<div class="k">${esc(k)}</div>` +
           `<div class="v">${esc(v)}${sub ? ` <small>${esc(sub)}</small>` : ''}` +
           (fixed && window.surveyAtTime ? ' <small class="nowonly">now</small>' : '') +
           `</div>` + resChip(res) + `</div>`;
  }
  const group = t => `<div class="sgroup">${esc(t)}</div>`;

  function render(d){
    const L = d.layers || {};
    const val = k => (L[k] || {}).value;
    const res = k => (L[k] || {}).resolution_m;
    const c = val('conditions') || {};
    const w = val('weather') || {};
    let h = '';

    h += group('the water');
    if (c.current_speed != null)
      h += row('current', `${c.current_speed.toFixed(2)} kt`,
               res('conditions'), c.current_dir || '');
    if (c.water_temp_f != null)
      h += row('water', `${c.water_temp_f.toFixed(1)}°F`, res('conditions'));
    if (c.next_tide) h += row('next tide', c.next_tide, 100);
    const dep = val('depth');
    if (dep && dep.min_ft != null)
      h += row('depth', `${dep.min_ft}–${dep.max_ft} ft`, res('depth'), 'charted');
    else if (d.charted === false)
      h += row('depth', 'no chart here', null);
    const sc = val('surface_current');
    if (sc && sc.mean_kt != null){
      h += row('drift', `${sc.mean_kt} kt`, res('surface_current'),
               `toward ${sc.toward_deg}° · measured`);
      if (sc.shear_kt != null)
        h += row('drift shear', `${sc.shear_kt.toFixed(2)} kt`,
                 res('surface_current'), 'across the cell');
    }
    const wl = val('water_level_anomaly');
    if (wl && wl.anomaly_ft != null)
      h += row('water level', `${wl.anomaly_ft > 0 ? '+' : ''}${wl.anomaly_ft.toFixed(2)} ft`,
               res('water_level_anomaly'), 'vs predicted', true);
    // bottom_at returns {bottom, quality, distance_nm} -- rendering the object
    // gave "[object Object]" on the phone. The distance matters: a rock
    // sounding a fifth of a mile away is a different claim from one underfoot.
    const bt = val('bottom');
    if (bt && bt.bottom)
      h += row('bottom', bt.bottom, res('bottom'),
               bt.distance_nm != null ? `nearest, ${bt.distance_nm} nm` : '');
    const st = val('structure') || {};
    const stk = Object.keys(st);
    if (stk.length)
      h += row('structure', stk.map(k => `${k} ${st[k]}`).join(', '),
               res('structure'), 'within 0.25 nm');

    h += group('the air');
    if (c.wind_kt != null)
      h += row('wind', `${Math.round(c.wind_kt)} kt`, 2500,
               `${c.wind_dir || ''} · forecast`);
    if (w.wind_kt != null)
      h += row('wind now', `${Math.round(w.wind_kt)} kt`, res('weather'),
               'observed', true);
    // The same pair the wind rows use: the forecast follows the slider, the
    // observation stays put and says so. `air` used to be the observed value
    // alone, which is why it could not move -- features has carried a
    // gridpoint air temperature all along and survey was dropping it.
    if (c.air_temp_f != null)
      h += row('air', `${Math.round(c.air_temp_f)}°F`, 2500, 'forecast');
    if (w.air_temp_f != null)
      h += row('air now', `${Math.round(w.air_temp_f)}°F`, res('weather'),
               'observed', true);
    if (c.pressure_trend_3h != null)
      h += row('pressure', `${c.pressure_trend_3h > 0 ? '+' : ''}${c.pressure_trend_3h.toFixed(1)} mb`,
               2500, '3h');
    if (c.light_phase) h += row('light', c.light_phase, null);
    const bu = val('buoy');
    if (bu && bu.wave_m != null)
      h += row('sea', `${bu.wave_m} m`, res('buoy'),
               `${bu.dom_period_s ?? '?'}s · buoy`, true);

    const tu = val('turbine');
    if (tu) h += row('turbine', `${tu[0]}`, res('turbine'), `${tu[1]} nm`);

    h += group('what else is here');
    const bl = val('bait_log') || [];
    h += row('bait seen', bl.length ? `${bl.length}` : 'none', 500, 'logged', true);
    const bd = val('birds') || {};
    h += row('birds', `${bd.bait_bird_records ?? 0}`, 500, 'bait-bird records', true);
    const wh = val('whales') || {};
    h += row('whales', `${wh.cetacean_records ?? 0}`, 500, 'records', true);

    const pr = val('protected');
    if (pr && (pr.rules || []).length){
      let inner = '';
      pr.rules.forEach(r => { inner += `<div class="srule">${esc(r)}</div>`; });
      (pr.areas || []).filter(a => !a.active).forEach(a => {
        inner += `<div class="srule">In the ${esc(a.name)} SMA, out of season ` +
                 `(${esc(a.season)}).</div>`;
      });
      h += `<details class="fold"><summary>rules &amp; protected species</summary>`
         + inner + `</details>`;
    }

    // Four periods of waves, gusts and fog were fetched on every survey and
    // rendered nowhere. The one covering the hour on the slider is the one
    // worth reading; past the last period it says so rather than showing
    // tonight's fog against Friday.
    const mf = val('marine_forecast') || {};
    if (mf.periods && mf.periods.length){
      const per = mf.period;
      h += group('the forecast');
      h += `<div class="srow mfrow"><div class="k">${esc(per ? per.name.toLowerCase() : 'marine')}</div>` +
           `<div class="v mftext">${per ? esc(per.text)
             : 'Past the end of the coastal waters forecast — it runs about ' +
               'two days and the slider goes further.'}</div></div>`;
      if (mf.name)
        h += `<div class="sdim">${esc(mf.name)} (${esc(mf.zone || '')}) · ` +
             `issued ${esc((mf.issued || '').replace('T', ' '))} · zone-wide, ` +
             `not a reading at this coordinate</div>`;
    }

    const un = Object.keys(d.unavailable || {});
    if (un.length)
      h += `<div class="sdim">not available: ${esc(un.join(', '))} — ` +
           `missing, not zero.</div>`;
    if ((d.binding_warnings || []).length)
      h += `<div class="sdim">${d.binding_warnings.map(esc).join('<br>')}</div>`;

    // Rules are law, not a readout. Folded so they are one line here and a
    // tap when you need them, instead of 135px in the middle of the numbers.
    h += diagBlock();
    LAST_SURVEY = d;
    body.innerHTML = h;
    fillDiag();
    // The sheet just changed height, and what it covers changed with it. The
    // ResizeObserver above catches this when the sheet is free to grow, but
    // once it hits max-height the body scrolls instead and the element never
    // resizes -- so the observer alone is not enough. Clamping here covers the
    // path that actually reported the bug: content arrives from a fetch, the
    // panel fills, and spot labels sit on top of it until the map is nudged.
    if (typeof clampLabels === 'function') clampLabels();
  }


  /* The whole point: the tap that opened this sheet already said where. The
     coordinate is the scarce part of a log entry -- a spot name drifts ("the
     reef" is four rocks over a season) but 41.4587,-71.3914 does not -- so it
     is carried straight through to the entry rather than being re-derived from
     whatever was selected in a list somewhere else. */
  function logSection(d) {
    const sel = document.getElementById('species');
    const species = sel ? sel.value : 'striped_bass';
    const name = (sel && sel.selectedOptions[0]) ? sel.selectedOptions[0].text : species;
    const now = new Date();
    const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
                    .toISOString().slice(0, 16);
    return `
      <div id="slog">
        <div class="sgroup">log a trip</div>
        <button id="slogtoggle" type="button">
          Log ${esc(name)} here &nbsp;·&nbsp; ${d.lat.toFixed(4)}, ${d.lon.toFixed(4)}
        </button>
        <form id="slogform" novalidate>
          <button id="slogmic" type="button">🎙 Say the trip</button>
          <label id="slogcam">📷 Photo of the fish
            <input type="file" accept="image/*" capture="environment" multiple hidden>
          </label>
          <div id="slogheard"></div>
          <select id="slogsp" name="species"></select>
          <div id="slogwarn"></div>
          <div class="two">
            <input type="number" name="count" min="0" value="0" inputmode="numeric"
                   placeholder="fish" required>
            <input type="number" name="biggest_in" min="0" step="0.5"
                   inputmode="decimal" placeholder="biggest (in)">
          </div>
          <input type="datetime-local" name="started_at" value="${local}">
          <input type="text" name="method" placeholder="method — live eel, bucktail…">
          <input type="text" name="bait_observed" placeholder="bait seen — silversides…">
          <input type="text" name="notes" placeholder="notes">
          <button id="slogsave" type="submit">Save this trip</button>
          <div id="slogmsg"></div>
          <div id="slognote">Blanks count. A model trained only on good days
            learns that every day is good. Saved on the phone first — a trip you
            did not record is gone, one that has not synced yet is fine.</div>
        </form>
      </div>`;
  }


  /* Speech goes to text in the browser, and only the sentence comes here --
     never audio, and never the coordinate, which came from the tap before
     anyone spoke. Extraction then runs on Ollama on your own machine.

     It fills the form. It does not save. A model that mishears "no fish" as
     "four fish" would otherwise write a fish that never existed into the one
     irreplaceable file in this project, and a wrong row is worse than a
     missing one -- months later it is indistinguishable from a real trip. */
  /* Photographs, not audio. Kept out of wireMic so the privacy test
     there still slices only the speech path: it bans `blob` among
     other audio-capture tokens, and a canvas toBlob for an image
     tripped it while proving nothing about the microphone. */
  function wirePhoto(form){
    if (!form) return;
    /* A phone photo is 3-12 MB and base64 adds a third on top, which on LTE
       from a boat is a request that does not finish. Downscaled to 1280 px on
       the long edge: still plenty for the vision model to name a fish, about a
       fortieth of the bytes.

       But a canvas re-encode throws EXIF away, and EXIF is the entire reason
       photolog can say where and when. The first cut did exactly that and the
       server answered "no EXIF block" and skipped every frame -- a photo
       feature that silently discarded every photo. So the original's APP1
       segment is spliced back into the shrunk JPEG: small upload, real
       coordinate. */
    function findApp1(bytes){
      if (bytes[0] !== 0xFF || bytes[1] !== 0xD8) return null;   // not a JPEG
      let i = 2;
      while (i + 4 < bytes.length){
        if (bytes[i] !== 0xFF) break;
        const marker = bytes[i + 1];
        const len = (bytes[i + 2] << 8) | bytes[i + 3];
        if (marker === 0xE1 &&
            String.fromCharCode(...bytes.slice(i + 4, i + 8)) === 'Exif'){
          return bytes.slice(i, i + 2 + len);
        }
        if (marker === 0xDA) break;            // start of scan: no more headers
        i += 2 + len;
      }
      return null;
    }

    async function shrink(file, max = 1280, quality = 0.85){
      const raw = new Uint8Array(await file.arrayBuffer());
      const app1 = findApp1(raw);

      const img = await new Promise((res, rej) => {
        const i = new Image();
        i.onload = () => res(i);
        i.onerror = rej;
        i.src = URL.createObjectURL(file);
      });
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);

      const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', quality));
      let out = new Uint8Array(await blob.arrayBuffer());
      if (app1){
        // SOI, then the original EXIF, then the rest of the re-encoded frame.
        const merged = new Uint8Array(out.length + app1.length);
        merged.set(out.slice(0, 2), 0);
        merged.set(app1, 2);
        merged.set(out.slice(2), 2 + app1.length);
        out = merged;
      }
      let bin = '';
      for (let i = 0; i < out.length; i += 0x8000)
        bin += String.fromCharCode.apply(null, out.subarray(i, i + 0x8000));
      return {b64: btoa(bin), hadExif: !!app1};
    }

    const cam = document.getElementById('slogcam');
    const camIn = cam && cam.querySelector('input[type=file]');
    if (camIn) camIn.onchange = async () => {
      const files = Array.from(camIn.files || []).slice(0, 12);
      if (!files.length) return;
      const heard = document.getElementById('slogheard');
      cam.classList.add('busy');
      cam.firstChild.nodeValue = `📷 reading ${files.length} photo…`;
      try{
        const photos = [];
        let missing = 0;
        for (const f of files){
          const r = await shrink(f);
          photos.push(r.b64);
          if (!r.hadExif) missing++;
        }
        const r = await fetch('/api/log/photo', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({photos})
        });
        const p = await r.json();
        if (p.error) throw new Error(p.error);
        const trip = (p.trips || [])[0];
        if (!trip) throw new Error(
          missing === files.length
            ? 'those photos carry no EXIF, so there is no time or place in them'
            : 'nothing recognisable in those');

        // Species and place only. `count` is deliberately left alone: a
        // photograph cannot honestly say how many fish were caught, and
        // photolog refuses to guess it. You fill that in.
        const spSel = document.getElementById('slogsp');
        const sp = ((trip.catch || [])[0] || {}).species;
        if (sp && spSel){ spSel.value = sp; spSel.dispatchEvent(new Event('change')); }
        if (trip.lat != null && trip.lon != null && typeof showConditions === 'function')
          window.PHOTO_AT = [trip.lat, trip.lon];
        if (trip.started_at){
          const el = form.querySelector('[name=started_at]');
          if (el) el.value = trip.started_at.slice(0, 16);
        }
        heard.className = 'show';
        heard.innerHTML = '<b>saw:</b> ' +
          (sp ? esc(sp.replace(/_/g,' ')) : 'no fish it could name') +
          (trip.lat != null
            ? ` · ${trip.lat.toFixed(4)}, ${trip.lon.toFixed(4)} from EXIF` : '') +
          (trip.started_at ? ` · ${esc(trip.started_at.replace('T',' '))}` : '') +
          '<br><span class="sdim">Count is yours to fill in — a photo cannot ' +
          'say how many.' +
          (missing ? ` ${missing} of ${files.length} had no EXIF and were skipped.`
                   : '') + '</span>';
      } catch(e){
        const heard = document.getElementById('slogheard');
        heard.className = 'show';
        heard.innerHTML = 'Could not read those: ' + esc(e.message) +
          '<br>Type it in instead.';
      } finally {
        cam.classList.remove('busy');
        cam.firstChild.nodeValue = '📷 Photo of the fish';
        camIn.value = '';
      }
    };

  }

  function wireMic(d){
    const btn = document.getElementById('slogmic');
    const form = document.getElementById('slogform');
    const heard = document.getElementById('slogheard');
    if (!btn || !form) return;

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR){
      btn.disabled = true;
      btn.textContent = 'Speech not supported in this browser';
      return;
    }

    let rec = null, running = false;
    const reset = () => {
      running = false;
      btn.classList.remove('live','thinking');
      btn.textContent = '🎙 Say the trip';
    };

    btn.onclick = () => {
      if (running){ try { rec.stop(); } catch(_){} return; }
      rec = new SR();
      rec.lang = 'en-US';
      rec.interimResults = true;
      // One utterance, not a dictation session: you say a sentence and stop.
      rec.continuous = false;

      let finalText = '';
      rec.onstart = () => {
        running = true;
        btn.classList.add('live');
        btn.textContent = '● Listening — tap to stop';
        heard.className = '';
      };
      rec.onresult = e => {
        let interim = '';
        for (let i = e.resultIndex; i < e.results.length; i++){
          const t = e.results[i][0].transcript;
          if (e.results[i].isFinal) finalText += t; else interim += t;
        }
        // Show it as it comes, so a bad recognition is obvious before it is
        // sent anywhere rather than after the form fills with nonsense.
        heard.className = 'show';
        heard.innerHTML = esc(finalText + interim) || '…';
      };
      rec.onerror = ev => {
        reset();
        heard.className = 'show';
        heard.textContent = ev.error === 'not-allowed'
          ? 'Microphone blocked. Allow it for this site and try again.'
          : 'Did not catch that (' + ev.error + '). Tap to try again.';
      };
      rec.onend = async () => {
        if (!finalText.trim()){ reset(); return; }
        btn.classList.remove('live');
        btn.classList.add('thinking');
        btn.textContent = 'Reading it…';
        try {
          const r = await fetch('/api/log/voice', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({transcript: finalText,
                                  species: (document.getElementById('species')||{}).value})
          });
          const p = await r.json();
          if (p.error){
            heard.className = 'show';
            heard.innerHTML = '<b>heard:</b> ' + esc(finalText) +
                              '<br>' + esc(p.error);
            reset(); return;
          }
          applyParse(p, form, heard, finalText);
        } catch (_) {
          heard.className = 'show';
          heard.innerHTML = '<b>heard:</b> ' + esc(finalText) +
            '<br>Saved nothing — could not reach the extractor. ' +
            'Type it in and the words are still above.';
        }
        reset();
      };
      try { rec.start(); } catch(_) { reset(); }
    };
  }

  /* Fill, do not submit. Every field stays editable and the transcript stays
     on screen, so the parse can be corrected before anything is written. */
  function applyParse(p, form, heard, transcript){
    const set = (name, val) => {
      if (val === undefined || val === null || val === '') return;
      const el = form.querySelector(`[name=${name}]`);
      if (el) el.value = val;
    };
    set('count', p.count);
    set('biggest_in', p.biggest_in);
    set('method', p.method);
    set('bait_observed', p.bait_observed);
    const extra = [p.notes, p.released ? `released ${p.released}` : ''] 
      .filter(Boolean).join(' · ');
    set('notes', extra);

    // A species heard that differs from the one selected is worth saying out
    // loud rather than silently switching the whole app under you.
    // A heard species sets the LOG's picker. It used to switch the whole app's
    // forecast, which is wrong twice over: it reloads the map under you, and it
    // cannot represent a fish the forecast does not model.
    const spSel = document.getElementById('slogsp');
    let note = '';
    if (p.species && spSel){
      spSel.value = p.species;
      spSel.dispatchEvent(new Event('change'));
      note = ` · logging as <b>${esc(p.species.replace(/_/g,' '))}</b>`;
    }
    const conf = p.confidence && p.confidence !== 'high'
      ? ` <span class="conf">(${esc(p.confidence)} confidence — check it)</span>` : '';
    heard.className = 'show';
    heard.innerHTML = '<b>heard:</b> ' + esc(transcript) + conf + note +
                      (p.overridden ? '<br><span class="conf">' +
                        esc(p.overridden) + '</span>' : '') +
                      '<br>Filled in below — check it, then save.';
  }


  /* Fill the log's species picker from the registry, grouped by where the fish
     lives. The warning below it is the important part: an absent size limit
     here means nobody verified it, not that there isn't one, and under a
     commercial licence that difference is a violation rather than a bad day. */
  let SPECIES_LIST = null;

  async function wireSpeciesPicker(){
    const sel = document.getElementById('slogsp');
    const warn = document.getElementById('slogwarn');
    if (!sel) return;
    if (!SPECIES_LIST){
      try { SPECIES_LIST = (await (await fetch('/api/species')).json()).loggable; }
      catch (_) { SPECIES_LIST = []; }
    }
    const groups = {inshore:'Inshore', nearshore:'Sounds & nearshore',
                    offshore:'Offshore'};
    sel.innerHTML = Object.entries(groups).map(([g, label]) => {
      const rows = SPECIES_LIST.filter(s => s.group === g);
      if (!rows.length) return '';
      return `<optgroup label="${label}">` + rows.map(s =>
        `<option value="${s.key}">${esc(s.name)}` +
        `${s.scored ? '' : ' ·'}${s.hms ? ' (HMS)' : ''}</option>`).join('') +
        `</optgroup>`;
    }).join('');

    const top = document.getElementById('species');
    if (top && SPECIES_LIST.some(s => s.key === top.value)) sel.value = top.value;

    const showWarn = () => {
      const s = SPECIES_LIST.find(x => x.key === sel.value);
      if (s && s.warning){ warn.className = 'show'; warn.textContent = s.warning; }
      else { warn.className = ''; warn.textContent = ''; }
    };
    sel.onchange = showWarn;
    showWarn();
  }

  function wireLog(d) {
    const btn = document.getElementById('slogtoggle');
    const form = document.getElementById('slogform');
    if (!btn || !form) return;
    btn.onclick = () => {
      form.classList.toggle('open');
      if (form.classList.contains('open')) {
        window.setSheet('full');
        form.scrollIntoView({behavior: 'smooth', block: 'nearest'});
      }
    };
    let submitting = false, armed = false, armTimer = null, armedAt = 0;
    const save = () => document.getElementById('slogsave');

    form.onsubmit = async e => {
      e.preventDefault();
      // Two taps on a phone are one intention. The first submit disables the
      // button outright; without this a double-tap wrote a real trip and then a
      // blank three seconds later into a log that had three entries in it.
      if (submitting) return;

      // And a blank is the specific thing a stray tap produces, so it has to be
      // deliberate. Blanks matter -- a model trained only on good days learns
      // every day is good -- but they should be chosen, not fallen into. The
      // button changes text, so the second tap of a double-tap lands on a
      // control that has not appeared yet.
      const n = Number(form.querySelector('[name=count]').value || 0);
      if (n === 0 && !armed) {
        armed = true;
        const b = save();
        b.textContent = 'Confirm: no fish';
        b.style.background = 'var(--warn)';
        // 900ms, not 450: a "double tap" on a boat is not the 300ms browsers
        // mean by it -- it is two deliberate presses a moment apart, and 450
        // was inside that. The button stays dead until well past any plausible
        // second press, and the disabled state is checked in code too, because
        // a disabled attribute alone does not stop every path to submit.
        b.disabled = true;
        setTimeout(() => { b.disabled = false; }, 900);
        armedAt = Date.now();
        clearTimeout(armTimer);
        armTimer = setTimeout(() => {
          armed = false; b.textContent = 'Save this trip';
          b.style.background = '';
        }, 6000);
        return;
      }
      // Belt and braces: even if a submit arrives while the button is disabled
      // -- a stray Enter, an autofill, a synthetic event -- refuse it until the
      // arming window has actually elapsed.
      if (armed && Date.now() - armedAt < 900) return;
      clearTimeout(armTimer);
      submitting = true;
      const btn = save();
      btn.disabled = true;
      btn.textContent = 'saving…';

      const sel = document.getElementById('species');
      const f = new FormData(form);
      // The LOG's species, not the forecast's. They are different questions
      // and the forecast only knows six fish.
      const spSel = document.getElementById('slogsp');
      const body = {
        // No spot key: the server mints "at:lat,lon" for a bare coordinate, and
        // snapshot() resolves it to stations exactly as a named spot would, so
        // this trip is as complete a training example as any other.
        lat: d.lat, lon: d.lon,
        species: (spSel && spSel.value) || (sel ? sel.value : 'striped_bass'),
        client_id: (crypto.randomUUID?.() || String(Date.now()) + Math.random()),
      };
      for (const [k, v] of f.entries()) if (v !== '') body[k] = v;

      const msg = document.getElementById('slogmsg');
      msg.className = ''; msg.textContent = 'saving…';
      const release = () => {
        submitting = false; armed = false;
        const b = save();
        if (b) { b.disabled = false; b.textContent = 'Save this trip'; b.style.background = ''; }
      };
      try { await queueAdd(body); }
      catch (err) {
        msg.className = 'err';
        msg.textContent = 'could not save: ' + err.message;
        release();
        return;
      }
      form.reset();
      const res = await flushQueue();
      if (res.sent) {
        const s = res.summary;
        msg.className = 'ok';
        msg.textContent = s
          ? `saved · ${s.trips} trips, ${s.fish} fish, ${s.blanks} blanks`
          : 'saved';
      } else {
        const n = await pendingCount();
        msg.className = '';
        msg.innerHTML = `<span style="color:var(--warn)">held on this phone` +
                        ` · ${n} waiting to sync</span>`;
      }
      release();
      if (typeof refreshNetState === 'function') refreshNetState();
      if (typeof loadBait === 'function' && MAP_READY) loadBait();
    };
  }

  /* The panel is NOT moved into the sheet any more. It used to be: the whole
     desktop sidebar was relocated here on a phone, which put a 1,075px slab of
     rules, ranked list and mark card at the bottom of everything else and made
     the sheet 3.2 screens tall with no way to reach any of it.
     The tabs replaced that job. The panel now simply stays hidden on a phone,
     and each of its parts has a view of its own.

     Moving it was also quietly destructive: render() rebuilds the sheet with
     innerHTML, which deleted the relocated nodes outright rather than
     returning them, so the sidebar came back empty on a resize to desktop. */
  const MOBILE = () =>
    window.matchMedia('(max-width:900px), (pointer:coarse)').matches;



  /* Read this off the screen rather than asking for devtools. Every number is
     measured live, so a stale shell shows its own old values and gives itself
     away. */
  /* Read this off the screen rather than asking for devtools, which is not a
     thing you can do on a phone.

     Filled in AFTER the sheet is in the DOM, not while its HTML is being built
     -- the first version measured `.srow .v` before any row existed, fell back
     to <body>, and confidently reported 14px and "panel in sidebar" when both
     were wrong. A diagnostic that lies is worse than none. */
  function diagBlock(){ return '<div id="diag">reading…</div>'; }

  function fillDiag(){
    const el = document.getElementById('diag');
    if (!el) return;
    const v = document.querySelector('.srow .v');
    const size = v ? getComputedStyle(v).fontSize : null;
    const coarse = matchMedia('(pointer:coarse)').matches;
    const mob = MOBILE();
    const inSheet = !!document.querySelector('#sheet #adopted');
    const build = window.__SHELL || (('serviceWorker' in navigator)
      ? 'not registered' : 'unsupported');
    // Only claim staleness on evidence, and the size test is only evidence on
    // the touch layout. 22px is the mobile override; the desktop base really
    // is 19px, so an unqualified "under 20 means stale" fired on every single
    // desktop load and told the truth-teller to distrust itself.
    const stale = (mob && size && parseFloat(size) < 20) || (coarse && !mob);
    el.innerHTML =
      `build <b>${build}</b> · viewport <b>${innerWidth}×${innerHeight}</b>` +
      ` · pointer <b>${coarse ? 'coarse' : 'fine'}</b><br>` +
      `layout <b>${mob ? 'touch' : 'desktop'}</b>` +
      ` · ui scale <b>${getComputedStyle(document.documentElement)
          .getPropertyValue('--ui').trim() || '1'}×</b>` +
      ` · panel <b>${inSheet ? 'in sheet' : 'in sidebar'}</b>` +
      ` · value text <b>${size || '—'}</b>` +
      (stale ? '<br><span class="warn">This looks like an old cached build — '
             + 'close the app completely and reopen it.</span>' : '') +
      (innerWidth > 700 && coarse
        ? '<br><span class="warn">Chrome is reporting a ' + innerWidth
          + 'px desktop viewport on a touch screen — "Desktop site" is on in the '
          + '⋮ menu. Text is being scaled up to compensate; turning it off is '
          + 'sharper.</span>'
        : '');
  }


  /* ---- views ----------------------------------------------------------
   * One at a time. Each is rebuilt on switch rather than hidden, so nothing
   * off-screen is holding a stale reading, and the sheet never grows past
   * roughly one screen of content.
   */
  let VIEW = 'now', LAST_SURVEY = null;

  function setTab(v){
    VIEW = v;
    document.querySelectorAll('#tabs button').forEach(b =>
      b.classList.toggle('on', b.dataset.view === v));
  }

  async function showView(v){
    setTab(v);
    window.setSheet('full');
    if (v === 'now')   return LAST_SURVEY ? render(LAST_SURVEY) : nowEmpty();
    if (v === 'log')   return renderLog();
    if (v === 'spots') return renderSpots();
    if (v === 'trips') return window.showTrips && window.showTrips();
  }
  window.showView = showView;

  function nowEmpty(){
    body.innerHTML = '<div class="sdim">Tap anywhere on the water, or press ' +
      'HERE, to read the conditions at that spot.</div>';
  }

  /* The log form on its own screen, which is what it always needed: it is the
     one thing you do with wet hands and it was previously below two screens
     of readout. */
  function renderLog(){
    const d = LAST_SURVEY;
    if (!d){
      body.innerHTML = '<div class="sdim">Pick a spot first — tap the water ' +
        'or press HERE. A trip is logged against a coordinate.</div>';
      return;
    }
    body.innerHTML =
      `<div class="sgroup">logging at ${d.lat.toFixed(4)}, ${d.lon.toFixed(4)}</div>`
      + logSection(d).replace('<div id="slog">', '<div id="slog" style="border-top:0">');
    wireLog(d); wireMic(d); wireSpeciesPicker();
    wirePhoto(document.getElementById('slogform'));
    const f = document.getElementById('slogform');
    if (f) f.classList.add('open');            // no second tap to open it
    const t = document.getElementById('slogtoggle');
    if (t) t.style.display = 'none';           // the tab already did that job
  }

  /* The ranked list, which used to arrive as part of a 1,075px slab of the old
     desktop sidebar dropped at the bottom of everything. */
  function renderSpots(){
    // `GRID` is a module-scope `let`, so it is not a property of window and
    // `window.GRID` was always undefined. The Spots tab has therefore shown
    // "No forecast loaded yet" since it was written, with a forecast loaded
    // and the ranked list beside it full. The same scope confusion as the
    // `esc`/`tesc` bugs: a binding in one place read through another.
    if (!GRID || !GRID.spots){
      body.innerHTML = '<div class="sdim">No forecast loaded yet.</div>';
      return;
    }
    const t = GRID.times ? GRID.times[TI] : null;
    // `|| 0` turned a spot that could not be scored into a spot scored zero,
    // which sorts it to the bottom and reads as "we looked and it is awful".
    // Three of the twenty-one are in that state right now -- Mackerel Cove,
    // Wickford Harbor and Greenwich Bay Entrance have no current predictions
    // at their station at all -- and build_grid is careful to send `scores:
    // []` rather than zeroes for exactly this reason. The interface was
    // undoing that server-side care in one expression.
    const rows = GRID.spots
      .map(sp => ({sp, s: (sp.scores || [])[TI] ?? null}))
      .sort((a, b) => (b.s ?? -1) - (a.s ?? -1));
    body.innerHTML =
      `<div class="sgroup">${GRID.species_name || ''}` +
      `${t ? ' · ' + new Date(t).toLocaleString([], {weekday:'short', hour:'2-digit', minute:'2-digit'}) : ''}</div>` +
      rows.map(({sp, s}) => {
        const d = (sp.detail || [])[TI] || {};
        const cur = d.current_speed != null
          ? `${d.current_speed.toFixed(2)} kt ${d.current_dir || ''}` : '';
        return `<div class="trip" data-spot="${esc(sp.key)}">
            <div class="when">${esc(sp.name)}</div>
            <div class="fish">${s == null ? '—' : Math.round(s)}</div>
            <div class="meta">${s == null
              ? esc((sp.error || 'not scored here').replace(/\.$/, ''))
              : esc(cur)}</div>
          </div>`;
      }).join('');
    body.querySelectorAll('[data-spot]').forEach(el => el.onclick = () => {
      const sp = GRID.spots.find(x => x.key === el.dataset.spot);
      if (!sp) return;
      if (MAP_READY) map.easeTo({center:[sp.lon, sp.lat],
                                 zoom: Math.max(map.getZoom(), 12), duration:600});
      show(sp.lat, sp.lon, sp.name);          // straight into Now for that spot
    });
  }

  document.querySelectorAll('#tabs button').forEach(b =>
    b.onclick = () => showView(b.dataset.view));

  // Boot AFTER the view code above: setTab and nowEmpty close over `VIEW`,
  // and calling them earlier hit its temporal dead zone and took the whole
  // script down -- which is why showConditions stopped existing at all.
  if (MOBILE()){
    setSheet('peek');          // a reachable strip, not the whole screen
    setTab('now');
    nowEmpty();
  }

  /* Re-read the open panel at whatever time the slider is on.
     Only `conditions` actually moves -- current, light. Everything else the
     survey returns is either genuinely fixed (depth, bottom, the stations) or
     an observation that cannot be forecast at all (water level anomaly, bird
     and whale records, logged bait). Those rows are marked rather than
     silently re-rendered as though they had moved with the rest. */
  window.refreshSurveyAtTime = async function(){
    if (!SURVEY_AT || !GRID || !GRID.times) return;
    const t = GRID.times[TI];
    if (!t) return;
    const atNow = TI === 0;
    window.surveyAtTime = atNow ? null : t;
    try{
      const r = await fetch(window.surveyURL(SURVEY_AT[0], SURVEY_AT[1]));
      const d = await r.json();
      if (d.error) return;
      when.textContent = new Date(d.when).toLocaleString([],
        {weekday: atNow ? undefined : 'short', hour:'2-digit', minute:'2-digit'});
      render(d);
    }catch(_){ /* offline: leave what is on screen rather than blanking it */ }
  };

  async function show(lat, lon, label){
    SURVEY_AT = [lat, lon];
    title.textContent = label || `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
    when.textContent = '';
    zoneE.textContent = '';
    body.innerHTML = '<div class="sdim">reading conditions…</div>';
    window.setSheet('full');
    setTab('now');
    if (typeof clampLabels === 'function') setTimeout(clampLabels, 240);
    try{
      const r = await fetch(window.surveyURL(lat, lon));
      const d = await r.json();
      if (d.error){ body.innerHTML = `<div class="sdim">${esc(d.error)}</div>`; return; }
      zoneE.textContent = d.zone || '';
      when.textContent = new Date(d.when).toLocaleTimeString([],
                          {hour:'2-digit', minute:'2-digit'});
      render(d);
    }catch(err){
      // Offline is the normal case on a boat, not an error state.
      body.innerHTML = '<div class="sdim">no connection — conditions need the ' +
                       'network. The map and your marks still work.</div>';
    }
  }
  window.showConditions = show;

  /* Dragged, not tapped, shut: a knuckle on a moving boat should not be able
     to dismiss the panel mid-read. */
  // The sheet's top edge moves when it is dragged, so what it covers changes.
  // A declaration, not a const arrow: setSheet calls it, boot calls setSheet,
  // and boot runs above this line -- a const would still be in its temporal
  // dead zone there and would take the whole script down on the way past.
  function reclamp(){ if (typeof clampLabels === 'function') setTimeout(clampLabels, 240); }

  const grip = document.getElementById('sheetgrip');
  const cue  = grip.querySelector('.gcue');

  /* One place that owns where the sheet sits.
     Every caller used to do `add('up'); remove('peek')` by hand, and the pair
     was not always complete -- the drag handler added 'peek' while leaving
     'up' on, so the sheet booted in the impossible state "up peek" and which
     rule won came down to source order in the stylesheet. Three states, one
     setter, no combinations. */
  function setSheet(state){
    const el = document.getElementById('sheet');
    if (!el) return;
    el.classList.remove('up','peek');
    if (state === 'full') el.classList.add('up');
    else if (state === 'peek') el.classList.add('peek');
    const c = el.querySelector('#sheetgrip .gcue');
    if (c) c.textContent = state === 'full' ? 'tap to shrink'
                         : state === 'peek' ? 'tap to close' : '';
    reclamp();
  }
  function sheetState(){
    const el = document.getElementById('sheet');
    if (!el) return 'shut';
    return el.classList.contains('peek') ? 'peek'
         : el.classList.contains('up')   ? 'full' : 'shut';
  }
  // Three script scopes each hold their own `sheet` binding, so the one
  // setter has to be reachable from all of them.
  window.setSheet = setSheet; window.sheetState = sheetState;

  /* Drag to place it, or just tap.
     Drag-only dismissal was the original design -- the worry was a knuckle
     shutting the panel mid-read. But the handle is the only thing that takes
     the tap, and a knuckle lands on content, so the worry is covered without
     demanding a gesture that has to clear a 40px threshold on a pitching
     boat. Tap steps it down one; a long drag closes it outright. */
  let y0 = null, t0 = 0, base = 0, moved = false;
  const STEP_DOWN = {full:'peek', peek:'shut', shut:'shut'};

  grip.addEventListener('pointerdown', e => {
    y0 = e.clientY; t0 = Date.now(); moved = false;
    base = sheet.getBoundingClientRect().top;
    sheet.classList.add('drag');
    try { grip.setPointerCapture(e.pointerId); } catch (_) {}
  });

  grip.addEventListener('pointermove', e => {
    if (y0 == null) return;
    const dy = e.clientY - y0;
    if (Math.abs(dy) > 6) moved = true;
    // Follow the finger, but never above the sheet's natural top.
    if (moved) sheet.style.transform = 'translateY(' + Math.max(0, dy) + 'px)';
  });

  const endDrag = e => {
    if (y0 == null) return;
    const dy = (e && typeof e.clientY === 'number') ? e.clientY - y0 : 0;
    const dt = Date.now() - t0;
    y0 = null;
    sheet.classList.remove('drag');
    sheet.style.transform = '';       // hand control back to the classes
    const was = sheetState();
    if (!moved && dt < 700){          // a tap: step down one
      setSheet(STEP_DOWN[was]);
    } else if (dy > 120){             // a decisive pull: straight shut
      setSheet('shut');
    } else if (dy > 30){              // a short pull: one step
      setSheet(STEP_DOWN[was]);
    } else if (dy < -30){             // a pull up: open fully
      setSheet('full');
    } else {
      setSheet(was);                  // went nowhere; put it back
    }
  };
  grip.addEventListener('pointerup', endDrag);
  // Without this a cancelled gesture leaves the sheet stuck mid-drag with
  // transitions off, which looks exactly like the app having frozen.
  grip.addEventListener('pointercancel', endDrag);
  grip.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){
      e.preventDefault(); setSheet(STEP_DOWN[sheetState()]);
    }
  });

  const here = document.getElementById('here');
  here.addEventListener('click', () => {
    if (!navigator.geolocation){
      show(map.getCenter().lat, map.getCenter().lng, 'Map centre');
      return;
    }
    here.classList.add('busy');
    navigator.geolocation.getCurrentPosition(pos => {
      here.classList.remove('busy');
      const {latitude:la, longitude:lo} = pos.coords;
      map.easeTo({center:[lo, la], zoom: Math.max(map.getZoom(), 13)});
      show(la, lo, 'Where you are');
    }, () => {
      // Denied or unavailable: the map centre is still a real place to ask
      // about, and is better than an error toast on a boat.
      here.classList.remove('busy');
      show(map.getCenter().lat, map.getCenter().lng, 'Map centre');
    }, {enableHighAccuracy:true, timeout:8000, maximumAge:15000});
  });
})();
</script>
</body>
</html>
