<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1518">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<title>Tiderace — Narragansett Bay</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#0B1518; --panel:#122126; --panel-2:#16292F; --hair:#274048;
  --ink:#E4ECEE; --ink-2:#C2D3D7; --muted:#8CA3A8;
  --accent:#F04FA0; --depth:#4FB3C7;
  --good:#4FBF89; --warn:#D9A521; --crit:#E0705F;
  /* Marker ink, so the map labels follow the theme instead of being welded
     to one. They used to be #E4ECEE with a near-black glow, which is exactly
     backwards on a white chart in the sun. */
  --mk-ink:#E4ECEE; --mk-halo:#0B1518; --mk-edge:#0B1518;
  /* Translucent surfaces and hairlines. These were literals, so the top bar
     and the layers menu stayed dark under the daylight palette -- light
     chrome over a light map with a dark bar floating on it. */
  --panel-a:rgba(18,33,38,.94); --panel-b:rgba(18,33,38,.97);
  --hair-a:rgba(39,64,72,.5); --halo:rgba(11,21,24,.9);
  --scrim:rgba(11,21,24,.86); --crit-wash:rgba(229,62,62,.14);
  --chart-ink:#8FDCEA; --chart-ink-2:#B7C6CB;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}

/* Daylight. Not an inversion of the dark theme -- a different problem.
   Reading a phone at noon on open water is a contrast fight against a sky
   reflecting off the glass, so this goes further than "light mode": near-black
   text on near-white, hairlines dark enough to survive glare, and the accent
   pushed to a deep magenta that still reads at low screen brightness against a
   pale chart. The bay is the one thing that stays coloured, so water still
   looks like water. */
:root[data-theme="light"]{
  --ground:#F2F5F6; --panel:#FFFFFF; --panel-2:#E6ECEE; --hair:#9DB0B6;
  --ink:#06171C; --ink-2:#1E3A42; --muted:#41595F;
  --accent:#B0106E; --depth:#0F6C80;
  --good:#12653F; --warn:#7A5200; --crit:#9B2317;
  --mk-ink:#06171C; --mk-halo:#FFFFFF; --mk-edge:#FFFFFF;
  --panel-a:rgba(255,255,255,.95); --panel-b:rgba(255,255,255,.98);
  --hair-a:rgba(80,105,113,.34); --halo:rgba(255,255,255,.92);
  --scrim:rgba(242,245,246,.9); --crit-wash:rgba(155,35,23,.13);
  --chart-ink:#0A5567; --chart-ink-2:#3D5257;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--display); font-size:14px; overflow:hidden;
}
#app{display:grid; grid-template-columns:1fr 360px; height:100%}
#map{width:100%; height:100%; background:var(--ground)}

/* ------------------------------------------------------------ top bar */
#bar{
  position:absolute; top:12px; left:12px; z-index:5;
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  background:var(--panel-a); border:1px solid var(--hair);
  border-radius:6px; padding:8px 10px; backdrop-filter:blur(8px);
  /* Leave the top-right corner free for the zoom, scale and attribution
     controls, which now live there. */
  max-width:calc(100% - 96px);
}
.brand{
  font-weight:700; letter-spacing:-.02em; font-size:15px; padding-right:10px;
  border-right:1px solid var(--hair); margin-right:2px; white-space:nowrap;
}
.brand span{color:var(--accent)}
select,button{
  font-family:var(--display); font-size:13px; font-weight:500;
  background:var(--panel-2); color:var(--ink); border:1px solid var(--hair);
  border-radius:4px; padding:6px 9px; cursor:pointer;
}
select:hover,button:hover{border-color:var(--depth)}
button.primary{background:var(--accent); border-color:var(--accent); color:#12060D; font-weight:600}
button.primary:hover{filter:brightness(1.1)}
label.chk{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--ink-2); cursor:pointer}
#netstate{
  font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; padding:.3em .55em; border-radius:3px; white-space:nowrap;
}
#netstate.off{color:var(--crit); border:1px solid var(--crit); background:rgba(224,112,95,.12)}
#netstate.queued{color:var(--warn); border:1px solid var(--warn); background:rgba(217,165,33,.12)}
#netstate.ok{display:none}
#mode{
  font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.1em;
  text-transform:uppercase; padding:.3em .55em; border-radius:3px; white-space:nowrap;
}
#mode.rec{color:var(--muted); border:1px solid var(--hair)}
#mode.com{color:#D9A521; border:1px solid #D9A521; background:rgba(217,165,33,.1)}
#regs{
  font-family:var(--mono); font-size:11px; line-height:1.5; color:var(--ink-2);
  background:var(--panel-2); border:1px solid var(--hair);
  border-left:2px solid var(--depth); border-radius:0 4px 4px 0; padding:9px 11px;
}
#regs.closed{border-left-color:var(--crit)}
#regs b{color:var(--ink)}
#regs .warn{color:#D9A521; display:block; margin-top:6px}

/* ---------- chart overlay menu ---------- */
#layers{
  display:none; position:absolute; top:calc(100% + 6px); right:0; z-index:6;
  background:var(--panel-b); border:1px solid var(--hair); border-radius:6px;
  padding:9px 11px; min-width:220px; backdrop-filter:blur(8px);
}
#layers.open{display:block}
#layers h4{margin:0 0 7px; font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--accent); font-family:var(--mono); font-weight:600}
#layers label{display:flex; align-items:center; gap:7px; font-size:12px;
  color:var(--ink-2); cursor:pointer; padding:3px 0}
#layers .sw{width:10px; height:10px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.5)}
#layers .sw.ramp{width:26px; border-radius:2px}
#layers .cnt{margin-left:auto; font-family:var(--mono); font-size:10px; color:var(--muted)}
#depthkey{margin:6px 0 2px}
#depthkey .bar{display:flex; height:7px; border-radius:2px; overflow:hidden}
#depthkey .bar i{flex:1}
#depthkey .ends{display:flex; justify-content:space-between; margin-top:3px;
  font-family:var(--mono); font-size:9.5px; color:var(--muted)}
#layers .hint{margin:7px 0 0; padding-top:7px; border-top:1px solid var(--hair);
  font-size:10.5px; color:var(--muted); line-height:1.45; font-family:var(--mono)}

/* ------------------------------------------------------ time scrubber */
#timebar{
  position:absolute; bottom:14px; left:12px; right:calc(360px + 12px); z-index:5;
  background:var(--panel-a); border:1px solid var(--hair); border-radius:6px;
  padding:10px 14px 12px; backdrop-filter:blur(8px);
}
#timebar .row{display:flex; align-items:baseline; gap:12px; margin-bottom:7px}
#tlabel{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--accent)}
#tsub{font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.05em}
input[type=range]{width:100%; accent-color:var(--accent); cursor:pointer}
#ticks{display:flex; justify-content:space-between; font-family:var(--mono);
  font-size:10px; color:var(--muted); margin-top:3px; letter-spacing:.04em}

/* -------------------------------------------------------------- panel */
#panel{
  background:var(--panel); border-left:1px solid var(--hair);
  overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px;
}
.ph{
  font-family:var(--mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent);
  display:flex; align-items:center; gap:8px;
}
.ph::after{content:""; flex:1; height:1px; background:var(--hair)}
.card{background:var(--panel-2); border:1px solid var(--hair); border-radius:5px; padding:12px}
.card h3{margin:0 0 2px; font-size:15px; letter-spacing:-.01em}
.card .sub{font-family:var(--mono); font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted)}
.big{font-size:34px; font-weight:700; letter-spacing:-.03em; line-height:1;
  font-variant-numeric:tabular-nums}
.kv{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin-top:10px;
  font-family:var(--mono); font-size:11.5px}
.kv dt{color:var(--muted); letter-spacing:.05em}
.kv dd{margin:0; color:var(--ink-2); font-variant-numeric:tabular-nums}
.why{margin-top:10px; padding-top:10px; border-top:1px solid var(--hair);
  font-size:12px; color:var(--ink-2); line-height:1.5}
.rank{display:flex; flex-direction:column; gap:1px}
.rank button{
  display:grid; grid-template-columns:38px 1fr auto; gap:9px; align-items:center;
  width:100%; text-align:left; background:var(--panel-2); border:1px solid transparent;
  border-radius:4px; padding:7px 9px; font-size:12.5px;
}
.rank button:hover{border-color:var(--depth)}
.rank button.on{border-color:var(--accent)}
.rank .s{font-family:var(--mono); font-weight:600; font-variant-numeric:tabular-nums; font-size:12px}
.rank .m{font-family:var(--mono); font-size:10px; color:var(--muted)}
.empty{color:var(--muted); font-size:12.5px; line-height:1.55}
.note{font-size:11.5px; color:var(--muted); line-height:1.5}
/* The dropped mark reads as a crosshair rather than another spot dot: it is a
   question you asked, not a place anyone has recommended. */
.markpin{width:22px; height:22px; border-radius:50%; border:2px solid var(--accent);
  box-shadow:0 0 0 1px var(--halo), 0 0 12px rgba(240,79,160,.55);
  background:rgba(240,79,160,.16); cursor:pointer}
.conf{font-family:var(--mono); font-size:10px; text-transform:uppercase;
  letter-spacing:.08em; padding:1px 6px; border-radius:3px; border:1px solid var(--hair)}
.conf.good{color:#5FE3C0; border-color:#2F6E60}
.conf.fair{color:#D9A521; border-color:#6E5A21}
.conf.poor{color:#E0705F; border-color:#7A3A32}
.markwarn{color:#D9A521; font-size:11px; line-height:1.5; margin-top:8px}
.markwin{display:flex; justify-content:space-between; gap:8px; font-family:var(--mono);
  font-size:11px; padding:4px 0; border-top:1px solid var(--hair)}
form{display:flex; flex-direction:column; gap:7px}
input[type=text],input[type=number],input[type=datetime-local]{
  font-family:var(--mono); font-size:12px; background:var(--ground); color:var(--ink);
  border:1px solid var(--hair); border-radius:4px; padding:6px 8px; width:100%;
}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:7px}
.ok{color:var(--good); font-family:var(--mono); font-size:11.5px}
.err{color:var(--crit); font-family:var(--mono); font-size:11.5px}
.maplibregl-popup-content{background:var(--panel); color:var(--ink);
  border:1px solid var(--hair); border-radius:5px; font-family:var(--mono); font-size:11px}
.maplibregl-popup-tip{border-top-color:var(--panel)!important}
.maplibregl-ctrl-attrib{font-size:10px!important}
/* MapLibre's own controls ship a white surface and dark glyphs. That is right
   in daylight and wrong at night, and they are the last things on the map
   still fixed to one theme. */
:root[data-theme="dark"] .maplibregl-ctrl-attrib,
:root[data-theme="dark"] .maplibregl-ctrl-group{
  background:var(--panel-a)!important; color:var(--ink-2)!important;
}
:root[data-theme="dark"] .maplibregl-ctrl-attrib a{color:var(--depth)!important}
:root[data-theme="dark"] .maplibregl-ctrl-group button+button{
  border-top-color:var(--hair)!important;
}
:root[data-theme="dark"] .maplibregl-ctrl-icon{filter:invert(1) hue-rotate(180deg)}
.maplibregl-ctrl-top-right{display:flex; flex-direction:column; align-items:flex-end}
.maplibregl-ctrl-scale{
  background:var(--panel-a)!important; border-color:var(--hair)!important;
  color:var(--ink-2)!important; font-family:var(--mono); font-size:10px;
}
#spark{width:100%; height:52px; display:block; margin-top:10px}
#loading{
  position:absolute; inset:0; z-index:9; display:grid; place-items:center;
  background:var(--scrim); font-family:var(--mono); font-size:12px;
  color:var(--depth); letter-spacing:.1em; text-transform:uppercase;
}
#loading.hide{display:none}


/* ---- conditions sheet -------------------------------------------------
   Built for a phone held in one hand on a moving boat. Everything that
   matters is in the bottom third where a thumb reaches; type is large
   because the alternative is a wet screen in direct sun; and the sheet is
   dragged rather than tapped shut so a knuckle cannot dismiss it by
   accident mid-read. */
#sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--panel); border-top:1px solid var(--hair);
  border-radius:16px 16px 0 0;
  transform:translateY(100%); transition:transform .22s cubic-bezier(.2,.8,.3,1);
  max-height:calc(86vh / var(--ui, 1)); display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -18px 44px rgba(0,0,0,.5);
  /* touch-action deliberately NOT set here. It used to be `none` on the whole
     sheet to stop the drag gesture being stolen, but the browser intersects
     touch-action up the ancestor chain, so that one line also made #sheetbody
     -- the scrolling region holding every reading -- refuse to scroll under a
     finger. The gesture only ever happens on the handle, so the restriction
     lives on the handle. */
}
/* A bump marker carries its relief in feet, because the number is the whole
   reason to go and look. Novel ones -- more than 100 m from any charted rock,
   wreck or obstruction -- are brighter: a chart exists to keep boats off the
   shallow spots, so the ones already on it are not discoveries. */
.bump{
  min-width:26px; height:26px; padding:0 5px; border-radius:13px;
  display:grid; place-items:center; cursor:pointer;
  font:600 11px/1 var(--mono); color:#04121a;
  background:#7f9aa3; border:2px solid rgba(0,0,0,.45);
  box-shadow:0 2px 8px rgba(0,0,0,.5);
}
.bump.novel{background:#ffd166}
#toast{
  position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(8px); z-index:60;
  max-width:min(92vw, 440px); padding:11px 15px; border-radius:10px;
  background:var(--panel); color:var(--ink); border:1px solid var(--hair);
  font:13px/1.45 var(--display); box-shadow:0 10px 30px rgba(0,0,0,.55);
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s;
}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
#sheet.up{transform:translateY(0)}
#sheet.peek{transform:translateY(calc(100% - 168px))}
/* While a finger is down the sheet tracks it directly; the easing is for
   released gestures, and leaving it on makes the drag feel like sludge. */
#sheet.drag{transition:none}
#sheetgrip{
  /* 44px of actual touch target, not the 21px the visible bar would give.
     This is the control you use with wet hands on a moving boat, so the hit
     area is sized for that even though the bar drawn inside it is small. */
  flex:none; min-height:44px; padding:10px 0 8px;
  display:grid; place-items:center; gap:5px; cursor:grab;
  touch-action:none;   /* the drag is ours; do not let the page pan instead */
  -webkit-tap-highlight-color:transparent; user-select:none;
}
#sheetgrip .gbar{width:44px; height:5px; border-radius:3px; background:var(--hair)}
#sheetgrip:active .gbar{background:var(--muted)}
/* Says what the handle does. The handle was drag-only and undiscoverable:
   nothing about a grey bar tells you it is also a button, and a drag that
   has to clear a threshold is the wrong ask with wet hands on a wet screen. */
/* Whether the season is open, and the size, on the screen that is actually
   in your hand. This lived only in the desktop sidebar, which is display:none
   on a phone, so from the tab restructure until now the app never once told
   Matt on the water whether a fish was legal. He fishes commercially under his
   father's licence, where that gap is a fine rather than a bad forecast.
   Above the tabs, so it is on every view including Log. */
#slegal{flex:none}
#slegal .lg{
  display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;
  padding:9px 16px; border-bottom:1px solid var(--hair);
  font:12px/1.4 var(--mono); color:var(--ink-2);
}
#slegal .lg b{font:700 12px/1 var(--mono); letter-spacing:.08em}
/* OPEN or CLOSED is the most important word in the app and it was the least
   readable thing on the screen in daylight: 1.82:1, a pale pink on a pale red
   tint. `var(--ok, ...)` referenced a token that has never existed, so it
   always fell through to its hardcoded light green, and the shut colour was a
   literal. Both are per-theme tokens now. */
#slegal .lg.open b{color:var(--good)}
#slegal .lg.shut{background:var(--crit-wash)}
#slegal .lg.shut b{color:var(--crit)}
#slegal .lg .sz{font:700 13px/1 var(--display); color:var(--ink)}
#slegal .lg .ln{color:var(--muted); font-size:11px}
#slegal .lmore{border-bottom:1px solid var(--hair)}
#slegal .lmore summary{
  padding:7px 16px; font:10px/1 var(--mono); letter-spacing:.12em;
  text-transform:uppercase; color:var(--muted); cursor:pointer;
}
#slegal .ld{padding:0 16px 7px; font:11px/1.45 var(--mono); color:var(--ink-2)}
#slegal .ld.warn{color:var(--warn)}
#slegal .ld.dim{color:var(--muted)}
#slegal .ld.ap{padding-bottom:9px}
#slegal .apv{font:700 13px/1.3 var(--display); color:var(--ink)}
#slegal .apm{color:var(--muted)}
#slegal .rl{color:var(--warn); font-weight:600}
#slegal .apl{
  display:inline-block; margin-left:4px; color:var(--depth);
  text-decoration:none; border-bottom:1px solid currentColor;
  font:600 11px/1 var(--mono); padding-bottom:1px;
}
#slegal .apq{
  color:var(--muted); font:11px/1.5 var(--mono);
  margin-top:4px; padding-left:9px; border-left:2px solid var(--hair);
}
#sheetgrip .gcue{
  font:10px/1 var(--mono); letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); pointer-events:none;
}
#sheethead{
  flex:none; display:flex; align-items:baseline; gap:10px;
  padding:0 16px 10px; border-bottom:1px solid var(--hair);
}
#sheethead b{font:600 17px/1.15 var(--display); color:var(--ink)}
#sheethead span{font:11px/1 var(--mono); color:var(--muted); letter-spacing:.06em}
#sheetzone{
  margin-left:auto; font:10px/1 var(--mono); letter-spacing:.1em;
  text-transform:uppercase; color:var(--depth);
  border:1px solid var(--hair); border-radius:999px; padding:5px 9px;
}
#sheetbody{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 0 18px}
.sgroup{padding:14px 16px 4px; font:10px/1 var(--mono); letter-spacing:.16em;
        text-transform:uppercase; color:var(--muted)}
.srow{
  display:flex; align-items:center; gap:10px; padding:11px 16px;
  border-bottom:1px solid var(--hair-a);
}
.srow .k{flex:none; width:34%; font:12px/1.25 var(--mono); color:var(--ink-2)}
/* The number is the thing you glance at from three feet away with salt on
   the screen, so it gets the largest type in the app. */
.srow .v{flex:1; font:600 19px/1.15 var(--display); color:var(--ink);
         font-variant-numeric:tabular-nums}
.srow .v small{font:11px/1 var(--mono); color:var(--muted); font-weight:400}
/* A value the slider cannot move, shown while the slider is away from now. */
/* The marine forecast is a paragraph, not a number, so it does not get the
   big tabular treatment the readings do. */
.srow.mfrow{align-items:flex-start}
.srow .v.mftext{
  font:12px/1.55 var(--mono); font-weight:400; color:var(--ink-2);
  letter-spacing:0;
}
.srow .v small.nowonly{
  color:var(--warn); border:1px solid var(--hair); border-radius:999px;
  padding:2px 6px; margin-left:4px; letter-spacing:.06em;
}
/* The footprint chip. Present on every value on purpose: these numbers
   describe patches of ocean that differ by four orders of magnitude, and
   without this the layout quietly claims they are equally precise. */
.res{
  flex:none; font:10px/1 var(--mono); color:var(--muted);
  border:1px solid var(--hair); border-radius:999px; padding:4px 7px;
}
.res.fine{color:var(--good); border-color:rgba(79,191,137,.45)}
.res.coarse{color:var(--warn); border-color:rgba(217,165,33,.4)}
.srule{padding:11px 16px; font:12px/1.5 var(--mono); color:var(--ink-2);
       border-bottom:1px solid var(--hair-a)}
.srule b{color:var(--crit); font-weight:600}
.sdim{padding:12px 16px; font:11px/1.5 var(--mono); color:var(--muted)}
#here{
  position:fixed; right:14px; z-index:35;
  bottom:calc(20px + env(safe-area-inset-bottom));
  width:60px; height:60px; border-radius:50%;
  background:var(--accent); color:#fff; border:none;
  font:600 10px/1.1 var(--mono); letter-spacing:.06em;
  box-shadow:0 6px 18px rgba(0,0,0,.45); cursor:pointer;
}
/* The reading half of the app. Not on the map, because none of it is
   something you do with a rod in your hand and the map was decluttered on
   purpose -- but reachable, because CLI-only meant never looked at. */
#themebtn{
  font:600 11px/1 var(--display); padding:7px 10px; border-radius:7px;
  border:1px solid var(--hair); background:var(--panel); color:var(--ink-2);
  cursor:pointer;
}
#themebtn:active{transform:scale(.96)}
#desklink{
  display:inline-block; text-decoration:none;
  padding:6px 10px; border-radius:7px; border:1px solid var(--hair);
  background:var(--panel); color:var(--ink-2);
  font:600 11px/1 var(--display);
}
#desklink:active{transform:scale(.96)}
#here:active{transform:scale(.94)}
#here.busy{opacity:.55}
/* The desktop side of the same rule: a wide window AND a real pointer. */
@media (min-width:901px) and (pointer:fine){
  #sheet{left:auto; right:0; width:420px;
         max-height:calc(92vh / var(--ui, 1)); border-radius:16px 0 0 0}
  #here{display:none}
}

/* ---- log a trip from the sheet ---------------------------------------
   The tap that opens the sheet is the same tap that means "here". Making
   you close it, find the spot in a list and log there would lose the one
   thing you actually knew: the coordinate. */
#slog{border-top:1px solid var(--hair); margin-top:6px; padding:14px 16px 22px}
#slog .sgroup{padding:0 0 10px}
#slogtoggle{
  width:100%; min-height:52px; border-radius:12px; border:1px solid var(--hair);
  background:var(--panel-2); color:var(--ink);
  font:600 15px/1 var(--display); cursor:pointer;
}
#slogtoggle:active{transform:scale(.99)}
#slogform{display:none; margin-top:12px}
#slogform.open{display:block}
#slogform .two{display:grid; grid-template-columns:1fr 1fr; gap:8px}
#slogform input, #slogform select{
  width:100%; margin-top:8px; padding:13px 12px; border-radius:10px;
  border:1px solid var(--hair); background:var(--ground); color:var(--ink);
  font:15px/1.2 var(--mono);
  /* 16px is the iOS zoom threshold; below it Safari zooms the whole page on
     focus and you lose the map behind the sheet. */
  font-size:16px;
}
#slogform .two input{margin-top:0}
#slogsave{
  width:100%; min-height:54px; margin-top:12px; border:none; border-radius:12px;
  background:var(--accent); color:#fff; font:600 16px/1 var(--display);
  cursor:pointer;
}
#slogsave:active{transform:scale(.99)}
#slogmsg{margin-top:10px; font:12px/1.4 var(--mono); color:var(--muted)}
#slogmsg.ok{color:var(--good)} #slogmsg.err{color:var(--crit)}
#slognote{margin-top:10px; font:11px/1.5 var(--mono); color:var(--muted)}

/* Placed last on purpose. These rules override base styles of equal
   specificity -- .srow .v against .srow .v -- so the cascade decides by source
   order, and this block used to sit ABOVE the sheet's own styles. Every sheet
   override in it was silently losing, which is why the text stayed small after
   a round of "fixing" it. Anything added below this will win over it. */
/* Width alone was the wrong test. This shipped keyed on max-width:900px and
   the sidebar stayed put on an actual phone, because a device can report far
   more than 900 CSS pixels and still be a thing you hold in one hand -- a
   foldable, a tablet, or a browser set to "desktop site". What decides the
   layout is whether you are pointing with a finger. */
@media (max-width:900px), (pointer:coarse){
  /* One surface, not two. The panel used to sit in a 300px strip under the
     map while the conditions sheet slid over the top of it -- two scrolling
     regions competing for a phone screen, with the map squeezed into what was
     left. Now the map has the whole screen and the sheet is the only reading
     surface, split into four views by the tab bar. The panel stays hidden
     here; its parts each have a tab. */
  #app{grid-template-columns:1fr; grid-template-rows:1fr}
  #panel{display:none}
  #sheet{max-height:calc(92vh / var(--ui, 1))}
  #sheet.peek{transform:translateY(calc(100% - 210px))}
  /* Everything a thumb has to hit, sized for a thumb. */
  .srow{padding:14px 16px}
  .srow .k{font-size:14px; width:36%}
  .srow .v{font-size:22px}
  .srow .v small{font-size:13px}
  .sgroup{font-size:12px; letter-spacing:.18em; padding:16px 16px 6px}
  .srule{font-size:14px; line-height:1.6}
  .sdim{font-size:13px; line-height:1.65}
  #sheethead b{font-size:20px}
  /* Type, sized for reading at arm's length in sunlight with salt on the
     screen. The first attempt at this guessed selectors that do not exist
     (.box, .row) and changed nothing; these are the real ones, taken from the
     stylesheet above. Everything roughly +3px, and nothing left under 12. */
  #adopted{padding:0 2px 8px}
  #adopted .ph{font-size:12px; letter-spacing:.16em; padding-top:4px}
  #adopted .card{padding:14px}
  #adopted .card h3{font-size:19px}
  #adopted .card .sub{font-size:12px}
  #adopted .big{font-size:42px}
  #adopted .kv{font-size:14px; gap:6px 14px}
  #adopted .why{font-size:14px; line-height:1.55}
  #adopted .regs, #adopted #regs, #adopted #regsbox{font-size:14px; line-height:1.6}
  /* The ranked list is the thing you actually read on the water. */
  #adopted .rank button{min-height:58px; padding:10px 12px; font-size:16px}
  #adopted .rank .s{font-size:19px}
  #adopted .rank .m{font-size:13px}
  #adopted .empty{font-size:15px; line-height:1.6}
  #adopted .note{font-size:13px; line-height:1.55}
  #adopted .conf{font-size:12px; padding:3px 7px}
  #adopted .markwarn{font-size:13px; line-height:1.55}
  #adopted .markwin{font-size:14px; min-height:44px; align-items:center}
  #adopted #layers h4{font-size:12px}
  #adopted #layers label{font-size:15px; min-height:44px; gap:10px}
  #adopted #layers .cnt{font-size:12px}
  #adopted .ok, #adopted .err{font-size:13px}
  /* 16px or Safari zooms the page on focus and takes the map with it. */
  #adopted input, #adopted select, #adopted button{font-size:16px}
  #adopted input, #adopted select{min-height:46px; padding:10px 12px}
  /* The top bar is a control strip, not text: it needs tap targets. */
  #bar{font-size:15px}
  #bar select{font-size:16px; min-height:40px}
  label.chk{font-size:14px; gap:8px}
  #tlabel{font-size:15px} #tsub{font-size:13px}
  /* The scrubber is absolutely positioned inside the map wrapper, not the
     app grid, so it needs no offset for the panel here -- the panel is a
     sibling below the map, already out of the way. Offsetting by the panel
     height pushed it 314px up from the map's own bottom edge and parked it
     in the middle of the chart. */
  /* 44px, not 14px: the attribution sits in the bottom-right corner of the
     map and occupies the last ~34px. Covering it would breach the ODbL terms
     the basemap ships under. */
  #timebar{right:12px; bottom:44px}
}

/* ---- what am I actually running -------------------------------------
   A line you can read on the boat instead of opening devtools, which is
   not a thing you can do on a phone. It answers the two questions that
   have cost the most time here: is this the build I just deployed, and is
   the touch layout actually on. */
#diag{
  padding:12px 16px 20px; font:11px/1.7 var(--mono); color:var(--muted);
  border-top:1px solid var(--hair);
}
#diag b{color:var(--ink-2); font-weight:600}
#diag .warn{color:var(--warn)}

/* One scale for the whole chrome, not thirty-seven font sizes.
   Scaling type alone grew the text 2.4x and left padding, gaps and radii where
   they were, so everything came apart at the seams. `zoom` scales layout --
   text, spacing, borders, tap targets -- in proportion, which is what "make it
   bigger" actually means. The map is deliberately NOT zoomed: it works in its
   own pixel space and scaling it would break hit-testing and the label clamp.

   1 on an honest viewport, so this is inert on a normal phone. */
/* Scoped to the touch layout, and it has to be. --ui is only ever anything
   but 1 on the coarse-pointer path, so on desktop every rule below is a
   no-op arithmetically -- but `#sheet{right:auto; width:100vw}` is NOT a
   no-op as CSS. It sits after the desktop rule that makes the sheet a 420px
   right rail, carries equal specificity, and wins on source order. The sheet
   went full-width across the bottom of the desktop window, squeezed the map
   into a strip, and left every spot label sitting on top of the panel. */
@media (max-width:900px), (pointer:coarse){
#sheet, #bar, #here, #timebar{ zoom: var(--ui, 1); }
/* A zoomed fixed element still resolves left/right against the UNZOOMED
   viewport, then multiplies the result -- so `left:0;right:0` came out 2.4x
   wider than the screen. Width has to be stated in the zoomed coordinate
   space, which is viewport / scale.

   The same is true of every vh, and missing that cost more than the width
   did: `max-height:92vh` computed to 1826px, `zoom:2.379` multiplied it to
   2256 visual px in a 1985px viewport, and since the sheet is anchored
   bottom:0 the overflow went off the TOP -- taking the drag handle 269px
   above the screen with it. The panel could not be pulled down because the
   thing you pull was not on the glass. Every vh on a zoomed element is now
   divided, and a test refuses a bare one. */
#sheet{ right:auto; width:calc(100vw / var(--ui, 1)); }
/* Offsets are multiplied by the zoom as well as sizes, so a 12px inset would
   land at 29px. Divide anything that has to stay put on the glass. */
#bar{ left:calc(12px / var(--ui, 1)); top:calc(12px / var(--ui, 1));
      width:calc((100vw - 24px) / var(--ui, 1));
      /* One scrolling row, not a wrapping block. Wrapped, the bar grew to
         three rows and the sheet at 92vh left about 60px above it, so the
         species picker was sliced in half by the sheet's top edge -- the app
         looked broken before you touched it. Scrolling sideways keeps every
         control reachable in the height there actually is. */
      flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden;
      scrollbar-width:none; -webkit-overflow-scrolling:touch; }
#bar::-webkit-scrollbar{display:none}
#bar > *{flex:none}
#layers{position:fixed; left:12px; right:12px; width:auto; max-width:none}
#here{ right:calc(14px / var(--ui, 1));
       bottom:calc((20px + env(safe-area-inset-bottom)) / var(--ui, 1)); }
#timebar{ right:calc(12px / var(--ui, 1)); bottom:calc(44px / var(--ui, 1));
          left:calc(12px / var(--ui, 1)); width:auto; }
}

/* ---- speak the trip -------------------------------------------------
   The reason the catch log has two rows is that logging one means typing on
   a phone with a rod in the other hand. This is the button that fixes that,
   so it is the largest control in the sheet. */
#slogmic{
  width:100%; min-height:60px; margin-top:10px;
  border:1px solid var(--hair); border-radius:12px;
  background:var(--panel-2); color:var(--ink);
  font:600 16px/1.2 var(--display); cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:10px;
}
#slogmic:active{transform:scale(.99)}
/* Same shape as the mic, because it does the same job by another route: it
   fills the form and never saves. The endpoint has existed since photolog
   landed and nothing in the UI ever called it, so a fish photo could only be
   read by running the CLI at the dock. */
#slogcam{
  display:block; text-align:center; cursor:pointer;
  padding:13px 14px; margin-top:8px; border-radius:10px;
  border:1px solid var(--hair); background:var(--panel-2, rgba(255,255,255,.04));
  color:var(--ink); font:600 14px/1 var(--display);
}
#slogcam:active{transform:scale(.99)}
#slogcam.busy{opacity:.55}
/* The scorecard. Deliberately plain and deliberately first: it is the only
   thing in the app allowed to say the rest of it does not work yet. */
.ev{padding:14px 16px; border-bottom:1px solid var(--hair)}
.ev .evhead{font:600 15px/1.2 var(--display); color:var(--ink)}
.ev .evbar{height:6px; border-radius:3px; background:var(--hair); margin:8px 0 10px}
.ev .evbar i{display:block; height:100%; border-radius:3px; background:var(--accent)}
.ev.notyet .evbar i{background:var(--muted)}
.ev .evverdict{font:12px/1.5 var(--mono); color:var(--muted)}
.ev .evrow{display:flex; gap:10px; padding:6px 0 0; font:12px/1.3 var(--mono)}
.ev .evrow span{color:var(--ink-2)}
.ev .evrow b{margin-left:auto; font-variant-numeric:tabular-nums; color:var(--ink)}
.ev .evrow.dim span, .ev .evrow.dim b{color:var(--muted)}
#slogmic.live{
  background:var(--accent); color:#fff; border-color:transparent;
  animation:pulse 1.4s ease-in-out infinite;
}
#slogmic.thinking{opacity:.6}
#slogmic[disabled]{opacity:.4; cursor:default}
@keyframes pulse{50%{opacity:.72}}
@media (prefers-reduced-motion:reduce){#slogmic.live{animation:none}}
/* What it heard, kept visible so a bad parse is obvious rather than silent. */
#slogheard{
  margin-top:10px; padding:11px 13px; border-radius:9px;
  background:var(--ground); border:1px solid var(--hair);
  font:13px/1.55 var(--mono); color:var(--ink-2); display:none;
}
#slogheard.show{display:block}
#slogheard b{color:var(--ink); font-weight:600}
#slogheard .conf{color:var(--warn)}

/* ---- trip recording -------------------------------------------------
   Nobody forgets to log four keepers; everybody forgets to log the blank,
   and blanks are half the signal. So this is one tap at the ramp and then
   it is passive. It sits beside HERE rather than in the sheet, because it
   has to be reachable without opening anything. */
#trip{
  position:fixed; right:calc(14px / var(--ui, 1)); z-index:35;
  bottom:calc((92px + env(safe-area-inset-bottom)) / var(--ui, 1));
  width:60px; height:60px; border-radius:50%;
  background:var(--panel-2); color:var(--ink-2);
  border:1px solid var(--hair);
  font:600 10px/1.15 var(--mono); letter-spacing:.04em;
  box-shadow:0 6px 18px rgba(0,0,0,.45); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
#trip:active{transform:scale(.94)}
#trip.rec{
  background:var(--crit); color:#fff; border-color:transparent;
  animation:trippulse 2s ease-in-out infinite;
}
@keyframes trippulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){#trip.rec{animation:none}}
#trip b{font-size:14px; font-weight:700; display:block}
@media (min-width:901px) and (pointer:fine){ #trip{display:none} }

/* ---- trips ------------------------------------------------------------
   A trip is a line and a list of fish, so the row shows both: the numbers
   you scan for, and a tap to put the drift itself on the map. */
#tripsbtn{
  width:100%; min-height:52px; margin-top:10px; border-radius:12px;
  border:1px solid var(--hair); background:var(--panel-2); color:var(--ink);
  font:600 15px/1 var(--display); cursor:pointer;
}
#tripsbtn:active{transform:scale(.99)}
.trip{
  display:grid; grid-template-columns:1fr auto; gap:4px 12px;
  padding:14px 16px; border-bottom:1px solid var(--hair-a);
  cursor:pointer; align-items:baseline;
}
.trip:active{background:var(--panel-2)}
.trip.on{background:var(--panel-2); box-shadow:inset 3px 0 0 var(--accent)}
.trip .when{font:600 15px/1.2 var(--display); color:var(--ink)}
.trip .fish{
  font:600 17px/1 var(--display); color:var(--accent);
  font-variant-numeric:tabular-nums; text-align:right;
}
.trip .fish.blank{color:var(--muted); font-size:13px; font-weight:400}
.trip .meta{
  grid-column:1 / -1; font:12px/1.5 var(--mono); color:var(--muted);
}
.trip .sp{color:var(--depth)}

/* The log's own species picker. Separate from the one in the top bar, which
   chooses what to FORECAST -- and the forecast only knows six fish. Sharing
   one control meant you could not log a bonito without pretending you had
   been fishing for something else. */
#slogsp{
  width:100%; margin-top:8px; padding:13px 12px; border-radius:10px;
  border:1px solid var(--hair); background:var(--ground); color:var(--ink);
  font:16px/1.2 var(--mono);
}
#slogwarn{
  margin-top:8px; padding:10px 12px; border-radius:9px;
  background:rgba(217,165,33,.10); border:1px solid rgba(217,165,33,.35);
  font:12px/1.55 var(--mono); color:var(--warn); display:none;
}
#slogwarn.show{display:block}

/* ---- one sheet, four views -------------------------------------------
   This sheet had grown to 2,590px of content in an 812px screen: conditions,
   the rules, the ranked list, the log form, past trips and a diagnostics
   block, concatenated in the order they were built. Three and a bit screens
   of scrolling with no way to reach anything -- which on a boat means you
   scroll past what you need while the drift goes by.
   One view at a time, and the tabs are the biggest control in the app. */
#tabs{
  flex:none; display:grid; grid-template-columns:repeat(4,1fr);
  gap:0; border-bottom:1px solid var(--hair); background:var(--panel);
}
#tabs button{
  min-height:52px; border:0; background:none; cursor:pointer;
  color:var(--muted); font:600 13px/1 var(--display);
  letter-spacing:.02em; border-bottom:2px solid transparent;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; padding:0;
}
#tabs button .n{
  font:10px/1 var(--mono); color:var(--muted); font-variant-numeric:tabular-nums;
}
#tabs button.on{color:var(--ink); border-bottom-color:var(--accent)}
#tabs button.on .n{color:var(--accent)}
#tabs button:active{background:var(--panel-2)}
/* Rules are law, not a readout, so they collapse behind a line you can open
   rather than taking 135px out of the middle of the conditions. */
.fold{border-top:1px solid var(--hair-a)}
.fold > summary{
  list-style:none; cursor:pointer; padding:14px 16px;
  font:12px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); display:flex; justify-content:space-between; min-height:48px;
  align-items:center;
}
.fold > summary::-webkit-details-marker{display:none}
.fold > summary::after{content:"+"; font-size:16px; color:var(--muted)}
.fold[open] > summary::after{content:"–"}
.fold[open] > summary{color:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <div style="position:relative">
    <div id="map"></div>
    <div id="bar">
      <div class="brand">tide<span>race</span></div>
      <select id="species"></select>
      <label class="chk"><input type="checkbox" id="marks" checked> seamarks</label>
      <label class="chk"><input type="checkbox" id="labels" checked> labels</label>
      <span id="mode" title="Which rules apply"></span>
      <button id="layersbtn" title="Chart overlays">charts ▾</button>
      <button id="scanbtn" title="Look for bumps in the water you are looking at">scan ⛰</button>
      <button id="themebtn" title="Daylight or night palette">sun ☀</button>
      <a id="desklink" href="/desk" title="Log history, reports, review queue, HMS rules">desk →</a>
      <button id="offlinebtn" title="Download the forecast for the water">save ↓</button>
      <span id="netstate"></span>
      <div id="layers"></div>
    </div>
    <div id="timebar">
      <div class="row"><span id="tlabel">—</span><span id="tsub"></span></div>
      <input type="range" id="time" min="0" max="0" value="0" step="1">
      <div id="ticks"></div>
    </div>
    <div id="loading">loading noaa data…</div>
  </div>
  <aside id="panel">
    <div id="regsbox"></div>
    <div>
      <p class="ph">Ranked now</p>
      <div class="rank" id="rank"></div>
    </div>
    <div id="markbox"></div>
    <div id="detail"></div>
    <div id="logbox"></div>
    <p class="note" style="margin-top:auto;padding-top:12px;border-top:1px solid var(--hair)">
      Charts © NOAA ENC (public domain) · basemap © OpenStreetMap · seamarks © OpenSeaMap<br>
      tiderace is <a href="https://www.gnu.org/licenses/agpl-3.0.html"
        style="color:var(--depth)">AGPL-3.0</a> —
      <a id="src" href="#" style="color:var(--depth)">get the source</a>
    </p>
  </aside>
</div>

<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<!-- pmtiles reads the single-file basemap archive; basemaps builds the layer
     list for a Protomaps flavor. Both are cached by the service worker, or the
     map cannot draw offline even with the tile data on disk. -->
<script src="https://unpkg.com/pmtiles@4.3.0/dist/pmtiles.js"></script>
<script src="https://unpkg.com/@protomaps/basemaps@5.2.0/dist/basemaps.js"></script>
<script>
const $ = s => document.querySelector(s);

/* ---- the viewport can lie ---------------------------------------------
 * Chrome's "Desktop site" toggle overrides <meta name=viewport> and reports
 * 980 CSS pixels on a phone whose screen is about 412. Everything is then
 * scaled down by 2.4x on the way to the glass, so 22px type arrives at nine
 * and the app is unreadable while every measurement inside it says the sizes
 * are correct. That is exactly what the diagnostics line showed.
 *
 * The page cannot turn that setting off. It can notice and compensate: --ui
 * multiplies every font size and tap target in the touch stylesheet, so the
 * app comes out the same physical size either way.
 *
 * screen.width is in the same CSS pixels as innerWidth, so their ratio is the
 * shrink factor being applied. On a normal phone it is ~1 and nothing changes.
 */
function uiScale(){
  if (!matchMedia('(pointer:coarse)').matches) return 1;
  const real = Math.min(screen.width || 0, screen.height || 0) || innerWidth;
  if (!innerWidth || !real) return 1;
  // Clamped: 1 means "the viewport is honest", 2.6 stops a strange reading
  // from blowing the layout apart.
  return Math.min(2.6, Math.max(1, innerWidth / real));
}

function applyUiScale(){
  const k = uiScale();
  document.documentElement.style.setProperty('--ui', k.toFixed(3));
  return k;
}
applyUiScale();
addEventListener('resize', applyUiScale);

let GRID = null, TI = 0, SEL = null, MARKERS = {};
let MARK = null, MARK_PIN = null;

// Score -> colour. Deliberately not a rainbow: a single hue ramping from the
// water tone to the accent, so rank reads as intensity rather than category.
function colour(s){
  if (s == null) return '#5D7075';
  const t = Math.max(0, Math.min(1, s / 100));
  const stops = [[0.00,[45,70,78]],[0.45,[79,179,199]],[0.75,[214,120,170]],[1.00,[240,79,160]]];
  let a = stops[0], b = stops[stops.length-1];
  for (let i=0;i<stops.length-1;i++){ if (t>=stops[i][0] && t<=stops[i+1][0]){ a=stops[i]; b=stops[i+1]; break; } }
  const f = (t-a[0])/((b[0]-a[0])||1);
  const c = a[1].map((v,i)=>Math.round(v+(b[1][i]-v)*f));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

/* The server substitutes this at request time. The style must exist when the
   Map is constructed, and every layer this app adds hangs off map.on('load')
   -- swapping the style afterwards would race all of them. */
/* Theme first, because basemapStyle() reads it and the Map is constructed
   with the result. Stored per device: which one you want depends on where you
   are standing, not on a preference you set once. Falls back to the system
   setting, and to dark, which is right at 4am at the ramp. */
function THEME(){
  try {
    const saved = localStorage.getItem('tiderace-theme');
    if (saved === 'light' || saved === 'dark') return saved;
  } catch (_) {}
  return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
}
document.documentElement.dataset.theme = THEME();

const BASEMAP = __TIDERACE_BASEMAP__;

if (window.pmtiles) {
  maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);
}

const PM_ATTR = '\u00a9 <a href="https://protomaps.com">Protomaps</a> ' +
                '\u00a9 <a href="https://openstreetmap.org">OpenStreetMap</a>';
const SEAMARK = {type:'raster',
  tiles:['https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png'],
  tileSize:256, maxzoom:18,
  attribution:'\u00a9 <a href="https://www.openseamap.org/">OpenSeaMap</a>'};

/* Three cases, in order of how well they work on the water:
     local pmtiles  one file on your own machine, draws with no internet at all
     hosted API     needs signal, but no build step
     OSM raster     the old path, kept so a fresh clone still shows a map
   The basemap is vector now, so the dark look comes from a flavor rather than
   from raster filters beaten into an unwilling image. */
/* MapLibre paint and layout values are not CSS -- `var(--halo)` in a
   text-halo-color is not a colour, it is a string MapLibre cannot parse, and
   the layer stops drawing. Tokenising the stylesheet with a global replace put
   five of them into map layers and took the contour numbers off the chart.
   Resolve the token to its computed value instead, at the moment the layer is
   built; applyTheme rebuilds every layer, so they pick up the new palette. */
function themeColour(name, fallback){
  try {
    const v = getComputedStyle(document.documentElement)
      .getPropertyValue(name).trim();
    if (v) return v;
  } catch (_) {}
  return fallback;
}

function basemapStyle() {
  if (BASEMAP.local || BASEMAP.hosted_key) {
    const src = BASEMAP.local
      ? {type:'vector', url:'pmtiles://' + location.origin + BASEMAP.url,
         attribution: PM_ATTR}
      : {type:'vector', maxzoom:15, attribution: PM_ATTR,
         tiles:['https://api.protomaps.com/tiles/v4/{z}/{x}/{y}.mvt?key='
                + BASEMAP.hosted_key]};
    return {
      version: 8,
      glyphs: 'https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf',
      sprite: 'https://protomaps.github.io/basemaps-assets/sprites/v4/'
              + (THEME() === 'light' ? 'light' : 'dark'),
      sources: {protomaps: src, seamark: SEAMARK},
      layers: [
        ...basemaps.layers('protomaps',
              basemaps.namedFlavor(THEME() === 'light' ? 'light' : 'dark'),
              {lang:'en'}),
        {id:'seamark', type:'raster', source:'seamark', paint:{'raster-opacity':0.95}}
      ]
    };
  }
  return {
    version:8,
    sources:{
      osm:{type:'raster', tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
           tileSize:256, maxzoom:19,
           attribution:'\u00a9 <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'},
      seamark: SEAMARK
    },
    layers:[
      {id:'osm', type:'raster', source:'osm',
       paint:{'raster-saturation':-0.55,'raster-brightness-min':0.05,
              'raster-brightness-max':0.72,'raster-contrast':0.12}},
      {id:'seamark', type:'raster', source:'seamark', paint:{'raster-opacity':0.95}}
    ]
  };
}

const map = new maplibregl.Map({
  container:'map',
  style: basemapStyle(),
  center:[-71.35, 41.53], zoom:10.2, minZoom:8, maxZoom:16, attributionControl:true
});
map.addControl(new maplibregl.NavigationControl({showCompass:false}), 'top-right');
// Scale moves up top; attribution stays in its usual bottom-right corner and
// the scrubber is lifted to clear it. OpenStreetMap and OpenSeaMap are both
// ODbL, so that credit staying visible is a licence condition rather than a
// nicety -- which makes leaving MapLibre's own control alone the safer choice.
map.addControl(new maplibregl.ScaleControl({unit:'nautical'}), 'top-right');

$('#marks').onchange = e => {
  if (!MAP_READY) return;
  map.setLayoutProperty('seamark', 'visibility', e.target.checked ? 'visible' : 'none');
};
$('#labels').onchange = e => {
  // display carries the user's on/off; visibility carries the chrome test.
  // Two properties so neither decision clobbers the other.
  Object.values(MARKERS).forEach(
    m => m.el.querySelector('.lbl').style.display = e.target.checked ? '' : 'none');
  clampLabels();
};

// ------------------------------------------------------------------ markers
let MAP_READY = false;
map.on('load', () => {
  MAP_READY = true;
  const tb = document.getElementById('themebtn');
  if (tb) tb.textContent =
    document.documentElement.dataset.theme === 'light' ? 'sun ☀' : 'dark ☾';
  syncMarkers(); loadCharts(); loadBait(); loadStructure();
  loadCellsForView();
  clampLabels();
});
map.on('move', clampLabels);
map.on('moveend', clampLabels);
addEventListener('resize', clampLabels);

/* The sheet's own height is what decides which labels it covers, and that
   changes without the map moving at all: the body is filled after an async
   fetch, a fold opens, a tab renders a longer view. Clamping only on map
   events and sheet STATE changes meant labels sat on top of the panel until
   you nudged the map, which is exactly what it looked like -- a rendering
   bug that fixed itself when touched.

   An observer rather than another call site, because the list of things that
   resize the sheet keeps growing and every new render path would have to
   remember. */
/* A webfont changes every label's width when it lands, and no map event
   fires for that -- so a layout clamped against fallback metrics can come
   apart the moment IBM Plex Mono arrives. One run showed a name back under
   the time bar for exactly this reason. */
if (document.fonts && document.fonts.ready)
  document.fonts.ready.then(() => clampLabels()).catch(() => {});

if (typeof ResizeObserver === 'function'){
  const sheetEl = document.getElementById('sheet');
  if (sheetEl) new ResizeObserver(() => clampLabels()).observe(sheetEl);
}
map.on('error', e => console.warn('map:', e && e.error && e.error.message));

// The map is a view onto the data, not a prerequisite for it. If WebGL is
// unavailable or the tile host is blocked, the ranked list, the spot detail
// and the log form must all still work -- so nothing below is gated on the
// map finishing.
function syncMarkers(){
  if (!MAP_READY || !GRID) return;
  Object.values(MARKERS).forEach(m => m.remove());
  MARKERS = {};
  GRID.spots.forEach(s => MARKERS[s.key] = makeMarker(s));
  paint();
  // Fresh markers start with their labels shown; re-apply the chrome test.
  clampLabels();
}

function makeMarker(sp){
  /* A zero-size root, so the DOT lands on the coordinate.
     It used to be a flex row of [dot, label] with anchor:'center', which
     centres the WHOLE ROW on the point -- so the dot sat left of the spot by
     half the width of its own name and the label straddled the position. A
     long name pushed its dot further off than a short one. The root is 0x0
     now; MapLibre centres nothing on the point, and the children hang off
     that origin, so the dot is the thing at the coordinate and the name sits
     beside it.

     Nothing here writes to the root's transform either. MapLibre owns it, and
     paint() setting it was wiping the position of all 21 markers on every
     time-slider tick until the next map move put them back. */
  const el = document.createElement('div');
  el.style.cssText = 'position:relative;width:0;height:0;cursor:pointer';
  el.innerHTML =
    `<div class="dot" style="position:absolute;left:0;top:0;width:18px;height:18px;
        margin:-9px 0 0 -9px;border-radius:50%;border:2px solid var(--mk-edge);
        box-shadow:0 0 0 1px rgba(228,236,238,.35)"></div>
     <div class="lbl" style="position:absolute;left:15px;top:0;transform:translateY(-50%);
        font-family:var(--mono);font-size:10px;font-weight:600;
        color:var(--mk-ink);
        text-shadow:0 1px 3px var(--mk-halo),0 0 6px var(--mk-halo),0 0 2px var(--mk-halo);
        white-space:nowrap;pointer-events:none">${sp.name}</div>`;
  // Markers live inside the map's canvas container, so a tap on one also
  // reaches the map's own click handler -- selecting the spot AND dropping a
  // mark pin on top of it, with a report request behind it.
  el.dataset.key = sp.key;
  el.onclick = ev => { ev.stopPropagation(); select(sp.key); };
  const m = new maplibregl.Marker({element:el, anchor:'center'})
      .setLngLat([sp.lon, sp.lat]).addTo(map);
  m.el = el;
  return m;
}

/* Spot labels are DOM, drawn wherever the marker lands -- including under the
   control bar at the top and behind the conditions sheet at the bottom, where
   they pile into each other and read as garbage. Rather than fight the
   stacking order, hide the label when its marker is inside a strip the UI
   occupies. The dot stays: knowing a spot is up there is useful, and it is the
   text that collides.

   Runs on move and on resize because the sheet's height changes when it is
   dragged between peek and full. */
/* Pure so it can be tested with numbers instead of geometry: placing real
   markers needs a real map, and the decision is the part worth being sure of.
   Returns what to do with one marker given its box and the UI edges. */
function markerVisibility(box, barBottom, sheetTop, sheetLeft){
  // Behind the sheet, hide the WHOLE marker, not just its text. Keeping the
  // dot is right over the map -- knowing a spot is up there is useful -- and
  // wrong over an opaque panel, where it is a circle floating on the readout.
  // Both edges are tested because the sheet is a bottom sheet on a phone and a
  // right-hand panel on a desktop.
  if (box.bottom > sheetTop + 4 && box.right > sheetLeft + 4)
    return {marker: 'hidden', label: 'hidden'};
  // Under the top bar only the text collides; the dot is still on open map.
  if (box.top < barBottom + 4)
    return {marker: '', label: 'hidden'};
  return {marker: '', label: ''};
}

function clampLabels(){
  // MARKERS is replaced, not mutated, when the grid reloads -- read the live
  // binding rather than a captured alias.
  if (!MAP_READY || !MARKERS) return;
  const bar = document.getElementById('bar');
  const sheet = document.getElementById('sheet');
  const showLabels = document.getElementById('labels');
  const wanted = !showLabels || showLabels.checked;

  const barBottom = bar ? bar.getBoundingClientRect().bottom : 0;
  const r = sheet ? sheet.getBoundingClientRect() : null;
  // Only counts when the sheet is actually up; translated off the bottom its
  // rect still reports a top, and using that would blank half the map.
  const up = r && sheet.classList.contains('up');
  const sheetTop = up ? r.top : Infinity;
  const sheetLeft = up ? r.left : Infinity;

  // The root is 0x0 now, so its rect is a point. The dot is the thing at the
  // coordinate and the one the chrome test is about.
  const kept = [];
  const entries = Object.values(MARKERS).filter(m => m.el);
  // Best spot wins the label. paint() already puts the score in zIndex, and
  // the selected spot outranks everything -- if you have picked a place, its
  // name is the one you need on screen.
  entries.sort((a, b) => {
    const sa = a.el.dataset.key === SEL ? 1e6 : (+a.el.style.zIndex || 0);
    const sb = b.el.dataset.key === SEL ? 1e6 : (+b.el.style.zIndex || 0);
    return sb - sa;
  });

  const tb = document.getElementById('timebar');
  const tbox = tb && tb.offsetParent !== null ? tb.getBoundingClientRect() : null;
  const hits = (a, b) => a.right > b.left && a.left < b.right
                      && a.bottom > b.top && a.top < b.bottom;

  for (const m of entries){
    const el = m.el;
    const dot = el.querySelector('.dot');
    const lbl = el.querySelector('.lbl');
    const dotBox = (dot || el).getBoundingClientRect();
    const v = markerVisibility(dotBox, barBottom, sheetTop, sheetLeft);
    el.style.visibility = v.marker;
    if (!lbl) continue;

    let show = wanted && v.marker !== 'hidden' && v.label !== 'hidden';
    if (show){
      // Measure the label where it will actually be, which means unhiding it
      // first -- a hidden element still has a box, but one left over from the
      // last layout.
      lbl.style.visibility = '';
      const lb = lbl.getBoundingClientRect();
      // The time bar sits over the map bottom-left and had no say here, so
      // names under it were drawn into it.
      if (tbox && hits(lb, tbox)) show = false;
      // And the real complaint: two names on top of each other. Charlestown
      // Breachway publishes an inside and an east-side mark a few hundred
      // metres apart, so at bay zoom their labels land in the same place.
      else if (kept.some(k => hits(lb, k))) show = false;
      else kept.push(lb);
    }
    lbl.style.visibility = show ? '' : 'hidden';
  }
}

function paint(){
  if (!GRID) return;
  const t = GRID.times[TI];
  const d = new Date(t);
  $('#tlabel').textContent = d.toLocaleString([], {weekday:'short', hour:'2-digit', minute:'2-digit'});
  const det = GRID.spots.find(s=>s.detail.length)?.detail[TI];
  $('#tsub').textContent = det
    ? `${det.light_phase} · moon ${det.moon_phase.toLowerCase()}` +
      (det.season_note ? ` · ${det.season_note}` : '')
    : '';

  GRID.spots.forEach(sp => {
    const s = sp.scores[TI];
    const m = MARKERS[sp.key];
    if (!m) return;   // map not ready yet -- panel still renders below
    const dot = m.el.querySelector('.dot');
    dot.style.background = colour(s);
    const size = s == null ? 12 : 12 + (s/100)*12;
    dot.style.width = dot.style.height = size + 'px';
    // The dot centres itself on the origin. This used to set the ROOT's
    // transform, which is MapLibre's -- every tick of the time slider threw
    // all 21 markers back to the top-left corner until the map next moved.
    dot.style.margin = `${-size/2}px 0 0 ${-size/2}px`;
    const lbl = m.el.querySelector('.lbl');
    if (lbl) lbl.style.left = (size/2 + 6) + 'px';
    m.el.style.zIndex = Math.round(s || 0);
  });
  renderRank(); renderDetail();
}

function renderRank(){
  const rows = GRID.spots
    .map(sp => ({sp, s: sp.scores[TI]}))
    .filter(r => r.s != null)
    .sort((a,b) => b.s - a.s).slice(0, 8);
  $('#rank').innerHTML = rows.map(r => {
    const d = r.sp.detail[TI] || {};
    return `<button data-k="${r.sp.key}" class="${SEL===r.sp.key?'on':''}">
      <span class="s" style="color:${colour(r.s)}">${r.s.toFixed(0)}</span>
      <span>${r.sp.name}<br><span class="m">${(d.current_speed??0).toFixed(2)} kt ${d.current_dir||''}</span></span>
      <span class="m">${d.wind_kt!=null?d.wind_kt.toFixed(0)+' kt':''}</span>
    </button>`;
  }).join('') || (GRID.modelled === false
    ? `<p class="empty">No forecast for ${tesc(GRID.species_name || 'this fish')}. ` +
      `The water below is real — current, tide, wind, light — but nothing here ` +
      `ranks spots for it, because no profile has been researched. Conditions ` +
      `and logging still work.</p>`
    : '<p class="empty">No spots scored at this time.</p>');
  $('#rank').querySelectorAll('button').forEach(b => b.onclick = () => select(b.dataset.k));
}

function sparkline(scores){
  const w = 320, h = 52, n = scores.length;
  const pts = scores.map((s,i) => [i/(n-1)*w, h - (s/100)*(h-6) - 3]);
  const d = pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const x = TI/(n-1)*w;
  return `<svg id="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <path d="${d} L ${w} ${h} L 0 ${h} Z" fill="rgba(240,79,160,.14)"/>
    <path d="${d}" fill="none" stroke="#F04FA0" stroke-width="1.6"/>
    <line x1="${x}" y1="0" x2="${x}" y2="${h}" stroke="#4FB3C7" stroke-width="1" stroke-dasharray="3 3"/>
  </svg>`;
}

function renderDetail(){
  if (!SEL){ $('#detail').innerHTML =
    `<p class="ph">Spot</p><p class="empty">Pick a spot on the map or in the list to see its
     conditions, its 48-hour curve, and to log a trip there.<br><br>
     Tap anywhere on the water for a report at that exact coordinate.</p>`; $('#logbox').innerHTML=''; return; }
  const sp = GRID.spots.find(s => s.key === SEL);
  if (!sp) return;
  const s = sp.scores[TI], d = sp.detail[TI] || {};
  $('#detail').innerHTML = `
    <p class="ph">Spot</p>
    <div class="card">
      <h3>${sp.name}</h3>
      <div class="sub">${sp.kind}${sp.best_stage?' · best on '+sp.best_stage:''}</div>
      <div class="big" style="color:${colour(s)};margin-top:10px">${s!=null?s.toFixed(1):'—'}</div>
      ${sp.scores.length ? sparkline(sp.scores) : ''}
      <dl class="kv">
        <dt>current</dt><dd>${(d.current_speed??0).toFixed(2)} kt ${d.current_dir||''}</dd>
        <dt>water</dt><dd>${d.water_temp_f!=null?d.water_temp_f.toFixed(1)+' °F':'—'}</dd>
        <dt>wind</dt><dd>${d.wind_kt!=null?d.wind_kt.toFixed(0)+' kt '+(d.wind_dir||''):'—'}</dd>
        <dt>light</dt><dd>${d.light_phase||'—'}</dd>
        <dt>moon</dt><dd>${d.moon_phase||'—'} ${d.moon_illum!=null?'('+Math.round(d.moon_illum*100)+'%)':''}</dd>
        <dt>tide</dt><dd>${d.next_tide||'—'}</dd>
        ${d.bait_note ? `<dt>bait</dt><dd style="color:#5FE3C0">${d.bait_note}</dd>` : ''}
        ${sp.bottom ? `<dt>bottom</dt><dd>${sp.bottom.bottom}${sp.bottom.quality?' ('+sp.bottom.quality+')':''}
           <span style="color:var(--muted)">· ${sp.bottom.distance_nm} nm</span></dd>` : ''}
      </dl>
      <div class="why">${d.why||''}</div>
    </div>
    <p class="note" style="margin-top:8px">${sp.notes}</p>`;
  renderLogForm(sp);
}

function renderLogForm(sp){
  const now = new Date(GRID.times[TI]);
  const local = new Date(now.getTime() - now.getTimezoneOffset()*60000).toISOString().slice(0,16);
  $('#logbox').innerHTML = `
    <p class="ph">Log a trip</p>
    <form id="logform">
      <div class="two">
        <input type="number" name="count" min="0" value="0" placeholder="fish" required>
        <input type="number" name="biggest_in" min="0" step="0.5" placeholder="biggest (in)">
      </div>
      <input type="datetime-local" name="started_at" value="${local}">
      <input type="text" name="method" placeholder="method — live eel, bucktail…">
      <input type="text" name="bait_observed" placeholder="bait seen — peanut bunker…">
      <input type="text" name="notes" placeholder="notes">
      <button class="primary" type="submit">Log at ${sp.name}</button>
      <p class="note">Blanks count. A model trained only on good days learns every day is good.</p>
      <div id="logmsg"></div>
    </form>`;
  $('#logform').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const body = {spot: sp.key, species: GRID.species,
                  client_id: (crypto.randomUUID?.() ||
                              String(Date.now()) + Math.random())};
    for (const [k,v] of f.entries()) if (v !== '') body[k] = v;
    const msg = $('#logmsg');
    msg.className=''; msg.textContent = 'saving…';

    // Write to the phone before trying the network. A trip you did not record
    // is gone; a trip that has not synced yet is fine.
    try { await queueAdd(body); }
    catch (err) { msg.className='err'; msg.textContent = 'could not save: ' + err.message; return; }
    e.target.reset();

    const res = await flushQueue();
    if (res.sent) {
      msg.className='ok';
      const s = res.summary;
      msg.textContent = s
        ? `saved · ${s.trips} trips, ${s.fish} fish, ${s.blanks} blanks`
        : 'saved';
    } else {
      msg.className='';
      const n = await pendingCount();
      msg.innerHTML = `<span style="color:var(--warn)">held on this phone` +
        ` · ${n} waiting to sync</span>`;
    }
    refreshNetState();
  };
}

function select(key){
  SEL = key; paint();
  if (!MAP_READY) return;
  const sp = GRID.spots.find(s => s.key === key);
  if (sp) map.easeTo({center:[sp.lon, sp.lat], zoom: Math.max(map.getZoom(), 11.5), duration:600});
}

// ----------------------------------------------------------- chart overlays
// Styling follows what matters for fishing rather than chart convention:
// rocks are coloured by tide exposure (a rock that covers and uncovers is the
// classic striper piece), wrecks by whether a depth is charted at all, and
// seabed by substrate — tautog want boulder, fluke want sand.
// Charted depth, as a bathymetric fill. This is the one chart layer that is
// ground rather than marks: it sits under everything, it is never clickable,
// and it is what makes a drop-off visible instead of merely knowable.
//
// A sequential ramp, so it is one hue with monotone lightness — the map's own
// --depth cyan, stepped from bright shallow to dark deep. Light-means-shallow
// is both the nautical convention and the useful one here: the shallow edges
// are where the fishing is, and deep water receding toward the background is
// exactly the right emphasis. Steps were solved rather than picked, then
// validated: monotone lightness, every adjacent gap >= 0.06 OKLCH L, single
// hue (4° spread), and both ends clearing 2:1 against the surface so neither
// "dries" nor "deep" collapses into the basemap. Checked twice, because this
// layer has two surfaces: the dark panel (#0B1518) and the desaturated OSM
// raster the fill actually borders (~#909EA2). It passes on both.
const DEPTH_RAMP = ['#D2EEF4','#A2DAE7','#73C5D7','#44B0C5',
                    '#2598AD','#277F8F','#2F6671','#354C52'];
const DEPTH_LABELS = ['dries','0–2 m','2–5 m','5–10 m',
                      '10–15 m','15–20 m','20–30 m','30 m+'];

const CHART_STYLE = {
  depth_area: {
    // Off by default now, and 2.8 MB, so it waits to be asked for -- otherwise
    // every boot pays for a layer nobody is looking at.
    kind: 'fill', lazy: true,
    // DRVAL2 is the deep limit of the band. Anything at or below zero dries.
    // Falling straight back to 0 painted the deepest area -- the one charted
    // with a shallow limit and no deep one -- in the "dries" colour, which
    // reads as the exact opposite of what it is. DRVAL1 is a lower bound on
    // the depth, so it is the honest second choice.
    colour: ['step', ['coalesce', ['get','depth_max_m'], ['get','depth_min_m'], 0],
      DEPTH_RAMP[0],
      0.5,  DEPTH_RAMP[1],
      2.5,  DEPTH_RAMP[2],
      5.5,  DEPTH_RAMP[3],
      10.5, DEPTH_RAMP[4],
      15.5, DEPTH_RAMP[5],
      20.5, DEPTH_RAMP[6],
      30.5, DEPTH_RAMP[7]],
    // Opaque on purpose: at partial alpha the colour on screen is a blend with
    // whatever basemap sits under it, and the ramp that was validated is not
    // the ramp anyone sees. Depth areas tile the water anyway, so there is
    // nothing underneath worth keeping.
    opacity: 1,
    swatch: `linear-gradient(90deg, ${DEPTH_RAMP[0]}, ${DEPTH_RAMP[3]}, ${DEPTH_RAMP[7]})`,
    minzoom: 0
  },
  // Contours are the shape of the bottom -- the edge fish sit on, which depth
  // shading can only imply. Drawn under the point layers so a rock on a drop-off
  // still reads as a rock.
  /* Modelled bottom, not charted soundings. Drawn dashed and dimmer than the
     ENC contours on purpose: the difference has to be visible at a glance,
     because one of these is a survey somebody signed for and the other is an
     interpolation between soundings that may be decades old. Mixing them into
     one indistinguishable set of blue lines is how a model ends up being read
     as a chart. */
  bathy: {
    kind: 'line', lazy: true, model: true,
    colour: 'rgba(140,163,168,.75)',
    width: ['interpolate', ['linear'], ['zoom'], 9, 0.5, 13, 1.0],
    dash: [2, 2],
    label: ['case', ['has','depth_ft'],
            ['concat', ['to-string', ['get','depth_ft']], "'"], ''],
    minzoom: 9,
    swatch: 'repeating-linear-gradient(90deg,#8CA3A8 0 3px,transparent 3px 6px)'
  },
  contours: {
    kind: 'line',
    colour: 'rgba(79,179,199,.55)',
    width: ['interpolate', ['linear'], ['zoom'], 11, 0.4, 14, 1.1],
    label: ['case', ['has','depth_ft'],
            ['concat', ['to-string', ['round', ['get','depth_ft']]], ''], ''],
    minzoom: 11,
    swatch: 'rgba(79,179,199,.55)'
  },
  // The numbers on a paper chart. 26k of them over this box, so they only
  // appear once you are close enough for them to mean something -- at bay-wide
  // zoom they would be a grey smear and would hide everything under them.
  soundings: {
    kind: 'symbol', lazy: true,
    label: ['case', ['has','depth_ft'],
            ['to-string', ['round', ['get','depth_ft']]], ''],
    colour: '#9FB6BB',
    minzoom: 13,
    swatch: '#9FB6BB'
  },
  buoys: {
    colour: '#F04FA0', radius: 3.2, minzoom: 11, swatch: '#F04FA0'
  },
  lights: {
    colour: '#D9A521', radius: 3.4, minzoom: 11, swatch: '#D9A521'
  },
  rocks: {
    colour: ['match', ['get','water_level'],
      'covers and uncovers', '#D9A521',
      'awash',               '#E0705F',
      'always under water',  '#4FB3C7',
      '#8CA3A8'],
    radius: [ 'interpolate', ['linear'], ['zoom'], 10, 1.6, 13, 3.2, 16, 5.5 ],
    swatch: '#D9A521', minzoom: 10
  },
  wrecks: {
    colour: ['case', ['has','depth_ft'], '#F04FA0', '#B5197A'],
    radius: [ 'interpolate', ['linear'], ['zoom'], 9, 3.5, 13, 6, 16, 9 ],
    swatch: '#F04FA0', minzoom: 8
  },
  obstructions: {
    colour: '#C58BD8',
    radius: [ 'interpolate', ['linear'], ['zoom'], 10, 2, 13, 3.6, 16, 6 ],
    swatch: '#C58BD8', minzoom: 10
  },
  turbulence: { colour:'#5FE3C0',
    radius:['interpolate',['linear'],['zoom'],8,5,14,11], swatch:'#5FE3C0', minzoom:8 },
  kelp: { colour:'#4FBF89',
    radius:['interpolate',['linear'],['zoom'],10,2.5,15,6], swatch:'#4FBF89', minzoom:10 },
  seabed: {
    // S-57 packs compound substrates into one string ("sand,rock",
    // "mud,shells,pebbles") -- 28 distinct combinations in this bay alone, so
    // exact matching drops nearly all of them to grey. Test for the hardest
    // substrate present instead, which is also the one that holds fish.
    colour: ['case',
      ['>=', ['index-of', 'boulder', ['coalesce',['get','bottom'],'']], 0], '#E0705F',
      ['>=', ['index-of', 'rock',    ['coalesce',['get','bottom'],'']], 0], '#E08A3C',
      ['>=', ['index-of', 'stone',   ['coalesce',['get','bottom'],'']], 0], '#E08A3C',
      ['>=', ['index-of', 'gravel',  ['coalesce',['get','bottom'],'']], 0], '#D9A521',
      ['>=', ['index-of', 'pebbles', ['coalesce',['get','bottom'],'']], 0], '#D9A521',
      ['>=', ['index-of', 'sand',    ['coalesce',['get','bottom'],'']], 0], '#E8DCA8',
      ['>=', ['index-of', 'shells',  ['coalesce',['get','bottom'],'']], 0], '#C2D3D7',
      ['>=', ['index-of', 'mud',     ['coalesce',['get','bottom'],'']], 0], '#8A7355',
      ['>=', ['index-of', 'silt',    ['coalesce',['get','bottom'],'']], 0], '#8A7355',
      '#5D7075'],
    radius: [ 'interpolate', ['linear'], ['zoom'], 11, 2, 14, 4, 16, 6 ],
    swatch: '#E08A3C', minzoom: 11
  }
};
// Contours are the default, not the shading. Depth areas paint a band -- "18
// to 30 feet somewhere in here" -- and tile every square metre of water, which
// hides the basemap and the very edges that matter. A contour IS the edge, and
// it carries its own number. Shading stays available for a quick read of where
// the deep water is, but off by default.
//
// Depth areas are also the one layer bounded to the original bay box; contours
// come from the on-demand grid and follow you to Montauk and the shelf, so
// making them the default is what makes the wider water look charted at all.
const CHART_ON = {depth_area:false, rocks:false, wrecks:true, obstructions:false,
                  turbulence:true, kelp:false, seabed:false,
                  // Soundings are the same information as contours at ten times
                  // the weight, so they stay on demand.
                  contours:true, soundings:false, buoys:true, lights:false,
                  // On by default now. It is the layer that actually answers
                  // "why is it blank out there": in mid Rhode Island Sound the
                  // ENC general band draws 16 contour lines and this draws 92.
                  // Parallel block fetching took a cell from ten seconds to
                  // about three, which is what makes it reasonable to have on.
                  //
                  // Defaulting a MODEL on is a real decision. It is safe here
                  // because it cannot be mistaken for a survey: dashed, dimmer,
                  // its own layer, labelled "not for navigation", and every
                  // feature flagged. The honesty lives in the rendering rather
                  // than in the layer being hidden.
                  bathy:true};
const CHART_DATA = {};

fetch('/api/meta').then(r=>r.json()).then(m => {
  if (m.source_url) $('#src').href = m.source_url;
}).catch(()=>{});

// Depth shading is ground, not a mark, so it belongs at the bottom of the
// overlay stack: directly above the basemap raster and beneath everything else.
// Seamarks, charted rocks and the spot markers all read over it, which is the
// order a paper chart uses and the only one in which the buoys stay legible.
//
// Anchored to the basemap rather than to a named overlay because the layers
// above it load asynchronously and in a different order each time -- depth is
// last in the manifest, so "insert before whatever happens to exist" is not a
// position, it is a race.
function ABOVE_BASEMAP(){
  const ids = ((map.getStyle() || {}).layers || []).map(l => l.id);
  // The raster basemap is one layer called 'osm'; the vector one is ~90 layers
  // whose names come from the Protomaps flavor, so there is nothing fixed to
  // look for. What IS fixed is that 'seamark' sits directly on top of whichever
  // basemap is in use -- both styles put it last -- so anchoring on it means
  // depth shading lands above the ground and below the sea marks either way.
  const i = ids.indexOf('seamark');
  if (i !== -1) return ids[i];
  const j = ids.indexOf('osm');
  // undefined when the basemap is the only layer, which appends -- and
  // appending is still directly above it.
  if (j !== -1) return ids[j + 1];
  return ids[0];
}

/* ---- scan for structure ------------------------------------------------
   The potential surface cannot answer "where is there a bump" -- its
   resolution is the current-station Voronoi, about 38 patches for the bay,
   and a hump is a hundred metres across. This reads the bottom instead, off
   the ~3 m NCEI model, and reports places that stand up out of the water
   around them.

   It refuses rather than guesses when the view is too wide: at bay zoom the
   samples are 800 m apart and every bump in Rhode Island falls between two of
   them, so an empty list would read as "flat bottom" when it means "blind".
   The server says `usable:false` and the reason gets shown. */
/* Called from two places and defined in none until now, so every message
   sent through it -- including "Too short to keep" when a track is discarded
   -- went nowhere. Both call sites guarded with `typeof toast === 'function'`,
   which is why it failed silently instead of loudly for so long. */
let TOAST_T = null;
function toast(msg){
  let el = document.getElementById('toast');
  if (!el){
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(() => el.classList.remove('on'), 5200);
}
window.toast = toast;

let SCAN_MARKERS = [];

function clearScan(){
  SCAN_MARKERS.forEach(m => m.remove());
  SCAN_MARKERS = [];
}

async function scanView(){
  const btn = document.getElementById('scanbtn');
  if (!MAP_READY) return;
  btn.disabled = true; btn.textContent = 'scanning…';
  clearScan();
  try{
    const b = map.getBounds();
    const bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()]
      .map(v => v.toFixed(4)).join(',');
    const sp = ($('#species') && $('#species').value) || 'striped_bass';
    /* /api/best, not /api/prospects: ranked coordinates for THIS fish rather
       than every bump in the box. Where the species carries a published depth
       band the ranking is restricted to the depths it is cited at, so the
       biggest bump in the water can be correctly absent -- Whale Rock has the
       most relief off Jamestown and its top is shallower than the fluke band
       reaches. */
    const d = await (await fetch(
      `/api/best?bbox=${bbox}&species=${encodeURIComponent(sp)}&n=61`)).json();
    if (d.error) throw new Error(d.error);

    if (!d.usable){
      btn.textContent = 'zoom in';
      toast(d.note);
      return;
    }
    const list = d.best || d.prospects || d.bumps || [];
    list.forEach((bump, i) => {
      const el = document.createElement('div');
      el.className = 'bump' + (bump.novel ? ' novel' : '');
      el.textContent = Math.round(bump.relief_ft);
      el.textContent = String(i + 1);
      el.title = [(d.ranked_by ? '#' + (i + 1) + ' — ' + d.ranked_by : null),
                  ...(bump.why || [])].filter(Boolean).join('\n');
      el.onclick = () => {
        // The tap that finds it is the tap that means "tell me about here",
        // which is also where logging a trip starts.
        if (typeof showConditions === 'function')
          showConditions(bump.lat, bump.lon,
                         `Bump · ${bump.relief_ft} ft relief`);
        if (bump.why && bump.why.length) toast(bump.why.join(' · '));
      };
      SCAN_MARKERS.push(new maplibregl.Marker({element: el})
        .setLngLat([bump.lon, bump.lat]).addTo(map));
    });
    btn.textContent = list.length ? `${list.length} found` : 'nothing here';
    // The area score is one number for the whole box and saying so is the
    // point: the current station, the SST pixel and the chlorophyll pixel do
    // not change inside it. Only the bottom does.
    const a = d.area || {};
    if (!list.length && d.usable)
      toast(d.depth_banded
        ? `Nothing in view sits in the depths ${d.species_name} is cited at.`
        : `No structure found in view.`);
    if (list.length && a.score != null)
      toast(`Area ${a.score}/100 for ${d.species_name || 'this fish'}`
            + (a.limiting ? `, held back by ${a.limiting}` : '')
            + ` · ${list.length} bump${list.length>1?'s':''} in view`
            + ` · bottom ~${d.sample_m} m, water 1–6 km`);
  } catch(e){
    btn.textContent = 'scan failed';
  } finally {
    btn.disabled = false;
    setTimeout(() => { btn.textContent = 'scan ⛰'; }, 4000);
  }
}

/* ---- potential surface -------------------------------------------------
   The obvious build is a smooth gradient. It would be a lie, and the numbers
   say why: sample the bay and 168 cells resolve to 32 current stations,
   because there are only 38 in-bay CO-OPS current stations in existence. The
   current at a cell IS the nearest station's prediction -- nothing measures
   the water between them -- so the true resolution is the station Voronoi and
   a smooth raster would be drawing the interpolation, not the ocean.

   So it renders as discrete cells with visible edges, and confidence drives
   opacity: a third of the bay is bound to a station miles away and washes out
   to nearly nothing. The patchiness is the honest picture, not a rough draft
   of a prettier one. */
let HEAT_ON = false, HEAT_BUSY = false;
const HEAT_ALPHA = {good: 0.55, fair: 0.30, poor: 0.12};

function heatSection(){
  return `<h4 style="margin-top:10px">Potential</h4>
    <label title="Score the water on the current tide">
      <span class="sw ramp" style="background:linear-gradient(90deg,#2b6cb0,#38a169,#d69e2e,#e53e3e)"></span>
      <input type="checkbox" id="heaton" ${HEAT_ON?'checked':''}>
      potential<span class="cnt" id="cnt-heat"></span></label>
    <p class="hint" id="heathint">Current + temperature on this tide.
      Washed-out cells are bound to a distant station — the score is an
      extrapolation there. Depth is shown, and scored only for the species
      that have a published band.</p>`;
}

async function loadHeat(){
  if (!MAP_READY || HEAT_BUSY) return;
  HEAT_BUSY = true;
