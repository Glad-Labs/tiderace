  const cnt = document.querySelector('#cnt-heat');
  if (cnt) cnt.textContent = '…';
  try{
    const b = map.getBounds();
    const bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()]
      .map(v => v.toFixed(4)).join(',');
    const sp = ($('#species') && $('#species').value) || 'striped_bass';
    const r = await fetch(`/api/heat?species=${encodeURIComponent(sp)}&bbox=${bbox}&n=16`);
    const d = await r.json();
    if (d.error) throw new Error(d.error);

    // Squares sized to the lattice step, so cells meet without overlapping.
    const cells = d.cells || [];
    const dy = (d.bbox[2] - d.bbox[0]) / (d.n - 1) / 2;
    const dx = (d.bbox[3] - d.bbox[1]) / (d.n - 1) / 2;
    const gj = {type:'FeatureCollection', features: cells.map(c => ({
      type:'Feature',
      properties:{score:c.score, alpha:HEAT_ALPHA[c.confidence] ?? 0.12,
                  conf:c.confidence, limiting:c.limiting, depth:c.depth_ft},
      geometry:{type:'Polygon', coordinates:[[
        [c.lon-dx, c.lat-dy], [c.lon+dx, c.lat-dy],
        [c.lon+dx, c.lat+dy], [c.lon-dx, c.lat+dy], [c.lon-dx, c.lat-dy]]]}
    }))};

    if (map.getSource('heat')) map.getSource('heat').setData(gj);
    else {
      map.addSource('heat', {type:'geojson', data:gj});
      map.addLayer({
        id:'heat', type:'fill', source:'heat',
        layout:{visibility: HEAT_ON ? 'visible' : 'none'},
        paint:{
          'fill-color':['interpolate',['linear'],['get','score'],
            20,'#2b6cb0', 40,'#38a169', 55,'#d69e2e', 70,'#e53e3e'],
          'fill-opacity':['get','alpha']
        }
      });   // spot marks are DOM markers, so they already sit above the canvas;
            // passing a beforeId that does not exist throws and loses the layer
      map.on('click','heat', e => {
        const p = e.features[0].properties;
        const bits = [`${p.score} potential`,
          p.limiting ? `held back by ${p.limiting}` : null,
          p.depth ? `${Math.round(p.depth)} ft` : null,
          `${p.conf} confidence`].filter(Boolean);
        const msg = bits.join(' · ');
        if (typeof showConditions === 'function') showConditions(e.lngLat.lat, e.lngLat.lng, msg);
        else console.log(msg);
      });
    }
    const sd = d.spread || {};
    if (cnt) cnt.textContent = `${sd.cells || 0}/${(d.counts||{}).bindings || 0}`;
    // The server says per response whether depth was scored for THIS species
    // -- two of six carry a band. The static hint above cannot know which
    // case it is, so replace it with what actually came back rather than
    // leaving a claim the response may contradict.
    const hint = document.querySelector('#heathint');
    if (hint && d.resolution_note)
      hint.textContent = [d.resolution_note, d.depth_note].filter(Boolean).join(' ');
  } catch(e){
    if (cnt) cnt.textContent = '!';
  } finally { HEAT_BUSY = false; }
}

async function loadCharts(){
  let meta;
  try{ meta = await (await fetch('/api/charts')).json(); }
  catch(e){ return; }
  const box = $('#layers');
  if (!meta.layers || !meta.layers.length){
    box.innerHTML = `<h4>Chart overlays</h4>
      <p class="hint">Not downloaded yet.<br>Run: python3 -m tiderace charts</p>`;
    return;
  }

  box.innerHTML = '<h4>Chart overlays</h4>' + meta.layers.map(l => {
    const st = CHART_STYLE[l.name] || {};
    return `<label title="${l.label}">
      <span class="sw${st.kind==='fill'?' ramp':''}"
            style="background:${st.swatch||'#8CA3A8'}"></span>
      <input type="checkbox" data-layer="${l.name}" ${CHART_ON[l.name]?'checked':''}>
      ${l.name}<span class="cnt" id="cnt-${l.name}"></span></label>`;
  }).join('') + depthLegend() + heatSection()
    + `<p class="hint">NOAA ENC · public domain<br>click any feature for detail</p>`;

  for (const l of meta.layers){
    const st = CHART_STYLE[l.name];
    if (!st) continue;
    if (MAP_READY && map.getSource('c-' + l.name)) continue;
      // Soundings are 26,000 points and 4 MB. Downloading them on boot to draw
      // nothing -- they are off by default and only render past zoom 13 -- is
      // four megabytes of somebody's cell data for no picture. Heavy layers
      // wait until they are actually switched on.
      if (st.lazy && !CHART_ON[l.name] && !CHART_DATA[l.name]) continue;

    // loadCharts() runs on boot (to populate the menu) and again when the map
    // becomes ready. Cache the GeoJSON so a slow map load does not re-pull
    // three quarters of a megabyte.
      // A model layer has no bundled file: it is built from cells on demand,
      // so it starts empty and fills in as you look around.
      if (!CHART_DATA[l.name]) {
        CHART_DATA[l.name] = l.url
          ? await (await fetch(l.url)).json()
          : {type:'FeatureCollection', features:[]};
      }
    const gj = CHART_DATA[l.name];
    const cnt = document.querySelector('#cnt-' + l.name);
    if (cnt) cnt.textContent = gj.features.length;
    // Re-checked after the await, not just before it: loadCharts runs twice --
    // on boot and again when the map is ready -- and each layer awaits a fetch
    // in between. Both passes can clear the guard at the top of the loop and
    // then both try to add the same source; the second throws and takes the
    // rest of the chart stack with it.
    if (!MAP_READY || map.getSource('c-' + l.name)) continue;
    map.addSource('c-' + l.name, {type:'geojson', data:gj});

    if (st.kind === 'fill'){
      // The band edges are the depth contours, so a hairline of the map's own
      // ground colour separates them and reads as the contour at the same time.
      map.addLayer({
        id: 'c-' + l.name, type:'fill', source:'c-' + l.name,
        minzoom: st.minzoom || 0,
        layout:{visibility: CHART_ON[l.name] ? 'visible' : 'none'},
        paint:{
          'fill-color': st.colour,
          'fill-opacity': st.opacity ?? 0.5,
          'fill-outline-color': 'rgba(11,21,24,.45)'
        }
      }, ABOVE_BASEMAP());
      continue;         // ground is not clickable -- see the map click handler
    }

    if (st.kind === 'line'){
      map.addLayer({
        id: 'c-' + l.name, type:'line', source:'c-' + l.name,
        minzoom: st.minzoom || 0,
        layout:{visibility: CHART_ON[l.name] ? 'visible' : 'none',
                'line-join':'round', 'line-cap':'round'},
        paint:Object.assign({'line-color': st.colour,
                             'line-width': st.width || 0.8},
                            st.dash ? {'line-dasharray': st.dash} : {})
      }, ABOVE_BASEMAP());
      // A contour with no number on it is a squiggle. The value is the whole
      // point, so it rides along as a symbol layer on the same source.
      if (st.label) {
        map.addLayer({
          id: 'c-' + l.name + '-lbl', type:'symbol', source:'c-' + l.name,
          minzoom: (st.minzoom || 0) + 1,
          layout:{visibility: CHART_ON[l.name] ? 'visible' : 'none',
                  'symbol-placement':'line', 'text-field': st.label,
                  'text-font':['Noto Sans Regular'], 'text-size':10,
                  'text-max-angle':30, 'symbol-spacing':180},
          // Not st.colour. The line is deliberately faint -- 55% cyan -- and a
          // number inherited from it measured about 1.4:1 on the daylight
          // chart, which is drawn but unreadable. A hairline may be subtle;
          // the depth it is labelling may not.
          paint:{'text-color': themeColour(st.model ? '--chart-ink-2' : '--chart-ink',
                                           st.colour),
                 'text-halo-color': themeColour('--halo', 'rgba(11,21,24,.9)'),
                 'text-halo-width':1.4}
        }, ABOVE_BASEMAP());
      }
      continue;
    }

    if (st.kind === 'symbol'){
      map.addLayer({
        id: 'c-' + l.name, type:'symbol', source:'c-' + l.name,
        minzoom: st.minzoom || 13,
        layout:{visibility: CHART_ON[l.name] ? 'visible' : 'none',
                'text-field': st.label, 'text-font':['Noto Sans Regular'],
                'text-size':10, 'text-allow-overlap':false},
        paint:{'text-color': st.colour, 'text-halo-color': themeColour('--halo', 'rgba(11,21,24,.9)'),
               'text-halo-width':1.1}
      }, ABOVE_BASEMAP());
      continue;
    }


    map.addLayer({
      id: 'c-' + l.name, type:'circle', source:'c-' + l.name,
      minzoom: st.minzoom || 9,
      layout:{visibility: CHART_ON[l.name] ? 'visible' : 'none'},
      paint:{
        'circle-color': st.colour,
        'circle-radius': st.radius,
        'circle-opacity': 0.9,
        'circle-stroke-width': 0.6,
        'circle-stroke-color': 'rgba(11,21,24,.85)'
      }
    }, undefined);
    // No per-layer click handler: MapLibre hit-tests the exact pixel, and a
    // three-pixel rock is not something a thumb hits on a moving boat. The
    // main map click queries a padded box instead and picks the nearest.

    map.on('mouseenter', 'c-' + l.name, () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'c-' + l.name, () => map.getCanvas().style.cursor = '');
  }

  const hb = box.querySelector('#heaton');
  if (hb) hb.onchange = async () => {
    HEAT_ON = hb.checked;
    if (HEAT_ON && !map.getSource('heat')) await loadHeat();
    if (map.getLayer('heat'))
      map.setLayoutProperty('heat','visibility', HEAT_ON ? 'visible':'none');
  };

  box.querySelectorAll('input[data-layer]').forEach(cb => cb.onchange = () => {
      const name = cb.dataset.layer;
      const id = 'c-' + name;
      CHART_ON[name] = cb.checked;
      // A lazy layer has no source until now, so switching it on is what
      // fetches it. Show that something is happening: 4 MB on a boat is not
      // instant, and a checkbox that does nothing for ten seconds reads broken.
      if (cb.checked && MAP_READY && !map.getSource(id)) {
        const cnt = document.querySelector('#cnt-' + name);
        if (cnt) cnt.textContent = '…';
        loadCharts()
          .then(() => { if (typeof loadCellsForView === 'function') loadCellsForView(); })
          .catch(() => { if (cnt) cnt.textContent = '!'; });
        return;
      }
      // Contours carry a separate label layer; toggling only the line would
      // leave the numbers floating over an invisible curve.
      for (const lid of [id, id + '-lbl'])
        if (MAP_READY && map.getLayer(lid))
          map.setLayoutProperty(lid, 'visibility', cb.checked ? 'visible' : 'none');
    });
}

function depthLegend(){
  return `<div id="depthkey">
    <div class="bar">${DEPTH_RAMP.map(c =>
      `<i style="background:${c}"></i>`).join('')}</div>
    <div class="ends"><span>${DEPTH_LABELS[0]}</span>
      <span>${DEPTH_LABELS[DEPTH_LABELS.length-1]}</span></div>
  </div>`;
}

function chartPopup(e, layer){
  const f = e.features && e.features[0];
  if (!f) return;
  const p = f.properties || {};
  const rows = Object.entries(p)
    .filter(([k]) => k !== 'depth_m')
    .map(([k,v]) => `${k.replace(/_/g,' ')}: <b>${v}</b>`).join('<br>');
  new maplibregl.Popup({closeButton:false, maxWidth:'260px'})
    .setLngLat(e.lngLat)
    .setHTML(`<b style="color:#F04FA0">${layer.replace(/s$/,'')}</b><br>${rows || 'no charted detail'}`)
    .addTo(map);
}

// Bait sightings fade as they age -- a three-day-old report should look like
// what it is, not like something you saw this morning.
/* The wind farm. Five towers seventeen miles out, and the most obvious
   landmark in the water Matt fishes for tuna -- but the ENC harbour band's
   Offshore_Platform layer has eight features in this box and every one of
   them is up in the bay, so the turbines simply are not in the chart data.
   They come from the coordinates in offshore.py instead, drawn as labelled
   marks so the farm can be found rather than hunted for. */
async function loadStructure(){
  if (!MAP_READY || map.getSource('structure')) return;
  let gj;
  try { gj = await (await fetch('/api/structure')).json(); }
  catch (_) { return; }                       // offline: the map still works
  map.addSource('structure', {type:'geojson', data:gj});
  map.addLayer({
    id:'structure', type:'circle', source:'structure',
    paint:{'circle-color': themeColour('--mk-ink', '#E4ECEE'), 'circle-radius':4,
           'circle-stroke-width':1.4,
           'circle-stroke-color': themeColour('--mk-edge', '#0B1518')}
  });
  map.addLayer({
    id:'structure-lbl', type:'symbol', source:'structure',
    minzoom:10,
    layout:{'text-field':['get','name'], 'text-font':['Noto Sans Regular'],
            'text-size':10, 'text-offset':[0,1.1], 'text-anchor':'top'},
    paint:{'text-color': themeColour('--mk-ink', '#E4ECEE'), 'text-halo-color': themeColour('--halo', 'rgba(11,21,24,.9)'),
           'text-halo-width':1.2}
  });
}


/* ---- charts beyond the bay ---------------------------------------------
 * The bundled layers are one bay. For Montauk to the Cape, and offshore to the
 * shelf, the data is cut into a fixed 0.25 degree grid on the server and
 * fetched a cell at a time -- only where you actually look.
 *
 * The grid is fixed rather than viewport-shaped on purpose: a stable key is
 * what makes a cell cacheable. Pan away and back and it is the same URL,
 * already on disk and already in the service worker. A viewport-shaped query
 * would be a new URL every frame and would cache nothing.
 *
 * Only the depth layers work this way. Rocks and wrecks are inshore features
 * and the bundled files already cover the water they exist in.
 */
const CELL_LAYERS = ['soundings', 'contours', 'bathy'];
const CELL_MIN_ZOOM = 11;     // below this they are a smear, and not worth the data
const CELLS_LOADED = new Set();
let cellBusy = false, cellPending = false;

async function loadCellsForView(){
  if (!MAP_READY) return;
  if (map.getZoom() < CELL_MIN_ZOOM) return;
  const want = CELL_LAYERS.filter(n => CHART_ON[n]);
  if (!want.length) return;

  // A pan while cells are in flight used to be dropped outright, so whatever
  // you moved to simply never loaded. Now it is remembered and run at the end.
  if (cellBusy) { cellPending = true; return; }
  cellBusy = true;

  try {
    const b = map.getBounds();
    const bbox = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].join(',');
    // Enough to cover a viewport rather than a token six. The server still
    // orders them centre-first, so if the cap does bite it bites at the edges.
    const meta = await (await fetch(`/api/chartcells?bbox=${bbox}&limit=20`)).json();

    const jobs = [];
    for (const c of (meta.cells || []))
      for (const name of want){
        const key = `${name}/${c.iy}/${c.ix}`;
        if (CELLS_LOADED.has(key)) continue;
        CELLS_LOADED.add(key);      // claim before awaiting, or a second pan
                                    // starts the same fetch again
        jobs.push({name, key, iy: c.iy, ix: c.ix});
      }

    // Cells are independent, and awaiting them one at a time meant the last of
    // six modelled cells landed a minute after the first. Four at a time keeps
    // the map filling in visibly without opening twenty sockets on a phone.
    const CONCURRENCY = 4;
    let next = 0;
    const worker = async () => {
      while (next < jobs.length){
        const job = jobs[next++];
        const url = job.name === 'bathy'
          ? `/charts/bathy/${job.iy}/${job.ix}.geojson`
          : `/charts/cell/${job.key}.geojson`;
        try {
          const gj = await (await fetch(url)).json();
          if (gj.features && gj.features.length) mergeCell(job.name, gj);
        } catch (_) {
          CELLS_LOADED.delete(job.key);   // offline or a bad cell: let it retry
        }
      }
    };
    await Promise.all(Array.from({length: CONCURRENCY}, worker));
  } catch (_) {
    /* no network: the bundled layers still draw */
  } finally {
    cellBusy = false;
    if (cellPending){ cellPending = false; loadCellsForView(); }
  }
}

/* Cells are merged into the layer's existing source rather than each becoming
   its own source and layer. Twenty cells across two layers would be forty
   MapLibre layers, all needing the same styling and the same z-order fixed up
   every time one arrived. */
function mergeCell(name, gj){
  const id = 'c-' + name;
  const src = map.getSource(id);
  if (!src) return;                     // layer not built yet; next pan catches it
  const cur = CHART_DATA[name] || {type:'FeatureCollection', features:[]};
  cur.features = cur.features.concat(gj.features);
  CHART_DATA[name] = cur;
  src.setData(cur);
  const cnt = document.querySelector('#cnt-' + name);
  if (cnt) cnt.textContent = cur.features.length;
}

map.on('moveend', loadCellsForView);


/* ---- trip recording ---------------------------------------------------
 * One tap at the ramp, one at the dock. In between the phone keeps a
 * breadcrumb, so a trip exists whether or not anybody remembered to log it --
 * which is the whole point, because the trips people forget are the blanks,
 * and blanks are half of what the evaluation harness has to work with.
 *
 * Everything is written to the phone first. A track that only lives in a
 * variable is lost to a backgrounded tab, a dead battery, or a browser
 * deciding to reclaim memory, and losing a day on the water is not
 * recoverable the way a failed upload is.
 */
const TRIP_KEY = 'tiderace:trip';
let tripWatch = null;

function tripState(){
  try { return JSON.parse(localStorage.getItem(TRIP_KEY) || 'null'); }
  catch (_) { return null; }
}
function tripSave(st){
  try { localStorage.setItem(TRIP_KEY, JSON.stringify(st)); } catch (_) {}
}

function paintTrip(){
  const btn = document.getElementById('trip');
  if (!btn) return;
  const st = tripState();
  if (st){
    const mins = Math.round((Date.now() - st.startedAt) / 60000);
    btn.classList.add('rec');
    btn.innerHTML = `<b>${mins}m</b>${st.points.length} fix`;
    btn.setAttribute('aria-label', 'Stop recording this trip');
  } else {
    btn.classList.remove('rec');
    btn.innerHTML = '<b>REC</b>trip';
    btn.setAttribute('aria-label', 'Record this trip');
  }
}

function tripStart(){
  if (!navigator.geolocation) return;
  tripSave({startedAt: Date.now(), points: []});
  // High accuracy because the question is which side of a breachway you were
  // on, not which town. maximumAge lets the OS reuse a recent fix instead of
  // waking the GPS for every sample, which is most of the battery cost.
  tripWatch = navigator.geolocation.watchPosition(pos => {
    const st = tripState();
    if (!st) return;
    const p = {lat: +pos.coords.latitude.toFixed(6),
               lon: +pos.coords.longitude.toFixed(6),
               t: new Date().toISOString().slice(0, 19)};
    const last = st.points[st.points.length - 1];
    // One fix a minute is plenty to find a dwell and keeps the file small; a
    // boat holding station does not need six a minute to prove it.
    if (last && (Date.now() - Date.parse(last.t + 'Z')) < 55000) return;
    st.points.push(p);
    tripSave(st);
    paintTrip();
  }, () => {}, {enableHighAccuracy: true, maximumAge: 30000, timeout: 60000});
  paintTrip();
}

async function tripStop(){
  const st = tripState();
  if (tripWatch !== null){ navigator.geolocation.clearWatch(tripWatch); tripWatch = null; }
  localStorage.removeItem(TRIP_KEY);
  paintTrip();
  if (!st || st.points.length < 2){
    if (typeof toast === 'function') toast('Too short to keep');
    return;
  }
  try {
    const r = await fetch('/api/track', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({points: st.points})
    });
    const d = await r.json();
    if (d.summary) showTripSummary(d.summary);
  } catch (_) {
    // Out of signal at the dock. Put it back and it goes up next time the
    // button is used; a day on the water is not worth losing to a dead bar.
    tripSave(st);
    paintTrip();
  }
}

/* The end of a trip is the one moment you will actually log it: you are
   stopped, the rod is down, and you still remember. So the summary opens the
   sheet at the spot you spent longest on, with the log form already open. */
function showTripSummary(s){
  const d = s.best;
  if (!d){ return; }
  if (window.showConditions) showConditions(d.lat, d.lon, 'Where you fished longest');
  setTimeout(() => {
    const t = document.getElementById('slogtoggle');
    const form = document.getElementById('slogform');
    if (t && form && !form.classList.contains('open')) t.click();
    const heard = document.getElementById('slogheard');
    if (heard){
      heard.className = 'show';
      heard.innerHTML =
        `<b>${s.minutes.toFixed(0)} min on the water</b> · ${s.distance_nm} nm · ` +
        `${s.dwells.length} spot${s.dwells.length === 1 ? '' : 's'} worked<br>` +
        `Longest stop was ${d.minutes.toFixed(0)} min here. ` +
        `Log it — a blank counts.`;
    }
  }, 900);
}

(function initTrip(){
  const btn = document.getElementById('trip');
  if (!btn) return;
  btn.onclick = () => { tripState() ? tripStop() : tripStart(); };
  // Survive a reload mid-trip: the points are on the phone, so pick the watch
  // back up rather than silently recording nothing for the rest of the day.
  if (tripState()) tripStart();
  paintTrip();
  setInterval(paintTrip, 30000);
})();


/* ---- trips ------------------------------------------------------------
 * What the tracking is for. A trip is a line and a list of fish; the row
 * shows the numbers and a tap puts the drift itself on the map.
 *
 * Only the fishing sessions are drawn, not the raw breadcrumb. The run out and
 * the run home are not information -- they are the same channel every time --
 * and drawing them buries the part that matters under a line to the ramp.
 */
let TRIPS = [], TRIP_SHOWN = null;

// The sheet's own esc() lives inside its IIFE and is not reachable from here.
// Duplicating four lines beats reaching into another scope, and beats the
// alternative that shipped for a moment: interpolating unescaped values into
// innerHTML because the helper happened not to be in scope.
const tesc = t => String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

async function loadTrips(){
  try { TRIPS = (await (await fetch('/api/tracks')).json()).tracks || []; }
  catch (_) { TRIPS = []; }
  return TRIPS;
}

function tripRow(t, i){
  const d = new Date(t.started_at);
  const when = d.toLocaleDateString([], {weekday:'short', month:'short', day:'numeric'})
             + ' · ' + d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const fish = t.fish > 0
    ? `<div class="fish">${t.fish}</div>`
    : `<div class="fish blank">blank</div>`;
  const sp = (t.species || []).map(x => x.replace(/_/g,' ')).join(', ');
  const bits = [
    `${Math.round(t.minutes)} min`,
    `${t.distance_nm} nm`,
    `${(t.sessions || []).length} spot${(t.sessions||[]).length === 1 ? '' : 's'}`,
    t.fishing_minutes ? `${Math.round(t.fishing_minutes)} min fishing` : '',
  ].filter(Boolean).join(' · ');
  return `<div class="trip" data-trip="${i}">
      <div class="when">${tesc(when)}</div>${fish}
      <div class="meta">${tesc(bits)}${sp ? ' · <span class="sp">' + tesc(sp) + '</span>' : ''}</div>
    </div>`;
}

/* Draw one trip's fishing sessions. Redrawn rather than toggled per trip:
   MapLibre sources are cheap to replace and this keeps exactly one trip on the
   map, which is what you want when comparing two days. */
function drawTrip(t){
  if (!MAP_READY) return;
  const feats = [];
  for (const s of (t.sessions || [])){
    if ((s.path || []).length > 1)
      feats.push({type:'Feature',
        geometry:{type:'LineString', coordinates: s.path.map(([la,lo]) => [lo,la])},
        properties:{kind:s.kind, minutes:s.minutes}});
  }
  for (const c of (t.catches || []))
    if (c.lat != null && c.lon != null)
      feats.push({type:'Feature', geometry:{type:'Point', coordinates:[c.lon,c.lat]},
                  properties:{fish:true, label:`${c.count} ${(c.species||'').replace(/_/g,' ')}`}});

  const gj = {type:'FeatureCollection', features:feats};
  if (map.getSource('trip')) { map.getSource('trip').setData(gj); }
  else {
    map.addSource('trip', {type:'geojson', data:gj});
    map.addLayer({id:'trip-line', type:'line', source:'trip',
      filter:['==',['geometry-type'],'LineString'],
      layout:{'line-join':'round','line-cap':'round'},
      paint:{'line-color':['match',['get','kind'],'troll','#D9A521','#F04FA0'],
             'line-width':3.5, 'line-opacity':.9}});
    map.addLayer({id:'trip-fish', type:'circle', source:'trip',
      filter:['==',['get','fish'],true],
      paint:{'circle-color':'#4FBF89','circle-radius':6,
             'circle-stroke-width':2,'circle-stroke-color':'#0B1518'}});
    map.addLayer({id:'trip-fish-lbl', type:'symbol', source:'trip',
      filter:['==',['get','fish'],true], minzoom:10,
      layout:{'text-field':['get','label'],'text-font':['Noto Sans Regular'],
              'text-size':11,'text-offset':[0,1.2],'text-anchor':'top'},
      paint:{'text-color': themeColour('--mk-ink', '#E4ECEE'),'text-halo-color': themeColour('--halo', 'rgba(11,21,24,.9)'),
             'text-halo-width':1.2}});
  }

  // Frame the fishing, not the whole day.
  const pts = feats.flatMap(f => f.geometry.type === 'LineString'
    ? f.geometry.coordinates : [f.geometry.coordinates]);
  if (pts.length){
    const lons = pts.map(p=>p[0]), lats = pts.map(p=>p[1]);
    map.fitBounds([[Math.min(...lons),Math.min(...lats)],
                   [Math.max(...lons),Math.max(...lats)]],
                  {padding:70, maxZoom:14, duration:700});
  }
}

function clearTrip(){
  for (const id of ['trip-fish-lbl','trip-fish','trip-line'])
    if (map.getLayer(id)) map.removeLayer(id);
  if (map.getSource('trip')) map.removeSource('trip');
  TRIP_SHOWN = null;
}

async function showTrips(){
  const body = document.getElementById('sheetbody');
  const head = document.getElementById('sheettitle');
  const sheet = document.getElementById('sheet');
  if (!body) return;
  head.textContent = 'Trips';
  document.getElementById('sheetwhen').textContent = '';
  document.getElementById('sheetzone').textContent = '';
  body.innerHTML = '<div class="sdim">reading trips…</div>';
  window.setSheet('full');

  // How the model is doing, above the trips it is judged on. This lived only
  // in the CLI, so the one number that can say the other sixteen data sources
  // are worthless was the one number never looked at.
  let scorecard = '';
  try{
    const ev = await (await fetch('/api/evaluate')).json();
    if (!ev.error){
      const pct = v => v == null ? 'n/a' : (v >= 0 ? '+' : '') + v.toFixed(2);
      const rows = ev.ready ? `
        <div class="evrow"><span>tiderace</span><b>${pct(ev.model_rho)}</b></div>
        <div class="evrow"><span>moving water + low light</span><b>${pct(ev.baseline_rho)}</b></div>
        <div class="evrow"><span>solunar</span><b>${pct(ev.solunar_rho)}</b></div>
        <div class="evrow"><span>random</span><b>${pct(ev.random_rho)}</b></div>` : '';
      // The share of trips the app picked. A model validated on water it chose
      // is grading its own homework, and this is the number that shows it.
      const chosen = ev.app_chosen_share
        ? `<div class="evrow dim"><span>trips the app chose</span>` +
          `<b>${Math.round(ev.app_chosen_share * 100)}%</b></div>` : '';
      scorecard =
        `<div class="ev ${ev.ready ? '' : 'notyet'}">` +
          `<div class="evhead">${ev.usable} of ${ev.min_trips} trips</div>` +
          `<div class="evbar"><i style="width:${Math.min(100, Math.round(ev.usable / ev.min_trips * 100))}%"></i></div>` +
          `<div class="evverdict">${tesc(ev.verdict || '')}</div>` +
          rows + chosen +
        `</div>`;
    }
  } catch(_){ /* offline: the trips below still work */ }

  const ts = await loadTrips();
  if (!ts.length){
    body.innerHTML = scorecard + '<div class="sdim">No trips recorded yet. Hit REC at the ' +
      'ramp and stop at the dock — a trip is kept whether or not you log a fish, ' +
      'and the blanks are the half everyone throws away.</div>';
    return;
  }
  const fish = ts.reduce((n,t) => n + (t.fish||0), 0);
  const blanks = ts.filter(t => !t.fish).length;
  body.innerHTML = scorecard +
    `<div class="sgroup">${ts.length} trip${ts.length===1?'':'s'} · ` +
    `${fish} fish · ${blanks} blank${blanks===1?'':'s'}</div>` +
    ts.map(tripRow).join('') +
    `<div class="sdim">Tap a trip to put its drifts on the map. ` +
    `Pink is drifting, amber is trolling; green dots are logged catches.</div>`;

  body.querySelectorAll('.trip').forEach(el => el.onclick = () => {
    const t = ts[+el.dataset.trip];
    body.querySelectorAll('.trip').forEach(x => x.classList.remove('on'));
    if (TRIP_SHOWN === t){ clearTrip(); return; }
    el.classList.add('on');
    TRIP_SHOWN = t;
    drawTrip(t);
    window.setSheet('peek');          // get out of the way of the map
  });
}
window.showTrips = showTrips;

async function loadBait(){
  if (!MAP_READY) return;
  let gj;
  try{ gj = await (await fetch('/api/bait')).json(); }catch(e){ return; }
  if (map.getSource('bait')) { map.getSource('bait').setData(gj); return; }
  if (!gj.features || !gj.features.length) return;

  map.addSource('bait', {type:'geojson', data:gj});
  map.addLayer({
    id:'bait-halo', type:'circle', source:'bait',
    paint:{
      'circle-color':'#5FE3C0',
      'circle-radius':['interpolate',['linear'],['zoom'],9,10,14,34],
      'circle-opacity':['*',['get','freshness'],0.16],
      'circle-blur':0.7
    }
  });
  map.addLayer({
    id:'bait', type:'circle', source:'bait',
    paint:{
      'circle-color':['case',['==',['get','abundance'],'none'],'#E0705F','#5FE3C0'],
      'circle-radius':['match',['get','abundance'],
        'loaded',9,'decent',7,'scattered',5,'trace',4,'none',5, 6],
      'circle-opacity':['max',0.25,['get','freshness']],
      'circle-stroke-width':1.2,
      'circle-stroke-color': themeColour('--halo', 'rgba(11,21,24,.9)')
    }
  });
  map.on('click','bait', e => {
    const p = e.features[0].properties;
    const label = p.abundance === 'none' ? `no ${p.bait} seen`
                                         : `${p.abundance} ${p.bait}`;
    new maplibregl.Popup({closeButton:false})
      .setLngLat(e.lngLat)
      .setHTML(`<b style="color:#5FE3C0">${label}</b><br>${p.age_days}d ago · ${p.source}` +
               (p.notes ? `<br>${p.notes}` : ''))
      .addTo(map);
  });
  map.on('mouseenter','bait',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','bait',()=>map.getCanvas().style.cursor='');
}

/* Swapping the basemap flavour means a new style, and setStyle drops every
   source and layer this app added -- charts, marks, bait, the potential
   surface. They all hang off map.on('load'), which does not fire again, so
   they are re-added on styledata instead. Getting this wrong leaves a
   correctly-lit map with nothing on it. */
function applyTheme(next){
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('tiderace-theme', next); } catch (_) {}
  const btn = $('#themebtn');
  if (btn) btn.textContent = next === 'light' ? 'sun ☀' : 'dark ☾';
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.setAttribute('content',
    getComputedStyle(document.documentElement).getPropertyValue('--ground').trim());
  if (!MAP_READY) return;

  MAP_READY = false;
  map.once('styledata', () => {
    MAP_READY = true;
    // No cache to clear: loadCharts guards on map.getSource, and setStyle
    // has already removed every source, so the layers re-add themselves.
    syncMarkers(); loadCharts(); loadBait(); loadStructure();
    loadCellsForView();
    if (typeof HEAT_ON !== 'undefined' && HEAT_ON && typeof loadHeat === 'function')
      loadHeat();
    clampLabels();
  });
  map.setStyle(basemapStyle());
}

$('#themebtn').onclick = () =>
  applyTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');

$('#scanbtn').onclick = () => scanView();
$('#layersbtn').onclick = e => { e.stopPropagation(); $('#layers').classList.toggle('open'); };
document.addEventListener('click', e => {
  if (!$('#layers').contains(e.target) && e.target !== $('#layersbtn'))
    $('#layers').classList.remove('open');
});

// ------------------------------------------------------- offline + queueing
//
// The bay has no signal worth relying on, so a trip is written to the phone
// first and sent second. A POST that fails is not an error the angler should
// have to think about at 2am with wet hands -- it is just a row that has not
// synced yet.

const DB_NAME = 'tiderace', STORE = 'queue';

function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains(STORE))
        db.createObjectStore(STORE, {keyPath: 'client_id'});
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}

async function tx(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const t = db.transaction(STORE, mode);
    const out = fn(t.objectStore(STORE));
    t.oncomplete = () => res(out?.result ?? out);
    t.onerror = () => rej(t.error);
  });
}

const queueAdd  = e  => tx('readwrite', s => s.put(e));
const queueAll  = () => tx('readonly',  s => s.getAll());
const queueDrop = id => tx('readwrite', s => s.delete(id));

async function pendingCount() {
  try { return (await queueAll()).length; } catch (_) { return 0; }
}

async function refreshNetState() {
  const el = $('#netstate');
  const n = await pendingCount();
  if (!navigator.onLine) {
    el.className = 'off';
    el.textContent = n ? `offline · ${n} queued` : 'offline';
  } else if (n) {
    el.className = 'queued';
    el.textContent = `${n} to sync`;
  } else {
    el.className = 'ok';
    el.textContent = '';
  }
}

/** Send everything queued, in one request. Anything the server rejects stays
 *  put rather than being silently dropped. */
async function flushQueue() {
  if (!navigator.onLine) return {sent: 0};
  let entries;
  try { entries = await queueAll(); } catch (_) { return {sent: 0}; }
  if (!entries.length) return {sent: 0};

  let r;
  try {
    r = await fetch('/api/log', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({entries})
    });
  } catch (_) { return {sent: 0, offline: true}; }
  if (!r.ok) return {sent: 0};

  const j = await r.json();
  for (const id of (j.saved || [])) if (id) await queueDrop(id);
  await refreshNetState();
  return {sent: (j.saved || []).length, failed: (j.failed || []).length,
          summary: j.summary};
}

/** Pull everything needed to fish a tide without the server. */
async function saveForOffline() {
  const btn = $('#offlinebtn');
  const was = btn.textContent;
  btn.textContent = 'saving…'; btn.disabled = true;
  try {
    const meta = await (await fetch('/api/meta')).json();
    const urls = ['/', '/api/meta', '/api/bait', '/api/charts'];
    for (const sp of meta.species) urls.push(`/api/grid?species=${sp.key}&hours=48`);
    for (const l of (await (await fetch('/api/charts')).json()).layers || [])
      urls.push(l.url);

    // The conditions sheet is what you actually open on the water, and
    // /api/survey is per-coordinate so it cannot be cached exhaustively. But
    // the places you fish are a short known list, and your own marks are
    // already in GRID.spots beside the curated ones. Anywhere else still says
    // "nothing saved for this" offshore, which is honest: a real gap beats a
    // silently stale answer about the wrong piece of water.
    const seen = new Set();
    for (const sp of ((GRID && GRID.spots) || [])) {
      const u = window.surveyURL(sp.lat, sp.lon);
      if (!seen.has(u)) { seen.add(u); urls.push(u); }
    }

    // Fetch through the page so the service worker's DATA cache fills, then
    // ask it to confirm.
    btn.textContent = `saving 0/${urls.length}`;
    let done = 0;
    await Promise.allSettled(urls.map(u => fetch(u).finally(() => {
      btn.textContent = `saving ${++done}/${urls.length}`;
    })));

    // navigator.serviceWorker.ready NEVER settles when registration failed --
    // private browsing, storage full, a webview with workers switched off.
    // Awaiting it bare pinned the button on "saving..." for good, which is
    // worse than an error: it looks like it worked and you find out offshore.
    const reg = await Promise.race([
      navigator.serviceWorker?.ready ?? Promise.resolve(null),
      new Promise(r => setTimeout(() => r(null), 4000)),
    ]).catch(() => null);

    if (!reg || !reg.active) {
      // The fetches did populate the HTTP cache, but nothing here can promise
      // they survive losing signal. Say exactly that rather than tick.
      btn.textContent = 'no offline store';
      btn.title = 'Fetched, but the service worker is not running, so this is '
                + 'not guaranteed to survive losing signal.';
      setTimeout(() => { btn.textContent = was; btn.disabled = false; }, 3500);
      return;
    }
    reg.active.postMessage({type: 'prefetch', urls});

    localStorage.setItem('tiderace:saved', new Date().toISOString());
    btn.textContent = 'saved ✓';
    setTimeout(() => { btn.textContent = was; btn.disabled = false; }, 2500);
  } catch (e) {
    btn.textContent = 'failed';
    setTimeout(() => { btn.textContent = was; btn.disabled = false; }, 2500);
  }
}

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(()=>{}));
  // Ask the worker which build is actually serving this page. A stale worker
  // answers with its own old version, which is the point: the page cannot tell
  // you it is stale by reading itself.
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data && e.data.type === 'version') window.__SHELL = e.data.shell;
  });
  navigator.serviceWorker.ready
    .then(r => r.active && r.active.postMessage({type: 'version'}))
    .catch(function(){});
}

async function loadSpecies(){
  const meta = await (await fetch('/api/meta')).json();
  /* All thirty-five, not the six with a profile. You catch a bonito whether
     or not the model has an opinion about bonito, and the picker refusing to
     show the fish meant you could not look at the water for it or log one
     from the map. Grouped so the difference is visible rather than implied. */
  const scored = meta.species.filter(s => s.scored);
  const rest   = meta.species.filter(s => !s.scored);
  const opt = s => `<option value="${s.key}">${s.name}` +
                   `${s.hms ? ' (HMS)' : ''}</option>`;
  $('#species').innerHTML =
    `<optgroup label="forecast modelled">${scored.map(opt).join('')}</optgroup>` +
    `<optgroup label="conditions only — no forecast">${rest.map(opt).join('')}</optgroup>`;
  $('#species').value = 'striped_bass';
}

async function loadGrid(){
  $('#loading').classList.remove('hide');
  const sp = $('#species').value;
  GRID = await (await fetch(`/api/grid?species=${sp}&hours=48`)).json();

  syncMarkers();

  const t = $('#time');
  t.max = Math.max(0, GRID.times.length - 1);
  TI = Math.min(TI, +t.max); t.value = TI;

  $('#ticks').innerHTML = [0, .25, .5, .75, 1]
    .map(f => { const i = Math.round(f*(GRID.times.length-1));
      return `<span>${new Date(GRID.times[i]).toLocaleString([], {weekday:'short',hour:'2-digit'})}</span>`; })
    .join('');

  const m = $('#mode');
  m.className = GRID.license_mode === 'commercial' ? 'com' : 'rec';
  m.textContent = GRID.license_mode === 'commercial' ? 'commercial' : 'recreational';

  const r = GRID.regulations || {};
  if (r.known){
    const diffs = (GRID.regulations_differences || [])
      .map(d => `<br>· ${d}`).join('');
    $('#regsbox').innerHTML =
      `<p class="ph">Rules</p>
       <div id="regs" class="${r.open ? '' : 'closed'}">
         <b>${r.open ? 'OPEN' : 'CLOSED'}</b> — ${GRID.regulations_line}
         ${GRID.license_mode === 'commercial' && diffs
            ? `<br><span style="color:var(--muted)">differs from recreational:</span>${diffs}` : ''}
         ${r.advisory
            ? `<span class="warn">Commercial limits change in-season —
               confirm on ${r.hotline} before landing fish.</span>` : ''}
       </div>`;
  } else { $('#regsbox').innerHTML = ''; }
  paintLegal();

  if (SEL && !GRID.spots.some(s => s.key === SEL)) SEL = null;
  paint();
  $('#loading').classList.add('hide');
}

/* The same facts as #regsbox, but on the surface a phone actually shows.
   Not folded: this is the one thing in the app that is law rather than a
   forecast, and folding it would put a tap between Matt and a violation. */
function paintLegal(){
  const el = $('#slegal');
  if (!el) return;
  // `esc` lives in the sheet's IIFE, not here. Calling it threw a
  // ReferenceError inside loadGrid, which killed the rest of loadGrid and
  // blanked #regsbox too -- so the fix for missing regs briefly removed the
  // regs that were already working. Third scope-split of this shape.
  const q = t => String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const r = (GRID && GRID.regulations) || {};
  if (!r.known){
    // Silence here would read as "no limits". It means nobody checked.
    const sp = $('#species') && $('#species').selectedOptions[0];
    el.innerHTML = `<div class="lg"><b>RULES NOT MODELLED</b>` +
      `<span>for ${q((sp && sp.textContent) || 'this species')} — check the ` +
      `RIDEM table before keeping one.</span></div>`;
    return;
  }
  // The headline is one glance: open or shut, and the size. Everything else
  // is a tap. The first cut put all of it on screen at once and took 173px --
  // 44% of the sheet -- which is the same fault the tab restructure fixed:
  // the most important thing loses by being shown alongside everything else.
  const size = r.slot ? `slot ${q(r.slot)}`
             : r.min_inches ? `min ${r.min_inches}"` : null;
  const diffs = (GRID.regulations_differences || []);
  /* Rules RIDEM published that this app applied on its own, each with the
     notice behind it. This is the trade made instead of an approval step:
     nothing waits for a human, and every number is one tap from the sentence
     it was read out of. A limit with no link would be a number of unknown
     origin sitting on top of a cited one. */
  const app = (r.applied || []).map(a => {
    const way = a.relaxes === true ? '<b class="rl">more room</b>'
              : a.relaxes === false ? 'tighter' : '';
    return `<div class="ld ap">` +
      `<span class="apv">${q(a.value)}</span> ` +
      `<span class="apm">${q((a.change_type||'').replace(/_/g,' '))}` +
      `${a.sub_fishery ? ' · ' + q(a.sub_fishery.replace(/_/g,' ')) : ''}` +
      `${a.effective_date ? ' · from ' + q(a.effective_date) : ''}` +
      `${a.reopens_on ? ' · until ' + q(a.reopens_on) : ''} ${way}</span>` +
      (a.source_url
        ? ` <a class="apl" href="${q(a.source_url)}" target="_blank"
             rel="noopener">check notice ↗</a>` : '') +
      (a.quote ? `<div class="apq">“${q(a.quote.slice(0,190))}”</div>` : '') +
    `</div>`;
  }).join('');

  const detail =
    (app ? `<div class="ld dim">applied automatically from RIDEM:</div>` + app : '') +
    (GRID.license_mode === 'commercial' && diffs.length
      ? diffs.map(d => `<div class="ld">· ${q(d)}</div>`).join('') : '') +
    (r.advisory
      ? `<div class="ld warn">Commercial limits change in-season — confirm on ` +
        `${q(r.hotline || '')} before landing fish.</div>` : '') +
    (r.checked_on ? `<div class="ld dim">read from RIDEM ${q(r.checked_on)}` +
      `${r.days_since_checked > 30 ? ' — stale, re-check' : ''}</div>` : '');

  el.innerHTML =
    `<div class="lg ${r.open ? 'open' : 'shut'}">` +
      `<b>${r.open ? 'OPEN' : 'CLOSED'}</b>` +
      (size ? `<span class="sz">${size}</span>` : '') +
      `<span class="ln">${q(r.season || GRID.regulations_line || '')}</span>` +
    `</div>` +
    (detail ? `<details class="lmore"><summary>commercial detail</summary>`
              + detail + `</details>` : '');
}
window.paintLegal = paintLegal;

// ------------------------------------------------------- tap anywhere on the water
//
// The nineteen curated spots are landmarks. The marks that actually matter are
// the ones you found, and they are not on anybody's list -- so any point on the
// chart answers the same questions, resolved to its own current station.
//
// The station binding leads the card on purpose. At a curated spot that binding
// was checked by hand; here it was inferred, it is the part most likely to be
// wrong, and a number with an unstated provenance is worse than no number.

function fmtCoord(lat, lon){
  const dm = (v, pos, neg) => {
    const h = v >= 0 ? pos : neg, a = Math.abs(v);
    const d = Math.floor(a), m = (a - d) * 60;
    return `${d}°${m.toFixed(3)}'${h}`;
  };
  return `${dm(lat,'N','S')} ${dm(lon,'E','W')}`;
}

function markPin(lat, lon){
  if (MARK_PIN) MARK_PIN.remove();
  const el = document.createElement('div');
  el.className = 'markpin';
  el.title = 'tap the map again to move this mark';
  MARK_PIN = new maplibregl.Marker({element:el, anchor:'center'})
    .setLngLat([lon, lat]).addTo(map);
}

async function reportAt(lat, lon){
  markPin(lat, lon);
  $('#markbox').innerHTML =
    `<p class="ph">Mark</p><div class="card"><div class="sub">reading noaa…</div></div>`;
  try{
    const q = new URLSearchParams({lat: lat.toFixed(5), lon: lon.toFixed(5),
                                   species: $('#species').value, hours: 48});
    const res = await fetch('/api/at?' + q);
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    MARK = d;
    renderMark();
  }catch(err){
    $('#markbox').innerHTML =
      `<p class="ph">Mark</p><div class="card"><div class="sub" style="color:#E0705F">
       ${err.message}</div></div>`;
  }
}

function renderMark(){
  const d = MARK;
  if (!d){ $('#markbox').innerHTML = ''; return; }
  const st = d.stations, pl = d.place, now = d.now;
  const cur = st.current, tide = st.tide, temp = st.temp;

  const place = [];
  if (pl.depth){
    // Either end of a charted depth area can be absent; showing the missing
    // one rendered "30–0 ft".
    const lo = pl.depth.min_ft, hi = pl.depth.max_ft;
    if (lo != null && hi != null) place.push(`${Math.round(lo)}–${Math.round(hi)} ft`);
    else if (lo != null)          place.push(`${Math.round(lo)}+ ft`);
    else if (hi != null)          place.push(`less than ${Math.round(hi)} ft`);
  }
  if (pl.bottom) place.push(pl.bottom.bottom);
  for (const [k, n] of Object.entries(pl.structure || {})) place.push(`${n} ${k}`);
  // Outside the cached bay there is no chart to be empty. Saying nothing at
  // all would let a blank row read as clear water over a reef.
  if (!place.length && pl.charted === false) place.push('no chart data here');

  $('#markbox').innerHTML = `
    <p class="ph">Mark</p>
    <div class="card">
      <h3 style="font-family:var(--mono);font-size:12px">${fmtCoord(d.lat, d.lon)}</h3>
      <div class="sub">${d.lat.toFixed(5)}, ${d.lon.toFixed(5)}</div>
      <div class="big" style="color:${colour(now.score)};margin-top:10px">
        ${now.score.toFixed(1)}</div>
      <div class="sub">right now · ${d.species_name}</div>

      <dl class="kv" style="margin-top:10px">
        <dt>current</dt><dd>${(now.current_speed??0).toFixed(2)} kt ${now.current_dir||''}</dd>
        <dt>water</dt><dd>${now.water_temp_f!=null?now.water_temp_f.toFixed(1)+' °F':'—'}</dd>
        <dt>wind</dt><dd>${now.wind_kt!=null?now.wind_kt.toFixed(0)+' kt '+(now.wind_dir||''):'—'}</dd>
        <dt>light</dt><dd>${now.light_phase||'—'}</dd>
        <dt>tide</dt><dd>${now.next_tide||'—'}</dd>
        ${place.length?`<dt>place</dt><dd>${place.join(' · ')}</dd>`:''}
      </dl>
      <div class="why">${now.explain||''}</div>
    </div>

    <div class="card" style="margin-top:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span class="ph" style="margin:0">Stations</span>
        <span class="conf ${st.confidence}">${st.confidence}</span>
      </div>
      <dl class="kv">
        <dt>current</dt><dd>${cur.name} <span style="color:var(--muted)">·
          ${cur.distance_nm} nm</span></dd>
        <dt>tide</dt><dd>${tide.name} <span style="color:var(--muted)">·
          ${tide.distance_nm} nm</span></dd>
        ${temp && temp.id !== tide.id ? `<dt>temp</dt><dd>${temp.name}
          <span style="color:var(--muted)">· ${temp.distance_nm} nm</span></dd>` : ''}
      </dl>
      ${(st.rejected||[]).length ? `<div class="note" style="margin-top:8px">
        skipped ${st.rejected.length} closer station${st.rejected.length>1?'s':''}
        across land: ${st.rejected.slice(0,2).map(r=>r.name).join('; ')}</div>` : ''}
      ${(st.warnings||[]).map(w=>`<div class="markwarn">! ${w}</div>`).join('')}
    </div>

    ${d.windows.length ? `<div class="card" style="margin-top:8px">
      <span class="ph" style="margin:0">Windows</span>
      ${d.windows.map(w => {
        const a = new Date(w.start), b = new Date(w.end);
        const opt = {weekday:'short', hour:'2-digit', minute:'2-digit'};
        const span = +a === +b ? a.toLocaleString([], opt)
          : a.toLocaleString([], opt) + '–' + b.toLocaleTimeString([],
              {hour:'2-digit', minute:'2-digit'});
        return `<div class="markwin"><span>${span}</span>
          <span style="color:${colour(w.score)}">${w.score.toFixed(1)}</span></div>`;
      }).join('')}
    </div>` : ''}

    ${d.prior_is_default ? `<p class="note" style="margin-top:8px">
      No history here, so this is scored with the default spot prior
      (${d.prior.toFixed(2)}) and no preferred tide stage — unlike a curated
      spot, none of this score is local knowledge.</p>` : ''}

    <div style="display:flex;gap:6px;margin-top:8px">
      <button id="markcopy" style="flex:1">copy coords</button>
      <button id="markclear" style="flex:1">clear</button>
    </div>`;

  $('#markcopy').onclick = () => {
    navigator.clipboard?.writeText(`${d.lat.toFixed(5)},${d.lon.toFixed(5)}`);
    $('#markcopy').textContent = 'copied';
    setTimeout(() => { const b = $('#markcopy'); if (b) b.textContent = 'copy coords'; }, 1400);
  };
  $('#markclear').onclick = () => {
    MARK = null;
    if (MARK_PIN){ MARK_PIN.remove(); MARK_PIN = null; }
    $('#markbox').innerHTML = '';
  };
}

// Chart features and bait sightings have their own click handlers and their own
// popups; a tap that landed on one of those was not a request for a report.
map.on('click', e => {
  if (!MAP_READY) return;
  // Fills are excluded on purpose. The depth layer covers every square metre of
  // water, so counting it as "you clicked a feature" would swallow every tap
  // and the map would silently stop answering.
  /* Contours and the modelled bathymetry are background, not things to ask
     about. They cover most of the water, so tapping anywhere near the bay
     hit a depth line and opened a popup about it instead of reporting the
     coordinate you actually meant. Their numbers are already drawn on the
     line; a popup adds nothing and costs you the tap. */
  const NOT_CLICKABLE = new Set(['contours', 'bathy', 'depth_area']);
  const clickable = ((map.getStyle() || {}).layers || [])
    .map(l => l.id)
    .filter(id => (id === 'bait' || id === 'structure' ||
                   (id.startsWith('c-') && !id.endsWith('-lbl') &&
                    !NOT_CLICKABLE.has(id.slice(2)) &&
                    (CHART_STYLE[id.slice(2)] || {}).kind !== 'fill'))
                  && map.getLayer(id));

  // A finger is about 9 mm across; a charted rock is three pixels. Query a box
  // around the tap rather than the pixel under it, and take whatever is nearest
  // its centre -- so a near miss opens the rock you meant instead of silently
  // falling through to "report at this coordinate", which is what made this
  // feel like it took several tries.
  const PAD = matchMedia('(pointer:coarse)').matches ? 14 : 6;
  if (clickable.length){
    const box = [[e.point.x - PAD, e.point.y - PAD],
                 [e.point.x + PAD, e.point.y + PAD]];
    const hits = map.queryRenderedFeatures(box, {layers: clickable});
    if (hits.length){
      let best = hits[0], bestD = Infinity;
      for (const f of hits){
        const g = f.geometry || {};
        if (g.type !== 'Point'){ best = f; break; }
        const pt = map.project(g.coordinates);
        const d = Math.hypot(pt.x - e.point.x, pt.y - e.point.y);
        if (d < bestD){ bestD = d; best = f; }
      }
      const layer = best.layer && best.layer.id;
      if (layer && layer.startsWith('c-'))
        chartPopup(Object.assign({}, e, {features:[best]}), layer.slice(2));
      return;
    }
  }
  reportAt(e.lngLat.lat, e.lngLat.lng);
  // On a phone the sheet IS the answer -- the side panel is off-screen and
  // the forecast is not what you want mid-drift anyway. showConditions is
  // defined further down the file, so guard against firing before it exists.
  if (window.showConditions) window.showConditions(e.lngLat.lat, e.lngLat.lng);
});

(async function boot(){
  try{
    await loadSpecies();
    await loadGrid();
    refreshNetState();

    if (!MAP_READY) await loadCharts();   // still populate the menu + counts
  }catch(err){

       <span style="color:#8CA3A8;text-transform:none;letter-spacing:0">${err.message}</span></div>`;
  }
})();
